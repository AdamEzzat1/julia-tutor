# Website for julia-tutor: Quarto pages + one React bundle (built from ../web
# into assets/app/) + data generated by `tutor site-data` (data/tutor.json, bundled
# into the app at build time). Build: `npm --prefix ../web run build && quarto render`.
project:
  type: website
  output-dir: _site
  resources:
    - assets/app/app.js
    - assets/app/app.css
    - assets/figures/**
    - .nojekyll

website:
  title: "julia-tutor"
  description: "Courses in scientific computing and scientific ML in Julia, with rule-based, deterministic feedback: recorded example outputs, sandboxed grading on your own machine, no LLM in the feedback loop."
  site-url: "https://adamezzat1.github.io/julia-tutor/"
  repo-url: "https://github.com/AdamEzzat1/julia-tutor"
  page-navigation: true
  navbar:
    logo: assets/mark.svg
    logo-alt: "julia-tutor"
    # Learn: what a learner uses. How it works: how the feedback is produced
    # (author-facing). A course's label carries its status unless it is ready
    # (web/src/site.test.ts checks this against course/courses/*.toml).
    left:
      - href: index.qmd
        text: Home
      - text: Learn
        menu:
          - href: course-core.qmd
            text: "Core Julia"
          - href: course-science.qmd
            text: "Julia for science"
          - href: course-scicomp.qmd
            text: "Scientific computing"
          - href: course-sciml.qmd
            text: "Scientific ML (in progress)"
          - text: "---"
          - href: course.qmd
            text: Units and practice
          - href: projects.qmd
            text: Projects
          - href: cases.qmd
            text: Cases
          - href: sandbox.qmd
            text: Sandbox
          - href: lessons.qmd
            text: Quizzes
      - text: How it works
        menu:
          - href: explain.qmd
            text: Explain
          - href: holemap.qmd
            text: Hole map
          - href: rules.qmd
            text: Rules
          - href: design.qmd
            text: Design
    right:
      - icon: github
        href: "https://github.com/AdamEzzat1/julia-tutor"
        aria-label: "Source on GitHub"
  page-footer:
    left: "julia-tutor · rule-based, deterministic, no LLM in the feedback loop"
    right: "Not affiliated with the Julia project. Built with Quarto and React."

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: theme-shared.css
    toc: false
    page-layout: full
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="assets/app/app.css">
    include-after-body:
      - text: |
          <script type="module" src="assets/app/app.js"></script>
