<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>The QFT circuit on three qubits</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker></defs>
<rect width="720" height="300" fill="#ffffff"/>
<text x="20.0" y="22.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">The QFT on 3 qubits: top qubit first, then the swap</text>
<text x="60.0" y="85.0" font-size="14" fill="#2b2733" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q2</text>
<line x1="70" y1="80" x2="680" y2="80" stroke="#2b2733" stroke-width="1.5"/>
<text x="60.0" y="155.0" font-size="14" fill="#2b2733" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q1</text>
<line x1="70" y1="150" x2="680" y2="150" stroke="#2b2733" stroke-width="1.5"/>
<text x="60.0" y="225.0" font-size="14" fill="#2b2733" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q0</text>
<line x1="70" y1="220" x2="680" y2="220" stroke="#2b2733" stroke-width="1.5"/>
<rect x="102" y="62" width="36" height="36" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<text x="120.0" y="86.0" font-size="15" fill="#2b2733" text-anchor="middle" font-weight="600">H</text>
<line x1="190" y1="80" x2="190" y2="150" stroke="#3657c8" stroke-width="1.5"/>
<circle cx="190" cy="150" r="6" fill="#3657c8"/>
<circle cx="190" cy="80" r="6" fill="#3657c8"/>
<rect x="196" y="104.0" width="34" height="20" fill="#ffffff"/>
<text x="198.0" y="119.0" font-size="12" fill="#3657c8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">π/2</text>
<line x1="265" y1="80" x2="265" y2="220" stroke="#3657c8" stroke-width="1.5"/>
<circle cx="265" cy="220" r="6" fill="#3657c8"/>
<circle cx="265" cy="80" r="6" fill="#3657c8"/>
<rect x="271" y="139.0" width="34" height="20" fill="#ffffff"/>
<text x="273.0" y="154.0" font-size="12" fill="#3657c8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">π/4</text>
<rect x="332" y="132" width="36" height="36" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<text x="350.0" y="156.0" font-size="15" fill="#2b2733" text-anchor="middle" font-weight="600">H</text>
<line x1="420" y1="150" x2="420" y2="220" stroke="#3657c8" stroke-width="1.5"/>
<circle cx="420" cy="220" r="6" fill="#3657c8"/>
<circle cx="420" cy="150" r="6" fill="#3657c8"/>
<rect x="426" y="174.0" width="34" height="20" fill="#ffffff"/>
<text x="428.0" y="189.0" font-size="12" fill="#3657c8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">π/2</text>
<rect x="487" y="202" width="36" height="36" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<text x="505.0" y="226.0" font-size="15" fill="#2b2733" text-anchor="middle" font-weight="600">H</text>
<line x1="600" y1="80" x2="600" y2="220" stroke="#7b4bb8" stroke-width="1.5"/>
<line x1="592" y1="72" x2="608" y2="88" stroke="#7b4bb8" stroke-width="2"/>
<line x1="592" y1="88" x2="608" y2="72" stroke="#7b4bb8" stroke-width="2"/>
<line x1="592" y1="212" x2="608" y2="228" stroke="#7b4bb8" stroke-width="2"/>
<line x1="592" y1="228" x2="608" y2="212" stroke="#7b4bb8" stroke-width="2"/>
<text x="600.0" y="252.0" font-size="12" fill="#7b4bb8" text-anchor="middle" >swap</text>
<line x1="100" y1="50" x2="290" y2="50" stroke="#776f82" stroke-width="1"/>
<text x="195.0" y="45.0" font-size="11" fill="#776f82" text-anchor="middle" >qubit 2: H, then phases from q1 and q0</text>
<line x1="330" y1="50" x2="445" y2="50" stroke="#776f82" stroke-width="1"/>
<text x="387.5" y="45.0" font-size="11" fill="#776f82" text-anchor="middle" >qubit 1</text>
<line x1="485" y1="50" x2="525" y2="50" stroke="#776f82" stroke-width="1"/>
<text x="505.0" y="45.0" font-size="11" fill="#776f82" text-anchor="middle" >qubit 0</text>
<text x="20.0" y="288.0" font-size="12" fill="#776f82" text-anchor="start" >● ● : controlled phase CP(λ), symmetric in its two qubits; the angle between qubits j and k is π/2^(j−k).</text>
</svg>
