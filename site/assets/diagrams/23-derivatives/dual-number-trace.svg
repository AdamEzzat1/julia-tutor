<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>A dual number carried through a function</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect x="0" y="0" width="720" height="320" fill="#ffffff"/>
<text x="360.0" y="26.0" font-size="15" text-anchor="middle" fill="#2b2733" >f(x) = 3x·x + sin(x), run on the dual number x = (2, 1)</text>
<text x="360.0" y="46.0" font-size="13" text-anchor="middle" fill="#776f82" >each box holds (value, derivative); the seed 1 means dx/dx = 1</text>
<rect x="20" y="150" width="120" height="54" rx="6" fill="#ffffff" stroke="#3657c8" stroke-width="1.5"/>
<text x="80.0" y="172.0" font-size="14" text-anchor="middle" fill="#2b2733" >x</text>
<text x="80.0" y="192.0" font-size="14" text-anchor="middle" fill="#2b2733" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(2, 1)</text>
<rect x="200" y="80" width="130" height="54" rx="6" fill="#ffffff" stroke="#776f82" stroke-width="1.5"/>
<text x="265.0" y="102.0" font-size="14" text-anchor="middle" fill="#2b2733" >3x</text>
<text x="265.0" y="122.0" font-size="14" text-anchor="middle" fill="#2b2733" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(6, 3)</text>
<rect x="390" y="80" width="140" height="54" rx="6" fill="#ffffff" stroke="#776f82" stroke-width="1.5"/>
<text x="460.0" y="102.0" font-size="14" text-anchor="middle" fill="#2b2733" >3x · x</text>
<text x="460.0" y="122.0" font-size="14" text-anchor="middle" fill="#2b2733" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(12, 12)</text>
<rect x="290" y="230" width="160" height="54" rx="6" fill="#ffffff" stroke="#776f82" stroke-width="1.5"/>
<text x="370.0" y="252.0" font-size="14" text-anchor="middle" fill="#2b2733" >sin(x)</text>
<text x="370.0" y="272.0" font-size="14" text-anchor="middle" fill="#2b2733" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(0.909, -0.416)</text>
<rect x="560" y="150" width="150" height="54" rx="6" fill="#ffffff" stroke="#3657c8" stroke-width="1.5"/>
<text x="635.0" y="172.0" font-size="14" text-anchor="middle" fill="#2b2733" >f(x) = sum</text>
<text x="635.0" y="192.0" font-size="14" text-anchor="middle" fill="#2b2733" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(12.909, 11.584)</text>
<line x1="140.0" y1="165.0" x2="198.0" y2="115.0" stroke="#776f82" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="140.0" y1="175.0" x2="388.0" y2="120.0" stroke="#776f82" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<line x1="140.0" y1="190.0" x2="288.0" y2="250.0" stroke="#776f82" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330.0" y1="107.0" x2="388.0" y2="107.0" stroke="#776f82" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="530.0" y1="120.0" x2="558.0" y2="165.0" stroke="#776f82" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450.0" y1="255.0" x2="558.0" y2="190.0" stroke="#776f82" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="170.0" y="72.0" font-size="13" text-anchor="start" fill="#776f82" >3 is (3, 0): 3·1 + 0·2 = 3</text>
<text x="400.0" y="66.0" font-size="13" text-anchor="start" fill="#776f82" >product rule: 3·2 + 6·1 = 12</text>
<text x="150.0" y="300.0" font-size="13" text-anchor="start" fill="#776f82" >chain rule: cos(2)·1 = -0.416</text>
<text x="470.0" y="300.0" font-size="13" text-anchor="start" fill="#776f82" >sum rule: 12 + (-0.416) = 11.584</text>
<text x="635.0" y="225.0" font-size="13" text-anchor="middle" fill="#3657c8" >f′(2) = 6·2 + cos(2)</text>
</svg>
