<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>Error against time for the PINN of unit 47 and three finite-difference grids (one recorded run)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="20" y="26" font-size="15" text-anchor="start" fill="#2b2733" font-weight="600">Max error and time, recorded in this unit's last example (log scales, one machine)</text>
<rect x="90" y="50" width="470" height="270" rx="0" fill="none" stroke="#776f82" stroke-width="1"/>
<line x1="90.0" y1="320" x2="90.0" y2="325" stroke="#776f82"/><text x="90.0" y="342" font-size="13" text-anchor="middle" fill="#776f82">1e-5</text>
<line x1="168.3" y1="320" x2="168.3" y2="325" stroke="#776f82"/><text x="168.33333333333331" y="342" font-size="13" text-anchor="middle" fill="#776f82">1e-4</text>
<line x1="246.7" y1="320" x2="246.7" y2="325" stroke="#776f82"/><text x="246.66666666666666" y="342" font-size="13" text-anchor="middle" fill="#776f82">1e-3</text>
<line x1="325.0" y1="320" x2="325.0" y2="325" stroke="#776f82"/><text x="325.0" y="342" font-size="13" text-anchor="middle" fill="#776f82">1e-2</text>
<line x1="403.3" y1="320" x2="403.3" y2="325" stroke="#776f82"/><text x="403.3333333333333" y="342" font-size="13" text-anchor="middle" fill="#776f82">1e-1</text>
<line x1="481.7" y1="320" x2="481.7" y2="325" stroke="#776f82"/><text x="481.6666666666667" y="342" font-size="13" text-anchor="middle" fill="#776f82">1e0</text>
<line x1="560.0" y1="320" x2="560.0" y2="325" stroke="#776f82"/><text x="560.0" y="342" font-size="13" text-anchor="middle" fill="#776f82">1e1</text>
<line x1="85" y1="320.0" x2="90" y2="320.0" stroke="#776f82"/><text x="81" y="325.0" font-size="13" text-anchor="end" fill="#776f82">1e-7</text>
<line x1="85" y1="275.0" x2="90" y2="275.0" stroke="#776f82"/><text x="81" y="280.0" font-size="13" text-anchor="end" fill="#776f82">1e-6</text>
<line x1="85" y1="230.0" x2="90" y2="230.0" stroke="#776f82"/><text x="81" y="235.0" font-size="13" text-anchor="end" fill="#776f82">1e-5</text>
<line x1="85" y1="185.0" x2="90" y2="185.0" stroke="#776f82"/><text x="81" y="190.0" font-size="13" text-anchor="end" fill="#776f82">1e-4</text>
<line x1="85" y1="140.0" x2="90" y2="140.0" stroke="#776f82"/><text x="81" y="145.0" font-size="13" text-anchor="end" fill="#776f82">1e-3</text>
<line x1="85" y1="95.0" x2="90" y2="95.0" stroke="#776f82"/><text x="81" y="100.0" font-size="13" text-anchor="end" fill="#776f82">1e-2</text>
<line x1="85" y1="50.0" x2="90" y2="50.0" stroke="#776f82"/><text x="81" y="55.0" font-size="13" text-anchor="end" fill="#776f82">1e-1</text>
<text x="325.0" y="366" font-size="13" text-anchor="middle" fill="#776f82">time (s)</text>
<text x="22" y="185.0" font-size="13" fill="#776f82" text-anchor="middle" transform="rotate(-90 22 185.0)">max error on 1001 points</text>
<polyline points="119.8,50 119.8,189.9 145.4,189.9 145.4,292.4 560,292.4" fill="none" stroke="#3657c8" stroke-width="1.4" stroke-dasharray="6 4"/>
<circle cx="501.7" cy="214.6" r="6" fill="#776f82"/>
<text x="491.663012899759" y="202.5909793630007" font-size="13" text-anchor="end" fill="#2b2733">PINN: 2.2e-5, 1.8 s</text>
<circle cx="140.4" cy="103.1" r="6" fill="#776f82"/>
<text x="150.403792991418" y="95.1205229006159" font-size="13" text-anchor="start" fill="#2b2733">FD n = 10: 6.6e-3, 4.4e-5 s</text>
<circle cx="119.8" cy="189.9" r="6" fill="#3657c8"/>
<text x="131.78321393407583" y="181.85574287892837" font-size="13" text-anchor="start" fill="#2b2733">FD n = 100: 7.8e-5, 2.4e-5 s</text>
<circle cx="145.4" cy="292.4" r="6" fill="#3657c8"/>
<text x="157.42633046100505" y="310.4247264476119" font-size="13" text-anchor="start" fill="#2b2733">FD n = 1000: 4.1e-7, 5.1e-5 s</text>
<circle cx="584" cy="70" r="6" fill="#3657c8"/><text x="596" y="75" font-size="13" text-anchor="start" fill="#2b2733">on the Pareto front</text>
<circle cx="584" cy="94" r="6" fill="#776f82"/><text x="596" y="99" font-size="13" text-anchor="start" fill="#2b2733">dominated</text>
<line x1="578" y1="118" x2="592" y2="118" stroke="#3657c8" stroke-width="1.4" stroke-dasharray="6 4"/><text x="596" y="123" font-size="13" text-anchor="start" fill="#2b2733">front boundary</text>
<text x="578" y="160" font-size="13" text-anchor="start" fill="#776f82">n = 1000 beats the</text>
<text x="578" y="178" font-size="13" text-anchor="start" fill="#776f82">PINN in both error</text>
<text x="578" y="196" font-size="13" text-anchor="start" fill="#776f82">and time.</text>
<text x="578" y="230" font-size="13" text-anchor="start" fill="#776f82">Microsecond timings</text>
<text x="578" y="248" font-size="13" text-anchor="start" fill="#776f82">are noisy: n = 10 was</text>
<text x="578" y="266" font-size="13" text-anchor="start" fill="#776f82">timed slower than</text>
<text x="578" y="284" font-size="13" text-anchor="start" fill="#776f82">n = 100 in this run.</text>
<text x="578" y="318" font-size="13" text-anchor="start" fill="#2b2733">FD = finite</text>
<text x="578" y="336" font-size="13" text-anchor="start" fill="#2b2733">differences</text>
<text x="20" y="392" font-size="13" text-anchor="start" fill="#776f82">Lower and further left is better. A method is on the front when no other is better at both error and time.</text>
</svg>
