<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
<title>Merit-order supply stack with demand and price</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect width="720" height="370" fill="white"/>
<text x="80.0" y="30.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">Merit order: generators sorted by cost, demand 600 MW</text>
<line x1="80.0" y1="310.0" x2="560.0" y2="310.0" stroke="#776f82" stroke-width="1.5"/>
<line x1="80.0" y1="310.0" x2="80.0" y2="60.0" stroke="#776f82" stroke-width="1.5"/>
<line x1="80.0" y1="310.0" x2="80.0" y2="315.0" stroke="#776f82" stroke-width="1.5"/>
<text x="80.0" y="331.0" font-size="14" fill="#2b2733" text-anchor="middle">0</text>
<line x1="160.0" y1="310.0" x2="160.0" y2="315.0" stroke="#776f82" stroke-width="1.5"/>
<text x="160.0" y="331.0" font-size="14" fill="#2b2733" text-anchor="middle">150</text>
<line x1="240.0" y1="310.0" x2="240.0" y2="315.0" stroke="#776f82" stroke-width="1.5"/>
<text x="240.0" y="331.0" font-size="14" fill="#2b2733" text-anchor="middle">300</text>
<line x1="320.0" y1="310.0" x2="320.0" y2="315.0" stroke="#776f82" stroke-width="1.5"/>
<text x="320.0" y="331.0" font-size="14" fill="#2b2733" text-anchor="middle">450</text>
<line x1="400.0" y1="310.0" x2="400.0" y2="315.0" stroke="#776f82" stroke-width="1.5"/>
<text x="400.0" y="331.0" font-size="14" fill="#2b2733" text-anchor="middle">600</text>
<line x1="480.0" y1="310.0" x2="480.0" y2="315.0" stroke="#776f82" stroke-width="1.5"/>
<text x="480.0" y="331.0" font-size="14" fill="#2b2733" text-anchor="middle">750</text>
<line x1="560.0" y1="310.0" x2="560.0" y2="315.0" stroke="#776f82" stroke-width="1.5"/>
<text x="560.0" y="331.0" font-size="14" fill="#2b2733" text-anchor="middle">900</text>
<line x1="75.0" y1="310.0" x2="80.0" y2="310.0" stroke="#776f82" stroke-width="1.5"/>
<text x="71.0" y="315.0" font-size="14" fill="#2b2733" text-anchor="end">0</text>
<line x1="75.0" y1="247.5" x2="80.0" y2="247.5" stroke="#776f82" stroke-width="1.5"/>
<text x="71.0" y="252.5" font-size="14" fill="#2b2733" text-anchor="end">25</text>
<line x1="75.0" y1="185.0" x2="80.0" y2="185.0" stroke="#776f82" stroke-width="1.5"/>
<text x="71.0" y="190.0" font-size="14" fill="#2b2733" text-anchor="end">50</text>
<line x1="75.0" y1="122.5" x2="80.0" y2="122.5" stroke="#776f82" stroke-width="1.5"/>
<text x="71.0" y="127.5" font-size="14" fill="#2b2733" text-anchor="end">75</text>
<line x1="75.0" y1="60.0" x2="80.0" y2="60.0" stroke="#776f82" stroke-width="1.5"/>
<text x="71.0" y="65.0" font-size="14" fill="#2b2733" text-anchor="end">100</text>
<text x="320.0" y="352.0" font-size="14" fill="#776f82" text-anchor="middle">cumulative capacity (MW)</text>
<text x="24.0" y="185.0" font-size="14" fill="#776f82" text-anchor="middle" transform="rotate(-90 24 185.0)">marginal cost (€/MWh)</text>
<rect x="80.0" y="280.0" width="160.0" height="30.0" fill="#3657c8" opacity="0.8"/>
<text x="160.0" y="272.0" font-size="13" fill="#2b2733" text-anchor="middle">12 €/MWh, 300 MW</text>
<rect x="240.0" y="247.5" width="106.7" height="62.5" fill="#3657c8" opacity="0.8"/>
<text x="293.3" y="239.5" font-size="13" fill="#2b2733" text-anchor="middle">25 €/MWh, 200 MW</text>
<rect x="346.7" y="210.0" width="53.3" height="100.0" fill="#3657c8" opacity="0.8"/>
<rect x="400.0" y="210.0" width="80.0" height="100.0" fill="white" stroke="#776f82" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="413.3" y="202.0" font-size="13" fill="#2b2733" text-anchor="middle">40 €/MWh, 250 MW</text>
<rect x="480.0" y="85.0" width="80.0" height="225.0" fill="white" stroke="#776f82" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="520.0" y="77.0" font-size="13" fill="#2b2733" text-anchor="middle">90 €/MWh, 150 MW</text>
<line x1="400.0" y1="55.0" x2="400.0" y2="310.0" stroke="#2b2733" stroke-width="2"/>
<text x="394.0" y="66.0" font-size="13" fill="#2b2733" text-anchor="end">demand D = 600</text>
<line x1="80.0" y1="210.0" x2="400.0" y2="210.0" stroke="#2f8a4c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="580.0" y="110.0" font-size="13" fill="#2b2733" text-anchor="start">Runs 300, 200, 100 MW</text>
<text x="580.0" y="128.0" font-size="13" fill="#2b2733" text-anchor="start">cost 12600 €/h</text>
<text x="580.0" y="160.0" font-size="13" fill="#2f8a4c" text-anchor="start" font-weight="600">price = cost of the</text>
<text x="580.0" y="178.0" font-size="13" fill="#2f8a4c" text-anchor="start" font-weight="600">marginal unit: 40</text>
<text x="580.0" y="196.0" font-size="13" fill="#776f82" text-anchor="start">(dual of Σ p = D)</text>
<text x="580.0" y="236.0" font-size="13" fill="#776f82" text-anchor="start">dashed: capacity</text>
<text x="580.0" y="254.0" font-size="13" fill="#776f82" text-anchor="start">left unused</text>
</svg>
