<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
<title>Roofline model for the two kernels of the unit</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect width="720" height="370" fill="white"/>
<text x="90.0" y="30.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">Roofline at an assumed 10 GB/s: attainable = min(peak, I × bandwidth)</text>
<line x1="90.0" y1="320.0" x2="520.0" y2="320.0" stroke="#776f82" stroke-width="1.5"/>
<line x1="90.0" y1="320.0" x2="90.0" y2="60.0" stroke="#776f82" stroke-width="1.5"/>
<line x1="129.1" y1="320.0" x2="129.1" y2="325.0" stroke="#776f82" stroke-width="1.5"/>
<text x="129.1" y="341.0" font-size="14" fill="#2b2733" text-anchor="middle">1/16</text>
<line x1="207.3" y1="320.0" x2="207.3" y2="325.0" stroke="#776f82" stroke-width="1.5"/>
<text x="207.3" y="341.0" font-size="14" fill="#2b2733" text-anchor="middle">1/4</text>
<line x1="285.5" y1="320.0" x2="285.5" y2="325.0" stroke="#776f82" stroke-width="1.5"/>
<text x="285.5" y="341.0" font-size="14" fill="#2b2733" text-anchor="middle">1</text>
<line x1="363.6" y1="320.0" x2="363.6" y2="325.0" stroke="#776f82" stroke-width="1.5"/>
<text x="363.6" y="341.0" font-size="14" fill="#2b2733" text-anchor="middle">4</text>
<line x1="441.8" y1="320.0" x2="441.8" y2="325.0" stroke="#776f82" stroke-width="1.5"/>
<text x="441.8" y="341.0" font-size="14" fill="#2b2733" text-anchor="middle">16</text>
<line x1="520.0" y1="320.0" x2="520.0" y2="325.0" stroke="#776f82" stroke-width="1.5"/>
<text x="520.0" y="341.0" font-size="14" fill="#2b2733" text-anchor="middle">64</text>
<line x1="85.0" y1="320.0" x2="90.0" y2="320.0" stroke="#776f82" stroke-width="1.5"/>
<text x="81.0" y="325.0" font-size="14" fill="#2b2733" text-anchor="end">0.1</text>
<line x1="85.0" y1="233.3" x2="90.0" y2="233.3" stroke="#776f82" stroke-width="1.5"/>
<text x="81.0" y="238.3" font-size="14" fill="#2b2733" text-anchor="end">1</text>
<line x1="85.0" y1="146.7" x2="90.0" y2="146.7" stroke="#776f82" stroke-width="1.5"/>
<text x="81.0" y="151.7" font-size="14" fill="#2b2733" text-anchor="end">10</text>
<line x1="85.0" y1="60.0" x2="90.0" y2="60.0" stroke="#776f82" stroke-width="1.5"/>
<text x="81.0" y="65.0" font-size="14" fill="#2b2733" text-anchor="end">100</text>
<text x="305.0" y="362.0" font-size="14" fill="#776f82" text-anchor="middle">arithmetic intensity I, flop per byte (log scale)</text>
<text x="26.0" y="190.0" font-size="14" fill="#776f82" text-anchor="middle" transform="rotate(-90 26 190.0)">GFLOP/s (log scale)</text>
<polyline points="90.0,277.1 347.4,105.3 520.0,105.3" fill="none" stroke="#2b2733" stroke-width="2.5"/>
<text x="441.8" y="95.3" font-size="13" fill="#776f82" text-anchor="middle">peak of the core (schematic height)</text>
<text x="165.9" y="199.6" font-size="13" fill="#776f82" text-anchor="middle" transform="rotate(-38 165.9 206.5)">slope: 10 GB/s</text>
<line x1="145.3" y1="320.0" x2="145.3" y2="240.2" stroke="#3657c8" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="145.3" cy="240.2" r="5.5" fill="#3657c8" stroke="none"/>
<line x1="402.7" y1="320.0" x2="402.7" y2="105.3" stroke="#3657c8" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="402.7" cy="68.4" r="5" fill="white" stroke="#3657c8"/>
<line x1="402.7" y1="105.3" x2="402.7" y2="68.4" stroke="#3657c8" stroke-width="1" stroke-dasharray="2 3"/>
<circle cx="546.0" cy="120.0" r="5.5" fill="#3657c8" stroke="none"/>
<text x="558.0" y="125.0" font-size="13" fill="#3657c8" text-anchor="start" font-weight="600">stream triad</text>
<text x="558.0" y="143.0" font-size="13" fill="#776f82" text-anchor="start">I = 1/12; at 10 GB/s at</text>
<text x="558.0" y="161.0" font-size="13" fill="#776f82" text-anchor="start">most 0.83 GFLOP/s</text>
<circle cx="546.0" cy="200.0" r="5" fill="white" stroke="#3657c8"/>
<text x="558.0" y="205.0" font-size="13" fill="#3657c8" text-anchor="start" font-weight="600">Horner, degree 64</text>
<text x="558.0" y="223.0" font-size="13" fill="#776f82" text-anchor="start">I = 8; memory would</text>
<text x="558.0" y="241.0" font-size="13" fill="#776f82" text-anchor="start">allow 80 (open circle),</text>
<text x="558.0" y="259.0" font-size="13" fill="#776f82" text-anchor="start">so the core sets the</text>
<text x="558.0" y="277.0" font-size="13" fill="#776f82" text-anchor="start">limit, below the roof</text>
</svg>
