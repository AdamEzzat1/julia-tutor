<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>A 1-D grid with the three-point stencil</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker>
</defs>
<rect width="720" height="280" fill="#ffffff"/>
<text x="20.0" y="26.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">The method of lines: one ODE per interior grid point</text>
<line x1="40.0" y1="110.0" x2="680.0" y2="110.0" stroke="#776f82" stroke-width="1.5"/>
<rect x="51.0" y="101" width="18" height="18" fill="#2b2733"/>
<circle cx="120.0" cy="110.0" r="8" fill="#ffffff" stroke="#776f82" stroke-width="1.5"/>
<circle cx="180.0" cy="110.0" r="8" fill="#ffffff" stroke="#776f82" stroke-width="1.5"/>
<circle cx="240.0" cy="110.0" r="8" fill="#ffffff" stroke="#776f82" stroke-width="1.5"/>
<circle cx="300.0" cy="110.0" r="8" fill="#3657c8" stroke="#3657c8" stroke-width="1.5"/>
<circle cx="360.0" cy="110.0" r="8" fill="#3657c8" stroke="#3657c8" stroke-width="1.5"/>
<circle cx="420.0" cy="110.0" r="8" fill="#3657c8" stroke="#3657c8" stroke-width="1.5"/>
<circle cx="480.0" cy="110.0" r="8" fill="#ffffff" stroke="#776f82" stroke-width="1.5"/>
<circle cx="540.0" cy="110.0" r="8" fill="#ffffff" stroke="#776f82" stroke-width="1.5"/>
<circle cx="600.0" cy="110.0" r="8" fill="#ffffff" stroke="#776f82" stroke-width="1.5"/>
<rect x="651.0" y="101" width="18" height="18" fill="#2b2733"/>
<text x="60.0" y="142.0" font-size="13" fill="#2b2733" text-anchor="middle">x₀ = 0</text>
<text x="660.0" y="142.0" font-size="13" fill="#2b2733" text-anchor="middle">x₁₀ = 1</text>
<text x="60.0" y="88.0" font-size="13" fill="#776f82" text-anchor="middle">u₀ = 0</text>
<text x="660.0" y="88.0" font-size="13" fill="#776f82" text-anchor="middle">u₁₀ = 0</text>
<text x="300.0" y="88.0" font-size="15" fill="#3657c8" text-anchor="middle" font-weight="600">1</text>
<text x="360.0" y="88.0" font-size="15" fill="#3657c8" text-anchor="middle" font-weight="600">-2</text>
<text x="420.0" y="88.0" font-size="15" fill="#3657c8" text-anchor="middle" font-weight="600">1</text>
<text x="300.0" y="142.0" font-size="13" fill="#3657c8" text-anchor="middle">xᵢ₋₁</text>
<text x="360.0" y="142.0" font-size="13" fill="#3657c8" text-anchor="middle">xᵢ</text>
<text x="420.0" y="142.0" font-size="13" fill="#3657c8" text-anchor="middle">xᵢ₊₁</text>
<line x1="120.0" y1="158.0" x2="180.0" y2="158.0" stroke="#776f82" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="180.0" y1="158.0" x2="120.0" y2="158.0" stroke="#776f82" stroke-width="1" marker-end="url(#arrow)"/>
<text x="150.0" y="176.0" font-size="13" fill="#776f82" text-anchor="middle">dx</text>
<text x="360.0" y="210.0" font-size="16" fill="#3657c8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">duᵢ/dt = κ (uᵢ₋₁ - 2uᵢ + uᵢ₊₁) / dx²</text>
<text x="360.0" y="240.0" font-size="13" fill="#776f82" text-anchor="middle">Weights 1, -2, 1 over dx²: second order, error about dx² |u⁗| / 12.</text>
<text x="360.0" y="260.0" font-size="13" fill="#776f82" text-anchor="middle">Filled squares are boundary values (given, not unknowns); open circles are the n = 9 unknowns.</text>
</svg>
