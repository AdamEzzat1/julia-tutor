<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>The teleportation circuit</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker></defs>
<rect width="760" height="340" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">Teleportation: Alice's message on q0 ends on Bob's q2</text>
<text x="68.0" y="90.0" font-size="14" fill="#2b2733" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q0  φ</text>
<text x="68.0" y="165.0" font-size="14" fill="#2b2733" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q1  |0⟩</text>
<text x="68.0" y="255.0" font-size="14" fill="#2b2733" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q2  |0⟩</text>
<line x1="78" y1="85" x2="490" y2="85" stroke="#2b2733" stroke-width="1.5"/>
<line x1="78" y1="160" x2="490" y2="160" stroke="#2b2733" stroke-width="1.5"/>
<line x1="78" y1="250" x2="720" y2="250" stroke="#2b2733" stroke-width="1.5"/>
<text x="735.0" y="255.0" font-size="15" fill="#2e7d4f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600">φ</text>
<rect x="105" y="125" width="150" height="160" rx="6" fill="#7b4bb8" fill-opacity="0.06" stroke="#7b4bb8" stroke-dasharray="5 4"/>
<text x="180.0" y="302.0" font-size="12" fill="#7b4bb8" text-anchor="middle" >Bell pair, made beforehand</text>
<rect x="122" y="142" width="36" height="36" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<text x="140.0" y="166.0" font-size="15" fill="#2b2733" text-anchor="middle" font-weight="600">H</text>
<line x1="215" y1="160" x2="215" y2="263" stroke="#2b2733" stroke-width="1.5"/>
<circle cx="215" cy="160" r="6" fill="#2b2733"/>
<circle cx="215" cy="250" r="13" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<line x1="202" y1="250" x2="228" y2="250" stroke="#2b2733" stroke-width="1.5"/>
<line x1="215" y1="237" x2="215" y2="263" stroke="#2b2733" stroke-width="1.5"/>
<rect x="280" y="55" width="230" height="135" rx="6" fill="#3657c8" fill-opacity="0.06" stroke="#3657c8" stroke-dasharray="5 4"/>
<text x="395.0" y="50.0" font-size="13" fill="#3657c8" text-anchor="middle" font-weight="600">Alice</text>
<line x1="310" y1="85" x2="310" y2="173" stroke="#2b2733" stroke-width="1.5"/>
<circle cx="310" cy="85" r="6" fill="#2b2733"/>
<circle cx="310" cy="160" r="13" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<line x1="297" y1="160" x2="323" y2="160" stroke="#2b2733" stroke-width="1.5"/>
<line x1="310" y1="147" x2="310" y2="173" stroke="#2b2733" stroke-width="1.5"/>
<rect x="352" y="67" width="36" height="36" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<text x="370.0" y="91.0" font-size="15" fill="#2b2733" text-anchor="middle" font-weight="600">H</text>
<rect x="440" y="67" width="40" height="36" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<path d="M447,94 A14,14 0 0 1 473,94" fill="none" stroke="#2b2733" stroke-width="1.4"/>
<line x1="460" y1="94" x2="470" y2="76" stroke="#2b2733" stroke-width="1.4"/>
<text x="492.0" y="77.0" font-size="13" fill="#3657c8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m0</text>
<rect x="440" y="142" width="40" height="36" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<path d="M447,169 A14,14 0 0 1 473,169" fill="none" stroke="#2b2733" stroke-width="1.4"/>
<line x1="460" y1="169" x2="470" y2="151" stroke="#2b2733" stroke-width="1.4"/>
<text x="492.0" y="152.0" font-size="13" fill="#3657c8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m1</text>
<polyline points="480,160 590,160 590,232" fill="none" stroke="#776f82" stroke-width="5"/>
<polyline points="480,160 590,160 590,232" fill="none" stroke="#ffffff" stroke-width="2"/>
<polyline points="480,85 670,85 670,232" fill="none" stroke="#776f82" stroke-width="5"/>
<polyline points="480,85 670,85 670,232" fill="none" stroke="#ffffff" stroke-width="2"/>
<rect x="572" y="232" width="36" height="36" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="590.0" y="256.0" font-size="15" fill="#2e7d4f" text-anchor="middle" font-weight="600">X</text>
<rect x="652" y="232" width="36" height="36" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="670.0" y="256.0" font-size="15" fill="#2e7d4f" text-anchor="middle" font-weight="600">Z</text>
<text x="630.0" y="300.0" font-size="12" fill="#2e7d4f" text-anchor="middle" >Bob: X if m1 = 1, then Z if m0 = 1</text>
<text x="20.0" y="328.0" font-size="12" fill="#776f82" text-anchor="start" >Single lines are qubits, double lines classical bits. Time runs left to right.</text>
</svg>
