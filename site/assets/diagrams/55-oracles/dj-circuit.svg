<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>The Deutsch-Jozsa circuit</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker></defs>
<rect width="760" height="330" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">Deutsch-Jozsa: one query, with the ancilla in |−⟩</text>
<text x="80.0" y="105.0" font-size="14" fill="#2b2733" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|0…0⟩</text>
<text x="80.0" y="205.0" font-size="14" fill="#2b2733" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|1⟩</text>
<line x1="88" y1="100" x2="600" y2="100" stroke="#2b2733" stroke-width="3"/>
<line x1="104" y1="109" x2="116" y2="91" stroke="#2b2733" stroke-width="1.5"/>
<text x="110.0" y="86.0" font-size="12" fill="#776f82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">n</text>
<line x1="88" y1="200" x2="700" y2="200" stroke="#2b2733" stroke-width="1.5"/>
<rect x="144.0" y="80" width="52" height="40" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<text x="170.0" y="106.0" font-size="15" fill="#2b2733" text-anchor="middle" font-weight="600">H⊗n</text>
<rect x="148.0" y="180" width="44" height="40" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<text x="170.0" y="206.0" font-size="15" fill="#2b2733" text-anchor="middle" font-weight="600">H</text>
<rect x="300" y="74" width="80" height="152" fill="#ffffff" stroke="#7b4bb8" stroke-width="2"/>
<text x="340.0" y="156.0" font-size="16" fill="#7b4bb8" text-anchor="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">U_f</text>
<rect x="454.0" y="80" width="52" height="40" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<text x="480.0" y="106.0" font-size="15" fill="#2b2733" text-anchor="middle" font-weight="600">H⊗n</text>
<rect x="560" y="82" width="40" height="36" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<path d="M567,109 A14,14 0 0 1 593,109" fill="none" stroke="#2b2733" stroke-width="1.4"/>
<line x1="580" y1="109" x2="590" y2="91" stroke="#2b2733" stroke-width="1.4"/>
<text x="612.0" y="74.0" font-size="12" fill="#2e7d4f" text-anchor="start" >0…0: constant</text>
<text x="612.0" y="90.0" font-size="12" fill="#2e7d4f" text-anchor="start" >else: balanced</text>
<text x="245.0" y="230.0" font-size="14" fill="#3657c8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|−⟩</text>
<text x="430.0" y="230.0" font-size="13" fill="#3657c8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|−⟩, unchanged</text>
<text x="245.0" y="64.0" font-size="13" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Σ|x⟩ / √2ⁿ</text>
<text x="430.0" y="64.0" font-size="13" fill="#7b4bb8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Σ (−1)^f(x) |x⟩ / √2ⁿ</text>
<text x="380.0" y="268.0" font-size="13" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">amplitude of |0…0⟩ at the end:  Σ (−1)^f(x) / 2ⁿ  =  ±1 if f is constant,  0 if balanced</text>
<text x="20.0" y="312.0" font-size="12" fill="#776f82" text-anchor="start" >The oracle U_f |x⟩|y⟩ = |x⟩|y ⊻ f(x)⟩ is queried once. With y in |−⟩ the bit flip becomes a sign on |x⟩: phase kickback.</text>
</svg>
