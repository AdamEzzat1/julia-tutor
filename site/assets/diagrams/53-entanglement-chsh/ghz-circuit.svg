<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>Bell and GHZ circuit</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker></defs>
<rect width="700" height="300" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">H, then a chain of CNOTs: Bell pair on q0, q1; GHZ state on all three</text>
<text x="60.0" y="95.0" font-size="14" fill="#2b2733" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q0  |0⟩</text>
<line x1="75" y1="90" x2="600" y2="90" stroke="#2b2733" stroke-width="1.5"/>
<text x="60.0" y="165.0" font-size="14" fill="#2b2733" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q1  |0⟩</text>
<line x1="75" y1="160" x2="600" y2="160" stroke="#2b2733" stroke-width="1.5"/>
<text x="60.0" y="235.0" font-size="14" fill="#2b2733" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q2  |0⟩</text>
<line x1="75" y1="230" x2="600" y2="230" stroke="#2b2733" stroke-width="1.5"/>
<rect x="130" y="70" width="40" height="40" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<text x="150.0" y="96.0" font-size="16" fill="#2b2733" text-anchor="middle" font-weight="600">H</text>
<line x1="260" y1="90" x2="260" y2="174" stroke="#2b2733" stroke-width="1.5"/>
<circle cx="260" cy="90" r="6" fill="#2b2733"/>
<circle cx="260" cy="160" r="14" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<line x1="246" y1="160" x2="274" y2="160" stroke="#2b2733" stroke-width="1.5"/>
<line x1="260" y1="146" x2="260" y2="174" stroke="#2b2733" stroke-width="1.5"/>
<line x1="400" y1="160" x2="400" y2="244" stroke="#2b2733" stroke-width="1.5"/>
<circle cx="400" cy="160" r="6" fill="#2b2733"/>
<circle cx="400" cy="230" r="14" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<line x1="386" y1="230" x2="414" y2="230" stroke="#2b2733" stroke-width="1.5"/>
<line x1="400" y1="216" x2="400" y2="244" stroke="#2b2733" stroke-width="1.5"/>
<line x1="330" y1="60" x2="330" y2="250" stroke="#7b4bb8" stroke-dasharray="4 4"/>
<text x="330.0" y="54.0" font-size="12" fill="#7b4bb8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(|00⟩ + |11⟩)/√2 on q0, q1</text>
<line x1="480" y1="60" x2="480" y2="250" stroke="#2e7d4f" stroke-dasharray="4 4"/>
<text x="540.0" y="54.0" font-size="12" fill="#2e7d4f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(|000⟩ + |111⟩)/√2</text>
<text x="20.0" y="284.0" font-size="12" fill="#776f82" text-anchor="start" >Time runs left to right. ● is the control and ⊕ the target of a CNOT: the target flips where the control is 1.</text>
</svg>
