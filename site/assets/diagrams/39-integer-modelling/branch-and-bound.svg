<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 365" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
<title>A schematic branch-and-bound tree</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect width="720" height="365" fill="white"/>
<text x="30.0" y="30.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">Branch and bound (schematic, for a minimization)</text>
<line x1="360.0" y1="100.0" x2="200.0" y2="155.0" stroke="#776f82" stroke-width="1.5"/>
<text x="270.0" y="127.5" font-size="13" fill="#776f82" text-anchor="end">y₁ = 0</text>
<line x1="360.0" y1="100.0" x2="520.0" y2="155.0" stroke="#776f82" stroke-width="1.5"/>
<text x="450.0" y="127.5" font-size="13" fill="#776f82" text-anchor="start">y₁ = 1</text>
<line x1="200.0" y1="195.0" x2="110.0" y2="255.0" stroke="#776f82" stroke-width="1.5"/>
<text x="145.0" y="225.0" font-size="13" fill="#776f82" text-anchor="end">y₂ = 0</text>
<line x1="200.0" y1="195.0" x2="290.0" y2="255.0" stroke="#776f82" stroke-width="1.5"/>
<text x="255.0" y="225.0" font-size="13" fill="#776f82" text-anchor="start">y₂ = 1</text>
<line x1="520.0" y1="195.0" x2="440.0" y2="255.0" stroke="#776f82" stroke-width="1.5"/>
<text x="470.0" y="225.0" font-size="13" fill="#776f82" text-anchor="end">y₂ = 0</text>
<line x1="520.0" y1="195.0" x2="610.0" y2="255.0" stroke="#776f82" stroke-width="1.5"/>
<text x="575.0" y="225.0" font-size="13" fill="#776f82" text-anchor="start">y₂ = 1</text>
<rect x="290" y="60" width="140" height="40" rx="8" fill="white" stroke="#2b2733" stroke-width="1.5"/>
<text x="360.0" y="77.0" font-size="13" fill="#2b2733" text-anchor="middle">LP relaxation</text>
<text x="360.0" y="93.0" font-size="13" fill="#2b2733" text-anchor="middle">bound</text>
<rect x="130" y="155" width="140" height="40" rx="8" fill="white" stroke="#2b2733" stroke-width="1.5"/>
<text x="200.0" y="180.0" font-size="13" fill="#2b2733" text-anchor="middle">LP bound</text>
<rect x="450" y="155" width="140" height="40" rx="8" fill="white" stroke="#2b2733" stroke-width="1.5"/>
<text x="520.0" y="180.0" font-size="13" fill="#2b2733" text-anchor="middle">LP bound</text>
<rect x="40" y="255" width="140" height="40" rx="8" fill="#fbeeed" stroke="#c0392b" stroke-width="1.5"/>
<text x="110.0" y="272.0" font-size="13" fill="#c0392b" text-anchor="middle">infeasible</text>
<text x="110.0" y="288.0" font-size="13" fill="#c0392b" text-anchor="middle">pruned</text>
<rect x="220" y="255" width="140" height="40" rx="8" fill="#eaf5ee" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="290.0" y="272.0" font-size="13" fill="#2f8a4c" text-anchor="middle">integer</text>
<text x="290.0" y="288.0" font-size="13" fill="#2f8a4c" text-anchor="middle">best so far</text>
<rect x="370" y="255" width="140" height="40" rx="8" fill="#fbeeed" stroke="#c0392b" stroke-width="1.5"/>
<text x="440.0" y="272.0" font-size="13" fill="#c0392b" text-anchor="middle">bound worse</text>
<text x="440.0" y="288.0" font-size="13" fill="#c0392b" text-anchor="middle">than best: pruned</text>
<rect x="540" y="255" width="140" height="40" rx="8" fill="white" stroke="#776f82" stroke-width="1.5"/>
<text x="610.0" y="272.0" font-size="13" fill="#776f82" text-anchor="middle">integer, but</text>
<text x="610.0" y="288.0" font-size="13" fill="#776f82" text-anchor="middle">not better</text>
<text x="30.0" y="330.0" font-size="13" fill="#776f82" text-anchor="start">Each box solves an LP with some binaries fixed. A tighter formulation raises every bound,</text>
<text x="30.0" y="348.0" font-size="13" fill="#776f82" text-anchor="start">so more boxes are pruned. Which boxes exist and their order depend on the solver.</text>
</svg>
