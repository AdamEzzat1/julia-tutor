<text x="226.9" y="341.0" font-size="14" fill="#2b2733" text-anchor="middle">65</text>
<line x1="346.2" y1="320.0" x2="346.2" y2="325.0" stroke="#776f82" stroke-width="1.5"/>
<text x="346.2" y="341.0" font-size="14" fill="#2b2733" text-anchor="middle">70</text>
<line x1="465.4" y1="320.0" x2="465.4" y2="325.0" stroke="#776f82" stroke-width="1.5"/>
