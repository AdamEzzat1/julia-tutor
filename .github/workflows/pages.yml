# Build and deploy the website (site/) to GitHub Pages.
#
# No Julia here: site/data/tutor.json is generated by `tutor site-data` and
# committed; scripts/verify_all.sh (ci.yml) fails if it is stale. This job runs
# the web tests (models ported from Julia, cross-checked against the explain
# goldens), builds the React bundle, renders the Quarto site and deploys it.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web tests, typecheck and bundle
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.3.340"
      - name: Render site
        run: quarto render site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
