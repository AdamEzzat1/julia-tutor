# ---- required evidence ---------------------------------------------------------------------

[[evidence]]
id = "costs-of-all-three"
text = "the cost of every method at its cheapest setting, and the ratio"
claims = ["cost_ftcs", "cost_be", "cost_cn", "cost_ratio"]
same_paragraph = true

[[evidence]]
id = "budget-split"
text = "the space and time errors, each against half the budget"
claims = ["space_err", "time_err_cn", "time_err_ftcs"]

[[evidence]]
id = "cancellation"
text = "why a single total error cannot be trusted: a total smaller than its own space error"
claims = ["cancel_total_err", "cancel_space_err"]
same_paragraph = true

[[evidence]]
id = "orders-with-ranges"
text = "the observed orders, each with its fit range"
claims = ["mms_space_order", "mms_dx_min", "mms_dx_max", "mms_time_order_cn", "mms_time_order_be", "mms_dt_min", "mms_dt_max"]

[[evidence]]
id = "stability-against-theory"
text = "the measured stability limit next to von Neumann's"
claims = ["cfl_measured", "cfl_theory"]
same_paragraph = true

[[evidence]]
id = "plausibility"
text = "a physical check that stability alone does not give"
claims = ["cn_peaks", "be_peaks"]
same_paragraph = true

[[evidence]]
id = "robustness"
text = "the conclusion re-checked under a perturbed assumption, and whether it holds"
claims = ["robust_n_space", "robust_cost_cn", "robust_choice", "robust_holds"]
same_paragraph = true

[[evidence]]
id = "validity-range"
text = "the range where the conclusion was tested"
claims = ["valid_n_max", "valid_target"]
same_paragraph = true

[[estimate]]
id = "ns_ftcs"
section = "scales"
compare_with = "ns_ftcs"

[robustness]
assumption = "the initial profile is smooth, sin(pi x)"
perturbed = "a top hat: 1 on (1/4, 3/4), 0 outside, so the solution has steep gradients at early times"
claims = ["robust_n_space", "robust_ns_cn", "robust_cost_cn", "robust_cost_ftcs", "robust_cost_be", "robust_choice", "robust_cost_ratio", "robust_holds"]

# ---- discussion --------------------------------------------------------------------------------

[[discussion]]
kind = "prediction"
text = "Before measuring: if you halve dx, by what factor must FTCS's number of steps grow to stay stable? And Crank-Nicolson's to keep the same time error?"
measured_by = "cost_ratio"

[[discussion]]
kind = "prediction"
text = "Crank-Nicolson is unconditionally stable. Predict what one step of length 0.01 does to the top hat's jumps."
measured_by = "cn_peaks"

[[discussion]]
kind = "rubric"
text = "Your Crank-Nicolson run is stable and second order. Why can it still be wrong for a rough profile with long steps, and what would you change?"

[[discussion]]
kind = "rubric"
text = "The total error of one coarse run met the budget. Why did you not take that run, and what does splitting the budget cost you?"

[[discussion]]
kind = "rubric"
text = "The cost here counts grid-point updates. An implicit step also solves a tridiagonal system. Would counting floating-point operations or wall time change the choice? Measure before answering."

[[discussion]]
kind = "rubric"
text = "In two or three dimensions the tridiagonal solve becomes a sparse solve. Which part of your conclusion would you re-check first?"

# ---- rubric (no software grades these) --------------------------------------------------------

[[rubric]]
step = "question"
criterion = "States the question, the QoI, the cost measure and the accuracy that would answer it, before any result."
levels = ["missing or vague", "stated, but the cost measure or accuracy is not tied to the decision", "stated, and the accuracy is justified by the decision it has to support"]

[[rubric]]
step = "scales"
criterion = "Estimates FTCS's step count from the stability limit before computing, and compares it with the measurement afterwards."
levels = ["no estimate", "an estimate without a method", "an estimate from r <= 1/2, compared with the result and the gap explained (the accuracy doublings)"]

[[rubric]]
step = "model"
criterion = "States what is assumed: constant kappa, fixed boundary values, a uniform grid, the cost measure, and an exact solution whose own error is negligible."
levels = ["none listed", "listed", "listed, with which ones could change the conclusion (for instance a non-uniform grid or variable kappa)"]

[[rubric]]
step = "method"
criterion = "Chooses by measured costs at settings that each meet a split budget, and shows why a single total error is not enough."
levels = ["asserted", "measured on one run's total error", "measured with the budget split, cancellation shown"]

[[rubric]]
step = "verification"
criterion = "Shows the solver is right: observed orders on a manufactured solution with their ranges, an exact steady state, the measured stability limit against theory; keeps this separate from validation."
levels = ["none, or mixed with validation", "some checks, ranges not stated", "all of them, each with its range and the theoretical value"]

[[rubric]]
step = "validation"
criterion = "Checks physical plausibility (one peak, no new maxima) beyond stability, and says what the failure of Crank-Nicolson's long step means for the choice."
levels = ["absent", "numbers without interpretation", "the non-damping is identified and its consequence for the method choice stated"]

[[rubric]]
step = "uncertainty"
criterion = "States the margins under the budget and whether the conclusion survives the rough profile, and explains why the grid has to be finer there."
levels = ["absent", "stated without the robustness re-check", "stated, re-checked, and the finer grid explained"]

[[rubric]]
step = "report"
criterion = "Every claim has its evidence; limitations and the validity range are stated; nothing is claimed for other equations, dimensions or cost measures. Length, code volume and the number of plots earn nothing."
levels = ["claims without evidence", "evidence for most claims", "every claim supported, limits and range stated, no extrapolation"]

[pilot]
status = "not run"
needs = [
  "one learner who has finished the scientific-computing course's units on ODEs and linear systems and has not seen this case",
  "the learner works from `tutor case start` and the brief only; the observer records time per milestone, where they got stuck, every `tutor case check` output and every claim-checker finding",
  "an instructor scores the finished report with the rubric, blind to the time data",
  "a transfer task afterwards on an unseen problem (an advection-diffusion equation with a given budget): does the learner split the error budget, verify the orders and check plausibility before choosing?",
  "decision rule: if the learner cannot finish milestone 3 in two sessions, or the rubric score on the transfer task is at the lowest level for method or verification, the scaffolding is revised",
]

# ---- study mutants: each must fail milestone 3's acceptance tests -----------------------------

[[mutant]]
id = "choice-most-expensive"
file = "study.jl"
find = "by = k -> (costs[k], k)"
replace = "by = k -> (-costs[k], k)"
description = "the most expensive method is chosen"

[[mutant]]
id = "time-error-against-exact"
file = "study.jl"
find = "ref = midpoint(ic, N, NFINE, :cn)[1]"
replace = "ref = exact_mid(ic)"
description = "the time error measured against the exact value, so it contains the space error"

[[mutant]]
id = "cancellation-on-fine-grid"
file = "study.jl"
find = "cN = 31"
replace = "cN = 127"
description = "the cancellation shown on a grid that already meets the space budget, where it proves nothing"

[[mutant]]
id = "validation-short-steps"
file = "study.jl"
find = "_, ucn, _ = solve_heat(tophat(), 511, 1, TFINAL; method = :cn)"
replace = "_, ucn, _ = solve_heat(tophat(), 511, 64, TFINAL; method = :cn)"
description = "the validation run with short steps, where Crank-Nicolson's ringing has died out"

[[mutant]]
id = "robust-not-perturbed"
file = "study.jl"
find = "rNc, rnsc, rcc, _, _ = cheapest(:tophat, :cn)"
replace = "rNc, rnsc, rcc, _, _ = cheapest(:smooth, :cn)"
description = "the perturbed assumption is not perturbed for the chosen method"

[[mutant]]
id = "space-order-time-dominated"
file = "study.jl"
find = "x, u, _ = solve_heat(p, N, 4096, Ts; method = :cn)"
replace = "x, u, _ = solve_heat(p, N, 4, Ts; method = :be)"
description = "the space order measured with a time error that dominates, so the fit does not show order 2"

[[mutant]]
id = "stability-from-the-solution"
file = "study.jl"
find = "p = HeatProblem(KAPPA, x -> sinpi(N * x))"
replace = "p = HeatProblem(KAPPA, x -> sinpi(x))"
description = "the stability limit probed with the smooth mode, which decays at any r below 2: the bisection then finds no limit near 1/2"

# ---- what each hidden acceptance testset checks (shown when it fails; the test code is not) ----

[behaviours]
stencil-exact-on-quadratics-with-boundaries = "The second difference is exact on a quadratic with non-zero boundary values, and only the end points see those values."
explicit-step-source-and-kappa = "One FTCS step multiplies by kappa, adds the source at the old time, and takes the boundary values at the old time."
tridiagonal-solve-known-solution = "thomas! solves a non-symmetric, diagonally dominant system to rounding, and eliminates the right-hand side as well as the matrix."
manufactured-problem-is-consistent = "The manufactured problem's initial and boundary data match its exact solution, and its source makes the residual u_t - kappa u_xx - s vanish, at another kappa."
theta-step-exact-in-time = "A theta step reproduces a solution linear in time for every theta, with the boundary values at the new time and the source split theta / (1 - theta)."
time-loop-cost-and-method = "solve_heat counts N times nsteps, ends at T, rejects nsteps = 0, and gives order 2 in time for :cn and order 1 for :be."
fit-least-squares = "fit_order is the least-squares slope over every point, not the slope between the end points."
exact-midpoint-values = "exact_mid gives exp(-pi^2 kappa T) for the smooth profile and the Fourier series for the top hat."
error-split-definitions = "space_error is Crank-Nicolson with many steps against the exact value; time_error is the method against the fine run on the same grid."
stability-limit-measured = "stability_limit finds von Neumann's limit for the grid's fastest mode by measuring growth."
study-returns-every-claim = "study() returns a Dict with every claim id of the case."
operating-point = "study() reports the question's operating point (kappa, t, budget, exact value) unchanged."
budget-split-and-met = "Each method's reported setting meets half the budget in time, recomputed with your own solver; the grid meets the other half; costs are N times steps; FTCS is within its stability limit."
settings-near-the-cheapest = "The grid is the coarsest that meets the space half, and Crank-Nicolson's step count cannot be halved."
the-answer = "Crank-Nicolson is the cheapest, by a factor between 30 and 700 over FTCS, and the ratio matches the reported costs."
cancellation-shown = "On a grid too coarse for the space budget, a run's total error is at least 10 times smaller than its space error."
verification-numbers = "The observed orders are within 0.1 of theory with their ranges, the steady quadratic is kept to rounding, and the measured stability limit matches von Neumann's."
validation-one-peak = "One long Crank-Nicolson step on the top hat gives extra peaks and backward Euler keeps one."
robustness-rough-profile = "The top hat needs a finer grid and more steps, the verdict is stated, and the validity range covers the grids used."
