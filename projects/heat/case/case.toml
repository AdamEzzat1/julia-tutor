# The heat case project (docs/CASES.md), a scientific-computing course case.
# It builds on the hole project in projects/heat: milestones 1 and 2 are its
# two starter stages, milestone 3 is the study and the report.

name = "heat"
project = "heat"
course = "scicomp"
env = "base"
title = "The cheapest accurate heat solver: explicit, implicit or Crank-Nicolson?"
summary = "Write a 1D heat-equation solver with three time steppers and a tridiagonal solve, verify it with a manufactured solution, then decide which method delivers the midpoint temperature to five digits for the least work, and whether that holds for a rough initial profile."

question = """
A rod of unit length with diffusivity kappa = 1 is held at temperature 0 at
both ends and starts with the profile sin(pi x). Its midpoint temperature
is needed at t = 0.01 with a relative error below 1e-5. Which time stepper,
explicit Euler (FTCS), backward Euler or Crank-Nicolson, on a uniform grid
of N interior points, delivers that for the fewest grid-point updates
(N times the number of steps)? By how much is it cheaper? Does the choice
survive when the initial profile is a top hat (1 on the middle half, 0
outside) instead of a smooth curve?
"""
qoi = "The midpoint temperature u(1/2, 0.01) and its relative error; the cost in grid-point updates for each method."
accuracy = "The budget is 1e-5 relative. The decision is a ratio of costs, so the costs matter to a factor of 2 (the grids and step counts are searched in powers of 2), and the answer is the method whose cost is lowest by more than that."
emphasised = ["method", "verification", "uncertainty"]
estimate_prompt = "Before you run anything, estimate how many FTCS steps the grid of 127 interior points needs just to be stable (r = kappa dt / dx^2 <= 1/2). Write the estimate in the report with an {estimate:ns_ftcs} tag."

[data]
kind = "exact solutions"
description = """
No dataset. The ground truth is analytic: for sin(pi x) the midpoint
temperature is exp(-pi^2 kappa t); for the top hat it is a Fourier series
whose terms fall below 1e-17 from the 20th on. A manufactured solution,
u = exp(-t) sin(pi x) + x^2 cos(t), with the source and boundary values it
implies, checks the solver's order in space and time. Nothing is random
and nothing is downloaded.
"""

[[data.difficulty]]
what = "Space and time errors have opposite signs here, so a single run's total error can be far smaller than either part: on 31 points, one Crank-Nicolson step lands within 8e-7 of the exact value while the grid alone is off by 8e-5. Judging the total error of one run picks a setting that only meets the budget by accident."
kc = "error-budget"

[[data.difficulty]]
what = "FTCS's step is limited by stability, not accuracy: r = kappa dt / dx^2 must stay below 1/2, so refining the grid twice quadruples the steps. The limit comes from the fastest grid mode, not from the solution."
kc = "stability"

[[data.difficulty]]
what = "Crank-Nicolson is unconditionally stable but not damping: with a long step its factor for the fastest modes is close to -1, so a jump in the initial profile rings instead of smoothing. Stable is not the same as physically plausible."
kc = "implicit-time-stepping"

[[data.difficulty]]
what = "A rough initial profile converges more slowly on a grid: the top hat needs about eight times the points of the smooth profile for the same accuracy, which shifts the costs of all three methods."
kc = "convergence-order-fit"

[[milestone]]
id = 1
title = "The kernels: second difference, one explicit step, the tridiagonal solve, a manufactured problem"
stage = 1
goal = "Fill the four stage-1 holes (`tutor start heat 1 <dir>`) until the visible tests pass, then run `tutor case check <dir> 1`. The hidden acceptance tests use other grids, boundary values and systems, so code fitted to the visible tests does not pass."
acceptance = "acceptance/m1.jl"
steps = ["model", "verification"]

[[milestone]]
id = 2
title = "Implicit steps and the time loop: theta method, solve_heat, the order fit"
stage = 2
goal = "Start stage 2 (`tutor case start heat <dir>`). It opens all seven holes and adds study.jl and report.qmd. Then run `tutor case check <dir> 2`."
acceptance = "acceptance/m2.jl"
steps = ["method", "verification"]

[[milestone]]
id = 3
title = "The study and the report"
stage = 2
goal = "Write study.jl (its docstrings are the spec) and report.qmd, then run `tutor case check <dir> 3`. This runs the hidden acceptance tests on your study, runs `study()` twice in fresh processes, and checks every tagged number in the report against what your code computed. study() takes about 15 seconds."
acceptance = "acceptance/m3.jl"
steps = ["question", "scales", "model", "method", "verification", "validation", "uncertainty", "report"]
report = true

# ---- the report's checked claims ---------------------------------------------------------------
