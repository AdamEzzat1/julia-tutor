# Holes for the heat project (the scicomp course's heat-in-a-rod case,
# docs/CASES.md), in teaching order.
# stage: a hole is opened in every starter stage >= its stage. Stage 1 is
# the explicit method and its ingredients (the second difference, the FTCS
# step, the tridiagonal solver, the manufactured solution); stage 2 opens
# everything: the theta method, the time loop and the order fit.
# trivial: plausible-but-wrong bodies; `tutor holemap heat --check`
#   requires each to make at least one test fail.

project = "heat"
package = "Heat1D"
stages = [1, 2]

[[hole]]
id = "second_difference"
stage = 1
kc = "finite-difference-stencil"
file = "src/Heat1D.jl"
summary = "second_difference!(d2, u, uL, uR, dx): the three-point stencil with the boundary values"
trivial = [
  # the boundary values ignored (taken as 0)
  """
  N = length(u)
  w = 1 / dx^2
  for i in 1:N
      l = i > 1 ? u[i-1] : 0.0
      r = i < N ? u[i+1] : 0.0
      d2[i] = (l - 2u[i] + r) * w
  end
  return d2
  """,
  # divided by dx instead of dx^2
  """
  N = length(u)
  for i in 1:N
      l = i > 1 ? u[i-1] : uL
      r = i < N ? u[i+1] : uR
      d2[i] = (l - 2u[i] + r) / dx
  end
  return d2
  """,
]

[[hole]]
id = "ftcs_step"
stage = 1
kc = "explicit-time-stepping"
file = "src/Heat1D.jl"
summary = "ftcs_step!(unew, u, p, t, dt, dx, d2): one forward-Euler step"
trivial = [
  # the source forgotten
  """
  second_difference!(d2, u, p.left(t), p.right(t), dx)
  for i in eachindex(u)
      unew[i] = u[i] + dt * p.kappa * d2[i]
  end
  return unew
  """,
  # the source at the new time
  """
  second_difference!(d2, u, p.left(t), p.right(t), dx)
  for i in eachindex(u)
      unew[i] = u[i] + dt * (p.kappa * d2[i] + p.source(i * dx, t + dt))
  end
  return unew
  """,
  # kappa forgotten
  """
  second_difference!(d2, u, p.left(t), p.right(t), dx)
  for i in eachindex(u)
      unew[i] = u[i] + dt * (d2[i] + p.source(i * dx, t))
  end
  return unew
  """,
]

[[hole]]
id = "thomas"
stage = 1
kc = "tridiagonal-solve"
file = "src/Heat1D.jl"
summary = "thomas!(x, a, b, c, d): Gaussian elimination on a tridiagonal system"
trivial = [
  # the diagonal only (Jacobi's first guess)
  """
  x .= d ./ b
  return x
  """,
  # the right-hand side not eliminated in the forward sweep
  """
  n = length(b)
  c[1] = c[1] / b[1]
  d[1] = d[1] / b[1]
  for i in 2:n
      m = b[i] - a[i] * c[i-1]
      i < n && (c[i] = c[i] / m)
      d[i] = d[i] / m
  end
  x[n] = d[n]
  for i in n-1:-1:1
      x[i] = d[i] - c[i] * x[i+1]
  end
  return x
  """,
]

[[hole]]
id = "mms_problem"
stage = 1
kc = "manufactured-solutions"
file = "src/Heat1D.jl"
summary = "mms_problem(kappa): the problem a chosen exact solution solves"
trivial = [
  # the sign of the diffusion term flipped: source = u_t + kappa u_xx
  """
  k = Float64(kappa)
  exact(x, t) = exp(-t) * sinpi(x) + x^2 * cos(t)
  source(x, t) = -exp(-t) * sinpi(x) - x^2 * sin(t) + k * (-pi^2 * exp(-t) * sinpi(x) + 2 * cos(t))
  p = HeatProblem(k, x -> exact(x, 0.0), source, t -> exact(0.0, t), t -> exact(1.0, t))
  return p, exact
  """,
  # the right boundary value taken as 0, as for the sine part alone
  """
  k = Float64(kappa)
  exact(x, t) = exp(-t) * sinpi(x) + x^2 * cos(t)
  source(x, t) = -exp(-t) * sinpi(x) - x^2 * sin(t) - k * (-pi^2 * exp(-t) * sinpi(x) + 2 * cos(t))
  p = HeatProblem(k, x -> exact(x, 0.0), source, t -> 0.0, t -> 0.0)
  return p, exact
  """,
]

[[hole]]
id = "theta_step"
stage = 2
kc = "implicit-time-stepping"
file = "src/Heat1D.jl"
summary = "theta_step!(unew, u, p, t, dt, dx, theta, w): one theta-method step, a tridiagonal solve"
trivial = [
  # the boundary values at the old time
  """
  N = length(u)
  r = p.kappa * dt / dx^2
  second_difference!(w.d2, u, p.left(t), p.right(t), dx)
  for i in 1:N
      x = i * dx
      w.a[i] = -theta * r
      w.b[i] = 1 + 2 * theta * r
      w.c[i] = -theta * r
      w.d[i] = u[i] + dt * ((1 - theta) * (p.kappa * w.d2[i] + p.source(x, t)) + theta * p.source(x, t + dt))
  end
  w.d[1] += theta * r * p.left(t)
  w.d[N] += theta * r * p.right(t)
  return thomas!(unew, w.a, w.b, w.c, w.d)
  """,
  # the source at the old time only: Crank-Nicolson drops to order 1
  """
  N = length(u)
  r = p.kappa * dt / dx^2
  second_difference!(w.d2, u, p.left(t), p.right(t), dx)
  for i in 1:N
      x = i * dx
      w.a[i] = -theta * r
      w.b[i] = 1 + 2 * theta * r
      w.c[i] = -theta * r
      w.d[i] = u[i] + dt * ((1 - theta) * p.kappa * w.d2[i] + p.source(x, t))
  end
  w.d[1] += theta * r * p.left(t + dt)
  w.d[N] += theta * r * p.right(t + dt)
  return thomas!(unew, w.a, w.b, w.c, w.d)
  """,
  # the diagonal without the factor 2
  """
  N = length(u)
  r = p.kappa * dt / dx^2
  second_difference!(w.d2, u, p.left(t), p.right(t), dx)
  for i in 1:N
      x = i * dx
      w.a[i] = -theta * r
      w.b[i] = 1 + theta * r
      w.c[i] = -theta * r
      w.d[i] = u[i] + dt * ((1 - theta) * (p.kappa * w.d2[i] + p.source(x, t)) + theta * p.source(x, t + dt))
  end
  w.d[1] += theta * r * p.left(t + dt)
  w.d[N] += theta * r * p.right(t + dt)
  return thomas!(unew, w.a, w.b, w.c, w.d)
  """,
]

[[hole]]
id = "solve_heat"
stage = 2
kc = "explicit-time-stepping"
file = "src/Heat1D.jl"
summary = "solve_heat(p, N, nsteps, T; method): the time loop and its cost"
trivial = [
  # one step short of T
  """
  x = grid(N)
  dx = 1 / (N + 1)
  dt = T / nsteps
  u = p.u0.(x)
  unew = similar(u)
  w = ThetaWork(N)
  theta = method === :be ? 1.0 : 0.5
  for k in 0:nsteps-2
      t = k * dt
      method === :ftcs ? ftcs_step!(unew, u, p, t, dt, dx, w.d2) : theta_step!(unew, u, p, t, dt, dx, theta, w)
      u, unew = unew, u
  end
  return x, u, N * nsteps
  """,
  # :cn runs backward Euler
  """
  method in (:ftcs, :be, :cn) || throw(ArgumentError("method must be :ftcs, :be or :cn"))
  x = grid(N)
  dx = 1 / (N + 1)
  dt = T / nsteps
  u = p.u0.(x)
  unew = similar(u)
  w = ThetaWork(N)
  for k in 0:nsteps-1
      t = k * dt
      method === :ftcs ? ftcs_step!(unew, u, p, t, dt, dx, w.d2) : theta_step!(unew, u, p, t, dt, dx, 1.0, w)
      u, unew = unew, u
  end
  return x, u, N * nsteps
  """,
  # the cost counts steps, not grid-point updates
  """
  method in (:ftcs, :be, :cn) || throw(ArgumentError("method must be :ftcs, :be or :cn"))
  x = grid(N)
  dx = 1 / (N + 1)
  dt = T / nsteps
  u = p.u0.(x)
  unew = similar(u)
  w = ThetaWork(N)
  theta = method === :be ? 1.0 : 0.5
  for k in 0:nsteps-1
      t = k * dt
      method === :ftcs ? ftcs_step!(unew, u, p, t, dt, dx, w.d2) : theta_step!(unew, u, p, t, dt, dx, theta, w)
      u, unew = unew, u
  end
  return x, u, nsteps
  """,
]

[[hole]]
id = "fit_order"
stage = 2
kc = "convergence-order-fit"
file = "src/Heat1D.jl"
summary = "fit_order(hs, errs): the least-squares slope of log(err) on log(h)"
trivial = [
  "return (log(errs[end]) - log(errs[1])) / (log(hs[end]) - log(hs[1]))",
  """
  x = hs
  y = log.(errs)
  xm, ym = sum(x) / length(x), sum(y) / length(y)
  return sum((x .- xm) .* (y .- ym)) / sum(abs2, x .- xm)
  """,
]
