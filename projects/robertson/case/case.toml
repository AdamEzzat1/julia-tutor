# The robertson case project (docs/CASES.md), a scientific-computing course
# case on stiffness. It builds on the hole project in projects/robertson:
# milestones 1 and 2 are its two starter stages, milestone 3 is the study
# and the report.

name = "robertson"
project = "robertson"
course = "scicomp"
env = "base"
title = "Stiff kinetics: when does an implicit method pay for its Jacobian?"
summary = "Write Robertson's reaction kinetics, a pivoted linear solve, an explicit Bogacki-Shampine 3(2) step, a Rosenbrock ROS2 step and one adaptive controller for both. Then measure which integrator delivers the concentrations at t = 40 to four digits for the least work, and whether the choice survives a reaction a thousand times slower."

question = """
Robertson's three-species reaction (A -> B at rate 0.04, B + B -> C + B at
3e7, B + C -> A + C at 1e4) starts with pure A. The three concentrations
are needed at t = 40, each with a relative error below 1e-4. Which
integrator, the explicit Bogacki-Shampine 3(2) or the linearly implicit
Rosenbrock ROS2, delivers that for the least work (right-hand-side
evaluations, plus three per Jacobian)? Why, in terms you can measure? Does
the choice survive when the two fast reactions are a thousand times slower?
"""
qoi = "The three concentrations at t = 40 and their largest relative error; the work of each integrator in right-hand-side evaluations (a Jacobian counts as 3)."
accuracy = "The budget is 1e-4 relative in every component, including B's, which is about 1e-5 in absolute terms. Tolerances are searched in steps of sqrt(10), so costs matter to a factor of about 2; the answer is the method cheaper by more than that."
emphasised = ["method", "verification", "validation"]
estimate_prompt = "Before you run anything, estimate how many steps BS3(2) needs to reach t = 40 if its step is limited only by stability: h |lambda| <= 2.5, with lambda the Jacobian's most negative eigenvalue (about -(k3 y3 + 2 k2 y2), a few thousand). Write the estimate in the report with an {estimate:bs_steps} tag."

[data]
kind = "exact solutions"
description = """
No dataset. Robertson's problem has no closed-form solution, but its value
at t = 40 is published in the IVP test-set literature, and two independent
integrations at a tolerance of 1e-10 (one explicit, one implicit) agree
with each other and with that value to about 1e-10, far below the budget.
A rotation y1' = y2, y2' = -y1 with its exact solution checks the methods'
orders. Nothing is random and nothing is downloaded.
"""

[[data.difficulty]]
what = "The concentrations differ by five orders of magnitude: B is about 1e-5. An absolute tolerance chosen for A and C (say 1e-4) is above B's whole value, so B's error is invisible to the controller, and so is the instability of an explicit method in B's fast mode: the run blows up with every step accepted."
kc = "step-size-control"

[[data.difficulty]]
what = "An explicit method's step on a stiff problem is set by stability, not by the tolerance: loosening the tolerance a thousandfold barely changes the number of steps. Its cost has to be explained by the Jacobian's eigenvalues, not by the accuracy asked for."
kc = "stiffness"

[[data.difficulty]]
what = "The error at the end is not monotone in the tolerance: BS3(2) at rtol 3.2e-3 ends with a smaller error than at 1e-3. The cheapest tolerance that meets the budget has to be found by measuring, and checked against the next looser one."
kc = "step-size-control"

[[data.difficulty]]
what = "Stiffness is a property of the problem and the interval, not of the equations' look: the same reactions with slower rates are barely stiff, and then the cheaper explicit step wins."
kc = "stiffness"

[[milestone]]
id = 1
title = "The model and the explicit method: rate equations, Jacobian, pivoted solve, one BS3(2) step"
stage = 1
goal = "Fill the four stage-1 holes (`tutor start robertson 1 <dir>`) until the visible tests pass, then run `tutor case check <dir> 1`. The hidden acceptance tests use other rate constants, systems and problems, so code fitted to the visible tests does not pass."
acceptance = "acceptance/m1.jl"
steps = ["model", "verification"]

[[milestone]]
id = 2
title = "The implicit method and the controller: ROS2, adaptive integration, the order fit"
stage = 2
goal = "Start stage 2 (`tutor case start robertson <dir>`). It opens all seven holes and adds study.jl and report.qmd. Then run `tutor case check <dir> 2`."
acceptance = "acceptance/m2.jl"
steps = ["method", "verification"]

[[milestone]]
id = 3
title = "The study and the report"
stage = 2
goal = "Write study.jl (its docstrings are the spec) and report.qmd, then run `tutor case check <dir> 3`. This runs the hidden acceptance tests on your study, runs `study()` twice in fresh processes, and checks every tagged number in the report against what your code computed. study() takes about 20 seconds."
acceptance = "acceptance/m3.jl"
steps = ["question", "scales", "model", "method", "verification", "validation", "uncertainty", "report"]
report = true

