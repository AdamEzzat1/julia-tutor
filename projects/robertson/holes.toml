# Holes for the robertson project (the scicomp course's stiff-kinetics
# case, docs/CASES.md), in teaching order.
# stage: a hole is opened in every starter stage >= its stage. Stage 1 is
# the model and the explicit method (the right-hand side, its Jacobian, the
# pivoted solve, one Bogacki-Shampine step); stage 2 opens everything: the
# Rosenbrock step, the adaptive controller and the order fit.
# trivial: plausible-but-wrong bodies; `tutor holemap robertson --check`
#   requires each to make at least one test fail.

project = "robertson"
package = "StiffKin"
stages = [1, 2]

[[hole]]
id = "rhs"
stage = 1
kc = "reaction-kinetics"
file = "src/StiffKin.jl"
summary = "rhs(y, p): Robertson's three rate equations"
trivial = [
  # B + B -> C + B forgotten in B's equation: mass is not conserved
  """
  a = p.k1 * y[1]
  b = p.k3 * y[2] * y[3]
  c = p.k2 * y[2]^2
  return [b - a, a - b, c]
  """,
  # the two fast rate constants swapped
  """
  a = p.k1 * y[1]
  b = p.k2 * y[2] * y[3]
  c = p.k3 * y[2]^2
  return [b - a, a - b - c, c]
  """,
  # Robertson's constants hard-coded
  """
  a = 0.04 * y[1]
  b = 1e4 * y[2] * y[3]
  c = 3e7 * y[2]^2
  return [b - a, a - b - c, c]
  """,
]

[[hole]]
id = "jacobian"
stage = 1
kc = "jacobian"
file = "src/StiffKin.jl"
summary = "jacobian(y, p): the 3x3 matrix of partial derivatives"
trivial = [
  # the transpose
  """
  return [-p.k1 p.k1 0.0
          p.k3*y[3] -p.k3*y[3]-2*p.k2*y[2] 2*p.k2*y[2]
          p.k3*y[2] -p.k3*y[2] 0.0]
  """,
  # d(k2 y2^2)/dy2 taken as k2 y2
  """
  return [-p.k1 p.k3*y[3] p.k3*y[2]
          p.k1 -p.k3*y[3]-p.k2*y[2] -p.k3*y[2]
          0.0 p.k2*y[2] 0.0]
  """,
]

[[hole]]
id = "solve_pivot"
stage = 1
kc = "gaussian-elimination"
file = "src/StiffKin.jl"
summary = "solve_pivot(A, b): Gaussian elimination with partial pivoting"
trivial = [
  # no pivoting
  """
  n = length(b)
  M = Matrix{Float64}(A)
  x = Vector{Float64}(b)
  for k in 1:n
      for i in k+1:n
          l = M[i, k] / M[k, k]
          for j in k+1:n
              M[i, j] -= l * M[k, j]
          end
          x[i] -= l * x[k]
      end
  end
  for i in n:-1:1
      s = x[i]
      for j in i+1:n
          s -= M[i, j] * x[j]
      end
      x[i] = s / M[i, i]
  end
  return x
  """,
  # the rows of M swapped but not the right-hand side
  """
  n = length(b)
  M = Matrix{Float64}(A)
  x = Vector{Float64}(b)
  for k in 1:n
      p = k
      for i in k+1:n
          abs(M[i, k]) > abs(M[p, k]) && (p = i)
      end
      iszero(M[p, k]) && throw(ArgumentError("singular matrix"))
      if p != k
          for j in k:n
              M[k, j], M[p, j] = M[p, j], M[k, j]
          end
      end
      for i in k+1:n
          l = M[i, k] / M[k, k]
          for j in k+1:n
              M[i, j] -= l * M[k, j]
          end
          x[i] -= l * x[k]
      end
  end
  for i in n:-1:1
      s = x[i]
      for j in i+1:n
          s -= M[i, j] * x[j]
      end
      x[i] = s / M[i, i]
  end
  return x
  """,
  # works in place on the caller's A and b
  """
  n = length(b)
  M = A
  x = b
  for k in 1:n
      p = k
      for i in k+1:n
          abs(M[i, k]) > abs(M[p, k]) && (p = i)
      end
      iszero(M[p, k]) && throw(ArgumentError("singular matrix"))
      if p != k
          for j in k:n
              M[k, j], M[p, j] = M[p, j], M[k, j]
          end
          x[k], x[p] = x[p], x[k]
      end
      for i in k+1:n
          l = M[i, k] / M[k, k]
          for j in k+1:n
              M[i, j] -= l * M[k, j]
          end
          x[i] -= l * x[k]
      end
  end
  for i in n:-1:1
      s = x[i]
      for j in i+1:n
          s -= M[i, j] * x[j]
      end
      x[i] = s / M[i, i]
  end
  return x
  """,
]

[[hole]]
id = "bs32_step"
stage = 1
kc = "runge-kutta-stages"
file = "src/StiffKin.jl"
summary = "bs32_step(f, y, h): one Bogacki-Shampine 3(2) step with its error estimate"
trivial = [
  # explicit Euler with no error estimate
  """
  k1 = f(y)
  ynew = y .+ h .* k1
  return ynew, zero(ynew), 1
  """,
  # the third stage at h/2 instead of 3h/4
  """
  k1 = f(y)
  k2 = f(y .+ (h / 2) .* k1)
  k3 = f(y .+ (h / 2) .* k2)
  ynew = y .+ h .* ((2 / 9) .* k1 .+ (1 / 3) .* k2 .+ (4 / 9) .* k3)
  k4 = f(ynew)
  z = y .+ h .* ((7 / 24) .* k1 .+ (1 / 4) .* k2 .+ (1 / 3) .* k3 .+ (1 / 8) .* k4)
  return ynew, ynew .- z, 4
  """,
  # the second-order solution returned, the third-order one used as the estimate
  """
  k1 = f(y)
  k2 = f(y .+ (h / 2) .* k1)
  k3 = f(y .+ (3h / 4) .* k2)
  y3 = y .+ h .* ((2 / 9) .* k1 .+ (1 / 3) .* k2 .+ (4 / 9) .* k3)
  k4 = f(y3)
  z = y .+ h .* ((7 / 24) .* k1 .+ (1 / 4) .* k2 .+ (1 / 3) .* k3 .+ (1 / 8) .* k4)
  return z, z .- y3, 4
  """,
]

[[hole]]
id = "ros2_step"
stage = 2
kc = "linearly-implicit-methods"
file = "src/StiffKin.jl"
summary = "ros2_step(f, jac, y, h): one Rosenbrock ROS2 step with its error estimate"
trivial = [
  # W = I + gamma h J (the sign of the implicit part flipped)
  """
  J = jac(y)
  n = length(y)
  W = (GAMMA * h) .* J
  for i in 1:n
      W[i, i] += 1
  end
  k1 = solve_pivot(W, f(y))
  k2 = solve_pivot(W, f(y .+ h .* k1) .- 2 .* k1)
  ynew = y .+ (3h / 2) .* k1 .+ (h / 2) .* k2
  return ynew, ynew .- (y .+ h .* k1), 2, 1
  """,
  # the -2 k1 correction in the second stage dropped
  """
  J = jac(y)
  n = length(y)
  W = -(GAMMA * h) .* J
  for i in 1:n
      W[i, i] += 1
  end
  k1 = solve_pivot(W, f(y))
  k2 = solve_pivot(W, f(y .+ h .* k1))
  ynew = y .+ (3h / 2) .* k1 .+ (h / 2) .* k2
  return ynew, ynew .- (y .+ h .* k1), 2, 1
  """,
  # linearly implicit Euler, with no error estimate
  """
  J = jac(y)
  n = length(y)
  W = -h .* J
  for i in 1:n
      W[i, i] += 1
  end
  ynew = y .+ h .* solve_pivot(W, f(y))
  return ynew, zero(ynew), 1, 1
  """,
]

[[hole]]
id = "integrate"
stage = 2
kc = "step-size-control"
file = "src/StiffKin.jl"
summary = "integrate(step, y0, T; rtol, atol, h0, order): the adaptive step-size controller"
trivial = [
  # fixed step h0, nothing rejected, may overshoot T
  """
  s = Stats()
  y = Vector{Float64}(y0)
  t = 0.0
  while t < T
      r = step(y, h0)
      y = r[1]
      s.nf += r[3]
      length(r) >= 4 && (s.nj += r[4])
      t += h0
      s.steps += 1
      s.ymin = min(s.ymin, minimum(y))
  end
  s.t = t
  return y, s
  """,
  # every step accepted, whatever its error (the step still adapts)
  """
  s = Stats()
  y = Vector{Float64}(y0)
  t = 0.0
  h = Float64(h0)
  while t < T
      h < 4 * eps(max(abs(t), 1.0)) && break
      last = t + h >= T
      last && (h = T - t)
      r = step(y, h)
      ynew, err = r[1], r[2]
      s.nf += r[3]
      length(r) >= 4 && (s.nj += r[4])
      e = sqrt(sum(abs2, err ./ (atol .+ rtol .* max.(abs.(y), abs.(ynew)))) / length(y))
      isfinite(e) || (e = Inf)
      t = last ? Float64(T) : t + h
      y = ynew
      s.steps += 1
      s.ymin = min(s.ymin, minimum(y))
      h *= iszero(e) ? 5.0 : min(5.0, max(0.2, 0.9 * e^(-1 / order)))
  end
  s.t = t
  return y, s
  """,
  # the rejected attempts' evaluations not counted
  """
  s = Stats()
  y = Vector{Float64}(y0)
  t = 0.0
  h = Float64(h0)
  while t < T
      h < 4 * eps(max(abs(t), 1.0)) && break
      last = t + h >= T
      last && (h = T - t)
      r = step(y, h)
      ynew, err = r[1], r[2]
      e = sqrt(sum(abs2, err ./ (atol .+ rtol .* max.(abs.(y), abs.(ynew)))) / length(y))
      isfinite(e) || (e = Inf)
      if e <= 1
          s.nf += r[3]
          length(r) >= 4 && (s.nj += r[4])
          t = last ? Float64(T) : t + h
          y = ynew
          s.steps += 1
          s.ymin = min(s.ymin, minimum(y))
      else
          s.rejected += 1
      end
      h *= iszero(e) ? 5.0 : min(5.0, max(0.2, 0.9 * e^(-1 / order)))
  end
  s.t = t
  return y, s
  """,
]

[[hole]]
id = "fit_order"
stage = 2
kc = "convergence-order-fit"
file = "src/StiffKin.jl"
summary = "fit_order(hs, errs): least-squares slope on log-log axes"
trivial = [
  # the slope between the end points
  """
  return (log(errs[end]) - log(errs[1])) / (log(hs[end]) - log(hs[1]))
  """,
  # the expected answer
  """
  return 2.0
  """,
]
