# Explain fixtures for robertson: realistic buggy student versions, one bug each.
#
# Each fixture is the reference with exactly one hole replaced by `body`, at
# starter `stage`. `tutor fixtures robertson` runs explain on each and writes
# fixtures/<name>.golden.txt; `--check` re-runs and diffs (verify_all.sh).
# expect_start: the hole explain's "Start here" must name.

[[fixture]]
name = "rhs-sign-of-the-back-reaction"
hole = "rhs"
stage = 1
expect_start = "rhs"
misconception = "reaction-direction"
description = "B + C -> A + C produces A, but is written as consuming it: mass is still conserved, the kinetics are wrong"
body = """
a = p.k1 * y[1]
b = p.k3 * y[2] * y[3]
c = p.k2 * y[2]^2
return [-a - b, a + b - c, c]
"""

[[fixture]]
name = "jacobian-row-for-column"
hole = "jacobian"
stage = 1
expect_start = "jacobian"
misconception = "jacobian-index-order"
description = "J[i, j] written as d rhs_j / d y_i: the transpose, whose rows (not columns) sum to zero"
body = """
return [-p.k1 p.k1 0.0
        p.k3*y[3] -p.k3*y[3]-2*p.k2*y[2] 2*p.k2*y[2]
        p.k3*y[2] -p.k3*y[2] 0.0]
"""

[[fixture]]
name = "solve_pivot-no-pivoting"
hole = "solve_pivot"
stage = 1
expect_start = "solve_pivot"
misconception = "pivoting-is-optional"
description = "plain Gaussian elimination: right whenever no leading entry is zero or tiny"
body = """
n = length(b)
M = Matrix{Float64}(A)
x = Vector{Float64}(b)
for k in 1:n
    for i in k+1:n
        l = M[i, k] / M[k, k]
        for j in k+1:n
            M[i, j] -= l * M[k, j]
        end
        x[i] -= l * x[k]
    end
end
for i in n:-1:1
    s = x[i]
    for j in i+1:n
        s -= M[i, j] * x[j]
    end
    x[i] = s / M[i, i]
end
return x
"""

[[fixture]]
name = "bs32_step-estimate-without-last-stage"
hole = "bs32_step"
stage = 1
expect_start = "bs32_step"
misconception = "error-estimate-is-the-step"
description = "builds the second-order solution without the stage at ynew (k4): the difference is then not an estimate of order h^3"
body = """
k1 = f(y)
k2 = f(y .+ (h / 2) .* k1)
k3 = f(y .+ (3h / 4) .* k2)
ynew = y .+ h .* ((2 / 9) .* k1 .+ (1 / 3) .* k2 .+ (4 / 9) .* k3)
z = y .+ h .* ((7 / 24) .* k1 .+ (1 / 4) .* k2 .+ (1 / 3) .* k3)
return ynew, ynew .- z, 3
"""

[[fixture]]
name = "ros2_step-gamma-dropped"
hole = "ros2_step"
stage = 2
expect_start = "ros2_step"
misconception = "w-matrix-without-gamma"
description = "W = I - h J: still order 1, but neither order 2 nor L-stable"
body = """
J = jac(y)
n = length(y)
W = -h .* J
for i in 1:n
    W[i, i] += 1
end
k1 = solve_pivot(W, f(y))
k2 = solve_pivot(W, f(y .+ h .* k1) .- 2 .* k1)
ynew = y .+ (3h / 2) .* k1 .+ (h / 2) .* k2
return ynew, ynew .- (y .+ h .* k1), 2, 1
"""

[[fixture]]
name = "integrate-overshoots-the-end"
hole = "integrate"
stage = 2
expect_start = "integrate"
misconception = "last-step-not-shortened"
description = "never shortens the last step, so the integration ends past T"
body = """
s = Stats()
y = Vector{Float64}(y0)
t = 0.0
h = Float64(h0)
while t < T
    h < 4 * eps(max(abs(t), 1.0)) && break
    r = step(y, h)
    ynew, err = r[1], r[2]
    s.nf += r[3]
    length(r) >= 4 && (s.nj += r[4])
    e = sqrt(sum(abs2, err ./ (atol .+ rtol .* max.(abs.(y), abs.(ynew)))) / length(y))
    isfinite(e) || (e = Inf)
    if e <= 1
        t += h
        y = ynew
        s.steps += 1
        s.ymin = min(s.ymin, minimum(y))
    else
        s.rejected += 1
    end
    h *= iszero(e) ? 5.0 : min(5.0, max(0.2, 0.9 * e^(-1 / order)))
end
s.t = t
return y, s
"""

