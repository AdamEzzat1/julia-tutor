# ---- required evidence ---------------------------------------------------------------------

[[evidence]]
id = "qoi-for-both-methods"
text = "the quantity of interest for both methods, with the spread over the points"
claims = ["cd_err", "cd_err_min", "dual_err"]
same_paragraph = true

[[evidence]]
id = "error-model-with-ranges"
text = "both branches of the error model, each with its fit range"
claims = ["trunc_order", "trunc_fit_hmin", "trunc_fit_hmax", "round_slope", "round_fit_hmin", "round_fit_hmax"]

[[evidence]]
id = "best-step-against-theory"
text = "the measured best step next to the model's optimum"
claims = ["cd_best_h", "cd_theory_h"]
same_paragraph = true

[[evidence]]
id = "exact-verification"
text = "a verification result in exact arithmetic"
claims = ["poly_err"]

[[evidence]]
id = "robustness"
text = "the conclusion re-checked under a perturbed assumption, and whether it holds"
claims = ["robust_x_lo", "robust_cd_err", "robust_choice", "robust_holds"]
same_paragraph = true

[[evidence]]
id = "validity-range"
text = "the range where the conclusion was tested"
claims = ["valid_x_min", "valid_x_max"]
same_paragraph = true

[[estimate]]
id = "cd_err"
section = "scales"
compare_with = "cd_best_err"

[robustness]
assumption = "the points lie in [0.5, 1], near the origin"
perturbed = "the same interval moved by 96 pi (48 periods of sin): the function has the same shape, but |x| is about 300"
claims = ["robust_x_lo", "robust_x_hi", "robust_cd_err", "robust_dual_err", "robust_choice", "robust_holds"]

# ---- discussion --------------------------------------------------------------------------------
# kind = "prediction": has a measured answer (the claim named in
# `measured_by`). kind = "rubric": discussed and judged with the rubric,
# never by software.

[[discussion]]
kind = "prediction"
text = "Before measuring: if you halve the step of a central difference where truncation dominates, by what factor does the error change? Where rounding dominates?"
measured_by = "trunc_order"

[[discussion]]
kind = "prediction"
text = "After 3 Newton steps for sqrt(2), is the derivative of the iteration more or less accurate, relatively, than its value?"
measured_by = "algo_deriv_err"

[[discussion]]
kind = "rubric"
text = "Your dual derivative is accurate to rounding. Does that make it correct for a function computed by an iteration that stops early? What did your validation measure?"

[[discussion]]
kind = "rubric"
text = "The step rule cbrt(eps) max(1, |x|) failed on the moved interval. What would a correct step rule need to know about f, and why does a dual number need none of it?"

[[discussion]]
kind = "rubric"
text = "When would central differences still be the right choice (code you cannot change, functions without a Dual method, a black box)?"

[[discussion]]
kind = "rubric"
text = "Forward mode costs one pass per input. For a function of a million inputs and one output, what would you use instead, and why?"

# ---- rubric (no software grades these) --------------------------------------------------------

[[rubric]]
step = "question"
criterion = "States the question, the QoI and the accuracy that would answer it, before any result."
levels = ["missing or vague", "stated, but the accuracy is not tied to the decision", "stated, and the accuracy is justified by the decision it has to support"]

[[rubric]]
step = "scales"
criterion = "Estimates the best central-difference error from the error model before computing, and compares it with the measurement afterwards."
levels = ["no estimate", "an estimate without a method", "an estimate from the error model, compared with the result and the gap explained"]

[[rubric]]
step = "model"
criterion = "States what is assumed: Float64 arithmetic, correctly rounded elementary functions, a ground truth whose own error is negligible, and that the error is judged relative to |f'|."
levels = ["none listed", "listed", "listed, with which ones could change the conclusion (for instance a zero of f' in the interval)"]

[[rubric]]
step = "method"
criterion = "Chooses by the measured largest error over the points, not by one lucky point or by reputation."
levels = ["asserted", "measured at one point", "measured over all the points, with the spread stated"]

[[rubric]]
step = "verification"
criterion = "Shows the code is right: exact arithmetic on a polynomial, both branches of the error model with their fit ranges, the best step against the model; keeps this separate from validation."
levels = ["none, or mixed with validation", "some checks, ranges not stated", "all of them, each with its range and the theoretical value"]

[[rubric]]
step = "validation"
criterion = "Tests whether the derivative of the code is the derivative wanted, on an iteration that has not converged, and says what it shows."
levels = ["absent", "numbers without interpretation", "the gap between code and mathematics is identified and its consequence stated"]

[[rubric]]
step = "uncertainty"
criterion = "States the spread of the error over the points and whether the conclusion survives the moved interval, and explains why the step rule fails there."
levels = ["absent", "stated without the robustness re-check", "stated, re-checked, and the failure of the step rule explained"]

[[rubric]]
step = "report"
criterion = "Every claim has its evidence; limitations and the validity range are stated; nothing is claimed for other functions or for reverse mode. Length, code volume and the number of plots earn nothing."
levels = ["claims without evidence", "evidence for most claims", "every claim supported, limits and range stated, no extrapolation"]

[pilot]
status = "not run"
needs = [
  "one learner who has finished the core course's units on types, dispatch and generic programming and has not seen this case",
  "the learner works from `tutor case start` and the brief only; the observer records time per milestone, where they got stuck, every `tutor case check` output and every claim-checker finding",
  "an instructor scores the finished report with the rubric, blind to the time data",
  "a transfer task afterwards on an unseen problem (the derivative of a function computed by a fixed-point iteration): does the learner verify before trusting, and separate the derivative of the code from the derivative of the mathematics?",
  "decision rule: if the learner cannot finish milestone 3 in two sessions, or the rubric score on the transfer task is at the lowest level for verification or validation, the scaffolding is revised",
]

# ---- study mutants: each must fail milestone 3's acceptance tests -----------------------------

[[mutant]]
id = "error-absolute"
file = "study.jl"
find = "relerr(approx, exact::BigFloat) = Float64(abs(big(approx) - exact) / abs(exact))"
replace = "relerr(approx, exact::BigFloat) = Float64(abs(big(approx) - exact))"
description = "absolute instead of relative error"

[[mutant]]
id = "rule-step-not-scaled"
file = "study.jl"
find = "rule_step(x) = cbrt(eps()) * max(1.0, abs(x))"
replace = "rule_step(x) = cbrt(eps())"
description = "the step rule without the factor max(1, |x|): the moved interval then shows no failure of the rule"

[[mutant]]
id = "choice-inverted"
file = "study.jl"
find = "out[\"choice\"] = out[\"cd_err\"] <= TARGET ? \"central\" : \"dual\""
replace = "out[\"choice\"] = out[\"cd_err\"] <= TARGET ? \"dual\" : \"central\""
description = "the method that misses the budget is chosen"

[[mutant]]
id = "best-step-at-one-point"
file = "study.jl"
find = "worst = [maximum(relerr(central_diff(f, x, h), exact_derivative(x)) for x in xs) for h in hs]"
replace = "worst = [relerr(central_diff(f, xs[1], h), exact_derivative(xs[1])) for h in hs]"
description = "the best step judged at one point, where cancellation can make it look better than it is"

[[mutant]]
id = "algorithm-converged"
file = "study.jl"
find = "algorithm_derivative(3)"
replace = "algorithm_derivative(4)"
description = "the validation run after 4 steps instead of 3, close enough to convergence to hide the gap"

[[mutant]]
id = "robust-not-moved"
file = "study.jl"
find = "rxs = points(X_LO + SHIFT, X_HI + SHIFT)"
replace = "rxs = points(X_LO, X_HI)"
description = "the perturbed assumption is not perturbed: the same interval is checked twice"

[[mutant]]
id = "truncation-fit-in-rounding"
file = "study.jl"
find = "ths = [2.0^-k for k in 3:8]"
replace = "ths = [2.0^-k for k in 15:20]"
description = "the truncation fit range placed where rounding already matters, so the slope is not 2"

# ---- what each hidden acceptance testset checks (shown when it fails; the test code is not) ----

[behaviours]
product-rule-both-terms = "The product of two duals has both terms of the product rule, u'v + uv', on cases where each term vanishes in turn."
quotient-rule-sign-and-square = "The quotient of two duals is (u'v - uv') / v^2: the sign and the square are both checked, and a zero divisor gives Float64's answer, not an error."
chain-rule-through-compositions = "Compositions of elementary functions get the inner derivative, and lift multiplies by x's derivative part when it is not 1."
power-rule-edge-exponents = "Integer powers follow n u^(n-1) u', including n = 0 at u = 0 (the constant 1, not NaN) and negative n."
derivative-one-seeded-pass = "derivative evaluates f once on x + 1 eps, converts an integer x, gives 0 for a constant, and nests for second derivatives."
gradient-each-component-seeded = "gradient seeds one component per evaluation, evaluates on duals, and returns floating-point components."
central-difference-symmetric = "central_diff is the symmetric quotient (f(x + h) - f(x - h)) / 2h, exact on a cubic up to its h^2 term, of order 2."
order-fit-least-squares = "fit_order is the least-squares slope of log(error) on log(h) over every point, slope -1 for a C / h curve."
error-definition = "max_error returns the largest and the smallest relative error over the points, against the exact derivative, for each method."
error-model-of-central-differences = "The error curve at x = 0.7 has slope 2 where truncation dominates and slope -1 where rounding does."
best-uniform-step = "best_uniform_step minimises the largest error over all the points, not the error at one of them."
study-returns-every-claim = "study() returns a Dict with every claim id of the case."
operating-point = "study() reports the question's operating point (interval, points, budget, the rule step) unchanged."
the-answer = "The largest errors over the 101 points agree with an independent recomputation, lie in the error model's range, and the choice follows from them."
verification-numbers = "The verification numbers are in their theoretical ranges, the fit ranges do not overlap, and the best step is within a factor 4 of the model's."
validation-the-algorithm = "The derivative of the unconverged iteration is measured after 3 steps, is less accurate than its value, and reaches rounding level after 5."
robustness-far-from-the-origin = "On the moved interval the rule step fails by orders of magnitude while dual numbers stay at rounding level, and the verdict is stated."
