# The dualad case project (docs/CASES.md), the core course's case. It builds
# on the hole project in projects/dualad: milestones 1 and 2 are its two
# starter stages, milestone 3 is the study and the report.

name = "dualad"
project = "dualad"
course = "core"
env = "base"
title = "Exact derivatives: write dual numbers, then decide whether central differences are good enough"
summary = "Write forward-mode automatic differentiation with dual numbers and multiple dispatch. Then measure whether central differences can deliver a derivative to twelve digits, at what step, and what happens to the usual step rule far from the origin."

question = """
An optimiser's stopping test needs f'(x) for f(x) = exp(x) sin(x) at 101
equally spaced points of [0.5, 1], each with a relative error below 1e-12.
Can central differences with the usual step h = cbrt(eps) max(1, |x|)
deliver that, or do you need dual numbers? At what step would central
differences do their best, and how close is that to what their error model
predicts? Does the answer survive when the same interval is moved 48 periods
away from the origin?
"""
qoi = "The largest relative error of f' over the 101 points, for each method."
accuracy = "Only the order of magnitude decides the question: an error below the 1e-12 budget passes, and a method that misses it by a factor of ten or more fails. Two significant digits of the largest error are enough."
emphasised = ["method", "verification"]
estimate_prompt = "Before you run anything, estimate the largest relative error central differences can reach at their best step. Use the error model: truncation h^2 |f'''| / 6, rounding about eps |f| / h. Write the estimate in the report with an {estimate:cd_err} tag."

[data]
kind = "exact solutions"
description = """
No dataset. The ground truth is analytic: f'(x) = exp(x) (sin x + cos x),
evaluated in 256-bit BigFloat at each Float64 point, so its own error is
far below Float64's eps. Polynomials with small integer coefficients at
dyadic points give derivatives that Float64 computes exactly. Nothing is
random and nothing is downloaded.
"""

[[data.difficulty]]
what = "The smallest error at a single point is luck: rounding errors can cancel, giving an error ten times smaller than at the neighbouring steps (5.9e-13 at h = 2^-17 against 4.5e-12 on both sides, at x = 0.7). The best step has to be judged over all the points."
kc = "finite-difference-error"

[[data.difficulty]]
what = "The error curve of a central difference has two branches: slope 2 where truncation dominates and slope -1 where rounding does. A fit range that crosses the bend measures neither."
kc = "convergence-order-fit"

[[data.difficulty]]
what = "The usual step rule scales h with |x|. That assumes the function varies on the scale of |x|. Far from the origin exp(x) sin(x) still varies on a scale of 1, so the rule's step is about 300 times too large there."
kc = "finite-difference-error"

[[data.difficulty]]
what = "Dual numbers differentiate the code, not the mathematics. The derivative of an unconverged iteration is the derivative of the approximation, and it converges more slowly than the value does."
kc = "seeding"

[[milestone]]
id = 1
title = "The rules: product, quotient, chain, power, and one seeded derivative"
stage = 1
goal = "Fill the five stage-1 holes (`tutor start dualad 1 <dir>`) until the visible tests pass, then run `tutor case check <dir> 1`. The hidden acceptance tests use other functions and points, so code that fits the visible tests only does not pass."
acceptance = "acceptance/m1.jl"
steps = ["verification"]

[[milestone]]
id = 2
title = "Gradients and the competitor: one pass per component, the central difference, the order fit"
stage = 2
goal = "Start stage 2 (`tutor case start dualad <dir>`). It opens all eight holes and adds study.jl and report.qmd. Then run `tutor case check <dir> 2`."
acceptance = "acceptance/m2.jl"
steps = ["method", "verification"]

[[milestone]]
id = 3
title = "The study and the report"
stage = 2
goal = "Write study.jl (its docstrings are the spec) and report.qmd, then run `tutor case check <dir> 3`. This runs the hidden acceptance tests on your study, runs `study()` twice in fresh processes, and checks every tagged number in the report against what your code computed."
acceptance = "acceptance/m3.jl"
steps = ["question", "scales", "model", "method", "verification", "validation", "uncertainty", "report"]
report = true

# ---- the report's checked claims ---------------------------------------------------------------
#
# A claim is a value written in report.qmd immediately before a tag:
# `1.66e-11{claim:cd_err}`, `dual{claim:choice}`. The value must equal what
# your `study()` returns for that id. study() is deterministic, so no
# tolerance is needed beyond the rounding of what you wrote: a written value
# w with its last digit in the 10^k place matches the computed c when
# |w - c| <= 0.5 * 10^k. Integers written without a decimal point must be
# exact.

[report]
tolerance = "deterministic study: half a unit in the last written digit, nothing more"

[[claim]]
id = "x_lo"
section = "question"
text = "the left end of the interval"

[[claim]]
id = "x_hi"
section = "question"
text = "the right end of the interval"

