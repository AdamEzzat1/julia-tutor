# Seeded faults in reference/src (one exact snippet replaced each).
# `tutor guided verify tidy` requires each to fail the acceptance test set of
# its behaviour and to be caught by the exemplary tests (reference/test).
# Students see only the behaviour a surviving mutant breaks, never the edit.

[[mutant]]
id = "temp-not-forced"
milestone = 1
behaviour = "column-types"
file = "Tidy.jl"
find = ":time => DateTime, :temp => Float64,"
replace = ":time => DateTime,"

[[mutant]]
id = "humidity-not-forced"
milestone = 1
behaviour = "column-types"
file = "Tidy.jl"
find = ":unit => String, :humidity => Float64)"
replace = ":unit => String)"

[[mutant]]
id = "dash-not-missing"
milestone = 1
behaviour = "missing-markers"
file = "Tidy.jl"
find = 'const MISSING_MARKERS = ["NA", "", "-"]'
replace = 'const MISSING_MARKERS = ["NA", ""]'

[[mutant]]
id = "na-not-missing"
milestone = 1
behaviour = "missing-markers"
file = "Tidy.jl"
find = 'const MISSING_MARKERS = ["NA", "", "-"]'
replace = 'const MISSING_MARKERS = ["", "-"]'

[[mutant]]
id = "no-dateformat"
milestone = 1
behaviour = "time-parsed"
file = "Tidy.jl"
find = "dateformat = TIME_FORMAT, "
replace = ""

[[mutant]]
id = "path-plain-read"
milestone = 1
behaviour = "path-or-io"
file = "Tidy.jl"
find = "read_readings(path::AbstractString) = open(read_readings, path)"
replace = "read_readings(path::AbstractString) = CSV.read(path, DataFrame)"

[[mutant]]
id = "site-no-lowercase"
