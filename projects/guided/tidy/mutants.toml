file = "Tidy.jl"
find = "normalize_site(s::AbstractString) = lowercase(strip(s))"
replace = "normalize_site(s::AbstractString) = String(strip(s))"

[[mutant]]
id = "site-no-strip"
milestone = 2
behaviour = "normalize-site"
file = "Tidy.jl"
find = "normalize_site(s::AbstractString) = lowercase(strip(s))"
replace = "normalize_site(s::AbstractString) = lowercase(s)"

[[mutant]]
id = "inverted-ratio"
milestone = 2
behaviour = "fahrenheit"
file = "Tidy.jl"
find = "to_celsius(t) = (t - 32) * 5 / 9"
replace = "to_celsius(t) = (t - 32) * 9 / 5"

[[mutant]]
id = "unit-not-updated"
milestone = 2
behaviour = "fahrenheit"
file = "Tidy.jl"
find = '    out.unit = ifelse.(isf, "C", out.unit)'
replace = ""

[[mutant]]
id = "no-dedup"
milestone = 2
behaviour = "duplicates"
file = "Tidy.jl"
find = "    unique!(out)\n"
replace = ""

[[mutant]]
id = "dedup-before-cleaning"
milestone = 2
behaviour = "duplicates"
file = "Tidy.jl"
find = '''
    out = copy(df)
    out.site = normalize_site.(out.site)
    isf = out.unit .== "F"
    out.temp = ifelse.(isf, to_celsius.(out.temp), out.temp)
    out.unit = ifelse.(isf, "C", out.unit)
    unique!(out)
'''
replace = '''
    out = unique(df)
    out.site = normalize_site.(out.site)
    isf = out.unit .== "F"
    out.temp = ifelse.(isf, to_celsius.(out.temp), out.temp)
    out.unit = ifelse.(isf, "C", out.unit)
'''

[[mutant]]
id = "open-range"
milestone = 2
behaviour = "range-flag"
file = "Tidy.jl"
find = "inrange(x, (lo, hi)) = lo <= x <= hi"
replace = "inrange(x, (lo, hi)) = lo < x < hi"

[[mutant]]
id = "missing-humidity-invalid"
milestone = 2
behaviour = "range-flag"
file = "Tidy.jl"
find = "(ismissing(humidity) || inrange(humidity, HUMIDITY_RANGE))"
replace = "(!ismissing(humidity) && inrange(humidity, HUMIDITY_RANGE))"

[[mutant]]
id = "drops-invalid"
milestone = 2
