# Seeded faults in reference/src (one exact snippet replaced each); see tidy/mutants.toml.

[[mutant]]
id = "view-copies"
milestone = 1
behaviour = "view-shares"
file = "PyBridge.jl"
find = "as_numpy(v::Vector{Float64}) = np.asarray(v)"
replace = "as_numpy(v::Vector{Float64}) = np.array(v)"

[[mutant]]
id = "copy-is-view"
milestone = 1
behaviour = "copy-independent"
file = "PyBridge.jl"
find = "nd == 1 && return pyconvert(Vector{Float64}, a)"
replace = "nd == 1 && return PyArray(a)"

[[mutant]]
id = "keeps-int-eltype"
milestone = 1
