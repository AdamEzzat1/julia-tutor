# Seeded faults in reference/src (one exact snippet replaced each).
# `tutor guided verify figures` requires each to fail the acceptance test set of
# its behaviour and to be caught by the exemplary tests (reference/test).
# Students see only the behaviour a surviving mutant breaks, never the edit.

# ---- milestone 1 ----

[[mutant]]
id = "empty-as-zero"
milestone = 1
behaviour = "read-wide"
file = "Figures.jl"
find = "isempty(strip(s)) ? missing : parse(Float64, s)"
replace = "isempty(strip(s)) ? 0.0 : parse(Float64, s)"

[[mutant]]
id = "date-as-text"
milestone = 1
behaviour = "read-wide"
file = "Figures.jl"
find = "DataFrame(date = [Date(r[1]) for r in rows])"
replace = "DataFrame(date = [String(r[1]) for r in rows])"

[[mutant]]
id = "keeps-missing"
milestone = 1
behaviour = "long-format"
file = "Figures.jl"
find = "    t = dropmissing(t, :temp)\n"
replace = ""

[[mutant]]
id = "sorted-date-first"
milestone = 1
behaviour = "long-format"
file = "Figures.jl"
find = "select(t, :date, :city, :temp), [:city, :date])"
replace = "select(t, :date, :city, :temp), [:date, :city])"

[[mutant]]
id = "plain-mean"
milestone = 1
behaviour = "monthly-means"
file = "Figures.jl"
find = ":temp => mean_present => :mean_temp"
replace = ":temp => mean => :mean_temp"

[[mutant]]
id = "unsorted-means"
milestone = 1
behaviour = "monthly-means"
file = "Figures.jl"
find = "    return sort!(s, [:city, :month])"
replace = "    return s"

# ---- milestone 2 ----

[[mutant]]
id = "copied-title"
milestone = 2
behaviour = "makie-structure"
file = "Figures.jl"
find = "Axis(fig[1, 2]; title = MONTHLY_TITLE,"
replace = "Axis(fig[1, 2]; title = DAILY_TITLE,"

[[mutant]]
id = "swapped-labels"
milestone = 2
behaviour = "makie-structure"
file = "Figures.jl"
find = "xlabel = MONTH_LABEL, ylabel = MEAN_LABEL)"
replace = "xlabel = MEAN_LABEL, ylabel = MONTH_LABEL)"

[[mutant]]
id = "day-of-month"
milestone = 2
behaviour = "makie-lines"
file = "Figures.jl"
find = "lines!(ax1, dayofyear.(g.date), g.temp; label = first(g.city))"
replace = "lines!(ax1, day.(g.date), g.temp; label = first(g.city))"

[[mutant]]
id = "one-line"
milestone = 2
behaviour = "makie-lines"
file = "Figures.jl"
find = '''
    for g in groupby(sort(long, [:city, :date]), :city; sort = true)
        lines!(ax1, dayofyear.(g.date), g.temp; label = first(g.city))
    end
'''
replace = '''
    lines!(ax1, dayofyear.(long.date), long.temp; label = "temperature")
'''

