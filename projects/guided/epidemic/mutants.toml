replace = "    du[2] = beta * I - gamma * I\n"

[[mutant]]
id = "peak-on-day-grid"
milestone = 2
behaviour = "peak-condition"
file = "Epidemic.jl"
find = """
    growth(u, t, integrator) = beta * u[1] - gamma
    cb = ContinuousCallback(growth, terminate!)
    prob = ODEProblem(sir!, collect(Float64, u0), (0.0, Float64(horizon)), p)
    sol = solve(prob, Tsit5(); abstol = TOL, reltol = TOL, callback = cb, save_everystep = false)
    return sol.t[end]"""
replace = """
    U = simulate(p, u0, 0:horizon)
    return Float64(argmax(U[2, :]) - 1)"""

[[mutant]]
id = "condition-swapped"
milestone = 2
behaviour = "peak-condition"
file = "Epidemic.jl"
find = "growth(u, t, integrator) = beta * u[1] - gamma"
replace = "growth(u, t, integrator) = gamma * u[1] - beta"

[[mutant]]
id = "no-early-return"
milestone = 2
behaviour = "peak-none"
file = "Epidemic.jl"
find = "    beta * u0[1] <= gamma && return 0.0\n"
replace = ""

