# Seeded faults in reference/src (one exact snippet replaced each); see tidy/mutants.toml.
# Each must fail the acceptance test set of its behaviour and be caught by the
# exemplary tests (reference/test). Students see only the behaviour it breaks.

[[mutant]]
id = "rates-swapped"
milestone = 1
behaviour = "rhs-values"
file = "Epidemic.jl"
find = "    beta, gamma = p\n    S, I, R = u"
replace = "    gamma, beta = p\n    S, I, R = u"

[[mutant]]
id = "rhs-allocates"
milestone = 1
behaviour = "rhs-values"
file = "Epidemic.jl"
find = "    du[1] = -beta * S * I\n    du[2] = beta * S * I - gamma * I\n    du[3] = gamma * I\n"
replace = "    du .= [-beta * S * I, beta * S * I - gamma * I, gamma * I]\n"

[[mutant]]
id = "no-saveat"
milestone = 1
behaviour = "simulate-saveat"
file = "Epidemic.jl"
find = "sol = solve(prob, Tsit5(); saveat = days, abstol = TOL, reltol = TOL)"
replace = "sol = solve(prob, Tsit5(); abstol = TOL, reltol = TOL)"

[[mutant]]
id = "starts-at-first-day"
milestone = 1
behaviour = "simulate-saveat"
file = "Epidemic.jl"
find = "(0.0, Float64(last(days)))"
replace = "(Float64(first(days)), Float64(last(days)))"

[[mutant]]
id = "default-tolerances"
milestone = 1
behaviour = "simulate-saveat"
file = "Epidemic.jl"
find = "sol = solve(prob, Tsit5(); saveat = days, abstol = TOL, reltol = TOL)"
replace = "sol = solve(prob, Tsit5(); saveat = days)"

[[mutant]]
id = "recovery-from-R"
milestone = 2
behaviour = "conservation"
file = "Epidemic.jl"
find = "    du[3] = gamma * I\n"
replace = "    du[3] = gamma * R\n"

[[mutant]]
id = "infection-without-S"
milestone = 2
behaviour = "conservation"
file = "Epidemic.jl"
