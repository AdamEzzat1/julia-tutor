name = "bayesreg"
package = "BayesReg"
env = "turing"
status = "ready"
title = "BayesReg: Bayesian linear regression, checked against the exact posterior"
summary = "Build Bayesian linear regression twice: first the exact posterior for a normal prior and known noise (closed form, tested exactly), then the same model in Turing.jl sampled with NUTS, and check that the samples agree with the exact answer within a margin derived from the effective sample size. Finish with predictive intervals from both. You write the code and the tests."
kcs = ["packages", "testing", "bayesian-inference", "conjugate-priors", "mcmc", "monte-carlo-error"]
reading = '''
Prerequisites: course unit 27 (probabilistic programming).

The model: `y = X w + noise`, noise `N(0, sigma^2)` per row with `sigma`
known, and the prior `w ~ N(0, tau^2 I)`. Then the posterior of `w` is
normal, with precision `A = X'X / sigma^2 + I / tau^2`, covariance `inv(A)`
and mean `A \ (X'y / sigma^2)`. Milestone 1 is that formula; everything
after it is checked against it.

Keep test data tiny (20 rows, 2 coefficients) and draw it with a seeded
`Xoshiro`: sampling is the slow part of this project, and every check runs
your tests several times. Every random function takes an `rng`. Every
tolerance in your tests gets a comment saying where it comes from: the
conditioning of `A` for exact formulas, the Monte Carlo standard error for
samples. This env runs in the container only on Windows hosts.
'''

[[milestone]]
id = 0
title = "A package with a test suite"
min_score = 1.0
goal = '''
Create the package as in the tidy project's milestone 0 (`tutor guided show
tidy 0` has the full steps): `Pkg.generate("BayesReg")`, move
`Project.toml` and `src/` into this folder, run `./tutor guided deps <this
folder>` from the julia-tutor folder (Turing), and write
`test/runtests.jl` with `using BayesReg, Test` and one check. `using
Turing, LinearAlgebra, Random, Statistics` inside the module gives you
everything this project needs: Turing re-exports Distributions.
'''

  [[milestone.api]]
  signature = "module BayesReg"
  doc = "Defined in src/BayesReg.jl."

  [[milestone.behaviour]]
  id = "package-layout"
  kc = "packages"
  spec = "`src/BayesReg.jl` defines a module named `BayesReg` that loads without errors."
  hints = [
    "A package is a module whose name matches its file name under src/.",
    "Open src/BayesReg.jl: its first code line should be `module BayesReg` and its last `end`.",
    "If loading fails, the error above names the line; a `using` of a package missing from the environment is the usual cause.",
  ]
  answer_tokens = []
  test_hints = [
    "Any check that runs counts here.",
    "`@test BayesReg isa Module` is enough for milestone 0.",
    "Put it inside a `@testset` so the report names it.",
  ]

[[milestone]]
id = 1
title = "The exact posterior"
min_score = 1.0
must_cover = ["posterior-mean", "posterior-cov", "posterior-args"]
goal = '''
The conjugate posterior in closed form. Form the precision `A`, then get the
mean by solving a linear system with it and the covariance from a
factorisation of it (`A` is symmetric positive definite, so a Cholesky
factorisation exists). Tests compare with the formula and with its two
limits: a very wide prior (the posterior mean becomes the least-squares fit)
and a very tight one (it shrinks to zero).
'''

  [[milestone.api]]
  signature = "posterior_exact(X::AbstractMatrix, y::AbstractVector; sigma, tau) -> NamedTuple (mean, cov)"
  doc = "`post = posterior_exact(X, y; sigma = 0.5, tau = 2.0)`; `post.mean` is a `Vector{Float64}` of length `size(X, 2)`, `post.cov` the covariance matrix."

  [[milestone.behaviour]]
  id = "posterior-mean"
  kc = "conjugate-priors"
  spec = "`post.mean` equals `A \\ (X'y / sigma^2)` up to rounding (relative error about cond(A) times eps); it tends to the least-squares fit as `tau` grows and to zero as `tau` shrinks."
  hints = [
    "Check your formula against the two limits: a flat prior and a very tight one.",
    "Both terms of the posterior are weighted by a precision: the data by one over the noise variance, the prior by one over the prior variance. The data term on the right-hand side needs the same weight as `X'X` on the left.",
    "Look at the right-hand side of the solve for the mean: it must carry the same noise scaling as the data part of the precision, or the result is only right when the noise has unit size.",
  ]
  answer_tokens = ["X' * y / sigma^2", "X'y / sigma^2", "X' * y ./ sigma^2"]
  test_hints = [
    "Compare with the formula, computed in the test in a different way (for example with an explicit inverse), with a tolerance from cond(A).",
    "Use `sigma` and `tau` different from 1: with both equal to 1 a missing scale factor cannot show.",
    "Add the limits: `tau = 1e6` against `X \\ y`, `tau = 1e-6` against zero, each with a tolerance worked out from the size of the prior term.",
  ]

  [[milestone.behaviour]]
  id = "posterior-cov"
  kc = "conjugate-priors"
  spec = "`post.cov` is symmetric (exactly), positive definite, and `post.cov * A` equals the identity within a tolerance derived from cond(A)."
  hints = [
    "The covariance is the inverse of the precision, not the precision itself.",
    "The prior adds its precision, one over the prior variance, to the diagonal; the prior's parameter here is a standard deviation.",
    "Check the prior term of the precision (it must be a variance in the denominator) and that what you return is the inverse of the precision; a factorisation's inverse is exactly symmetric, an inverse of a plain matrix need not be.",
  ]
  answer_tokens = ["tau^2", "inv(F)", "inv(cholesky"]
  test_hints = [
    "Test the properties a covariance must have, then its value.",
    "`issymmetric` and `isposdef`, then `post.cov * A ≈ I` with `A` built in the test.",
    "Use `tau = 2.0` (not 1) so that confusing a standard deviation with a variance changes `A`.",
  ]

  [[milestone.behaviour]]
  id = "posterior-args"
  kc = "errors"
  spec = "A `y` whose length differs from the number of rows of `X` throws a `DimensionMismatch`; `sigma <= 0` or `tau <= 0` throws an `ArgumentError`."
  hints = [
    "The formula squares `sigma` and `tau`, so a negative value gives a plausible answer for a meaningless input.",
    "Check the inputs at the top of the function, before any arithmetic.",
    "One check per input: the sizes of `X` and `y` against each other (Base has an exception type for sizes that do not match), and each scale against zero (the standard exception for a bad argument value).",
  ]
  answer_tokens = ["sigma > 0", "tau > 0", "sigma <= 0", "tau <= 0"]
  test_hints = [
    "Test the calls that should fail.",
    "`@test_throws` with the exception type the spec names.",
    "Try a negative `sigma`, a zero `tau`, and a `y` one entry too short.",
  ]

  [[milestone.question]]
  kind = "choice"
  prompt = "With 20 rows of data, what happens to the posterior mean as `tau` grows from 1 to 1e6?"
  choices = [
    "It moves towards the least-squares fit `X \\ y`",
    "It moves towards zero",
    "It stays the same: the prior does not affect the mean",
    "It becomes undefined, because the prior has no variance left",
  ]
  answer = 1
  explain = "The prior's precision `I / tau^2` goes to zero, so `A` becomes `X'X / sigma^2` and the mean becomes the solution of the normal equations, the least-squares fit."
  misconceptions = [
    "",
    "That is the other limit: a tiny `tau` (a tight prior around zero) pulls the mean to zero.",
    "The prior adds `I / tau^2` to the precision; for small or moderate `tau` it shrinks the mean towards zero.",
    "A large `tau` is a wide prior, a large variance; it is a small `tau` that leaves little variance.",
  ]

[[milestone]]
id = 2
title = "The Turing model"
min_score = 1.0
must_cover = ["model-prior", "model-likelihood"]
goal = '''
Write the same model as a Turing `@model`. A model is a log density you can
evaluate before sampling anything: `logprior(model, (w = w,))`,
`loglikelihood(model, (w = w,))` and `logjoint(model, (w = w,))` evaluate it
at a given `w`. Test those against the normal log densities written out by
hand. `@model` functions take positional arguments; write the model with
positional `sigma` and `tau` and let `regression_model` pass its keywords
on (and check them as in milestone 1).
'''

  [[milestone.api]]
  signature = "regression_model(X, y; sigma, tau) -> DynamicPPL.Model"
  doc = "Coefficients `w ~ MvNormal(zeros(k), tau^2 I)`, observations `y ~ MvNormal(X w, sigma^2 I)`, with `y` observed."

  [[milestone.behaviour]]
  id = "model-prior"
  kc = "bayesian-inference"
  spec = "`logprior(model, (w = w,))` equals the log density of `N(0, tau^2 I)` at `w`, `-k/2 log(2 pi tau^2) - |w|^2 / (2 tau^2)`, up to rounding."
  hints = [
    "Evaluate the prior part of the model at a fixed `w` and compare with the formula by hand.",
    "`MvNormal(mu, S)` reads `S` as a covariance matrix, not as standard deviations.",
    "Look at the second argument of the prior's `MvNormal`: it must hold the prior's variance on the diagonal, and `tau` is a standard deviation.",
  ]
  answer_tokens = ["tau^2 * I", "tau^2*I", "abs2(tau)"]
  test_hints = [
    "Compare `logprior` with the formula written out by hand.",
    "Use `tau` different from 1, so a standard deviation used as a variance gives a different number.",
    "A relative tolerance near 1e-12 is safe for a sum of a few same-signed terms; say so in a comment.",
  ]

  [[milestone.behaviour]]
  id = "model-likelihood"
  kc = "bayesian-inference"
  spec = "`loglikelihood(model, (w = w,))` equals `-n/2 log(2 pi sigma^2) - |y - X w|^2 / (2 sigma^2)` up to rounding, and `logjoint` is the sum of the two."
  hints = [
    "Evaluate the likelihood part at a fixed `w` and compare with the formula by hand.",
    "The observations' covariance is the noise variance times the identity.",
    "Look at the second argument of the observations' `MvNormal`: it needs the variance of the noise, and `sigma` is its standard deviation.",
  ]
  answer_tokens = ["sigma^2 * I", "sigma^2*I", "abs2(sigma)"]
  test_hints = [
    "Compare `loglikelihood` with the formula written out by hand.",
    "Use `sigma` different from 1, and a `w` that does not fit the data exactly.",
    "Check `logjoint` too: it is the prior plus the likelihood.",
  ]

  [[milestone.question]]
  kind = "choice"
  prompt = "A model has `y ~ MvNormal(X * w, sigma * I)` with `sigma = 0.5`. What noise standard deviation does it assume?"
  choices = [
    "0.5",
    "0.25",
    "about 0.71",
    "1.0",
  ]
  answer = 3
  explain = "The second argument of `MvNormal` is a covariance: `sigma * I` gives every observation variance 0.5, so a standard deviation of sqrt(0.5), about 0.71. The intended model needs `sigma^2 * I`."
  misconceptions = [
    "That would be the case for `sigma^2 * I`; the matrix holds variances, not standard deviations.",
    "0.25 is `sigma^2`, the variance the model was meant to have; this one has variance 0.5.",
    "",
    "`I` alone would give variance 1; it is scaled by 0.5 here.",
  ]

[[milestone]]
id = 3
title = "Sampling"
min_score = 1.0
must_cover = ["sample-reproducible", "sample-shape", "posterior-agrees"]
goal = '''
Sample the model with NUTS and compare with the exact posterior. Turing 0.49
returns a FlexiChains chain: `chain[@varname(w)]` holds one coefficient
vector per draw. `using Turing.FlexiChains: mcse, ess` gives the Monte Carlo
standard error and effective sample size per coefficient,
`mcse(chain)[@varname(w[1])]`. Keep `n` small in your tests (a few hundred
to 1000): every check runs them several times.
'''

  [[milestone.api]]
  signature = "sample_posterior(rng::AbstractRNG, model; n = 1000) -> chain"
  doc = "`n` NUTS draws, every random choice taken from `rng`; no progress bar."

  [[milestone.api]]
  signature = "coefficient_draws(chain) -> Matrix{Float64}"
  doc = "The draws of `w` as an `n × k` matrix: row `i` is draw `i`, column `j` is `w[j]`."

  [[milestone.behaviour]]
  id = "sample-reproducible"
  kc = "mcmc"
  spec = "Two calls with `Xoshiro(s)` for the same seed `s` give identical draws."
  hints = [
    "Sampling is random; tests need it repeatable, so the randomness has to come from the generator you are given.",
    "Turing's sampling function accepts a random number generator as its first argument; without one it uses the global generator.",
    "Pass the `rng` argument on to the sampling call as its first argument, ahead of the model.",
  ]
  answer_tokens = ["sample(rng"]
  test_hints = [
    "Sample twice from fresh generators with the same seed.",
    "Compare the two draw matrices for exact equality: same seed, same arithmetic, same numbers.",
    "`@test coefficient_draws(c1) == coefficient_draws(c2)` compares two computed matrices, which is exact here by construction (no float literal involved).",
  ]

  [[milestone.behaviour]]
  id = "sample-shape"
  kc = "mcmc"
  spec = "`coefficient_draws(sample_posterior(rng, model; n = n))` has size `(n, k)`: `n` draws (adaptation draws discarded), one column per coefficient."
  hints = [
    "Rows are draws, columns are coefficients.",
    "Stacking one vector per draw side by side gives a `k × n` matrix; the spec asks for the other orientation.",
    "Check where you build the matrix and whether the keyword `n` reaches the sampler: the result's size must follow it.",
  ]
  answer_tokens = ["permutedims", "transpose", "reduce(vcat"]
  test_hints = [
    "Check `size` of the draws.",
    "Use an `n` that is not the default, such as 200.",
    "With 2 coefficients and `n = 200` the size is `(200, 2)`; a `(2, 200)` result means rows and columns are swapped.",
  ]

  [[milestone.behaviour]]
  id = "posterior-agrees"
  kc = "monte-carlo-error"
  spec = "Each sampled posterior mean is within 4 Monte Carlo standard errors (posterior sd over the square root of the effective sample size) of the exact mean; for a normal sampling error that bound fails with probability about 6e-5 per coefficient, which the test states."
  hints = [
    "The draws must come from the posterior: the model conditioned on the data.",
    "Turing can also draw from the prior alone, ignoring the observations; such draws centre on zero, not on the exact posterior mean.",
    "Look at the sampler you pass: it must be the gradient-based one the spec names, which samples the posterior; the prior sampler is for prior predictive checks.",
  ]
  answer_tokens = ["NUTS()"]
  test_hints = [
    "Compare the sampled means with `posterior_exact` on the same data.",
    "Samples are correlated, so the error of their mean is the posterior sd over the square root of the effective sample size, not of `n`.",
    "Use `mcse(chain)[@varname(w[j])]` and a bound of 4 of them per coefficient, with a fixed seed and the false-failure probability in a comment.",
  ]

  [[milestone.question]]
  kind = "choice"
  prompt = "1000 NUTS draws of a coefficient have sd 0.11 and ESS 250. How far from the exact posterior mean is their mean typically?"
  choices = [
    "About 0.0035 (0.11 / sqrt(1000))",
    "About 0.007 (0.11 / sqrt(250))",
    "About 0.11, the posterior sd",
    "Zero: NUTS is exact for a normal posterior",
  ]
  answer = 2
  explain = "The Monte Carlo standard error is the sd over the square root of the effective sample size. Correlated draws carry less information than independent ones: these 1000 are worth about 250."
  misconceptions = [
    "That treats the draws as independent; successive NUTS draws are correlated, so the chain is worth 250 independent draws, not 1000.",
    "",
    "The sd is the spread of the posterior itself; the error of a mean of many draws is much smaller.",
    "NUTS draws converge to the posterior, but any finite chain's mean has Monte Carlo error.",
  ]

  [[milestone.question]]
  kind = "choice"
  prompt = "A test passes when the sampled mean is within 4 MCSE of the exact mean, with the seed fixed. Why fix the seed if 4 MCSE already fails only about 6e-5 of the time?"
  choices = [
    "So the test gives the same verdict on every run; the margin then says how far that one run is from failing",
    "Because NUTS draws are independent of each other only when the sampler starts from a fixed seed, and the 6e-5 assumes independent draws",
    "Because without a seed the MCSE cannot be computed",
  ]
  answer = 1
  explain = "With a fixed seed a test either passes every time or fails every time on the pinned versions, so it cannot flake; the 4 MCSE margin is what makes it likely that a correct sampler passes for that seed, and the observed margin is worth stating."
  misconceptions = [
    "",
    "The seed fixes which draws you get, not how they depend on each other; NUTS draws stay correlated.",
    "MCSE comes from the draws themselves (their sd and autocorrelation); any chain has one, seeded or not.",
  ]

[[milestone]]
id = 4
title = "Prediction"
min_score = 0.8
must_cover = ["predictive-exact", "predictive-level", "predictive-samples"]
goal = '''
Predictive intervals for a new input `xnew`. A new observation is uncertain
for two reasons: the coefficients are uncertain (variance `xnew' C xnew`)
and the noise is added on top (variance `sigma^2`). Both are normal here, so
the predictive is normal and its central interval uses the normal quantile:
`quantile(Normal(), p)`. Write one method for the exact posterior and one
for a matrix of draws; test the draws version with independent draws from
`MvNormal(post.mean, post.cov)` (fast, and its Monte Carlo error is
derivable), not with NUTS.
'''

  [[milestone.api]]
  signature = "predictive_interval(post::NamedTuple, xnew::AbstractVector; sigma, level = 0.9) -> Tuple{Float64,Float64}"
  doc = "Central `level` interval of the posterior predictive at `xnew` for `post = posterior_exact(...)`."

  [[milestone.api]]
  signature = "predictive_interval(draws::AbstractMatrix, xnew::AbstractVector; sigma, level = 0.9) -> Tuple{Float64,Float64}"
  doc = "The same from an `n × k` matrix of draws of `w` (as `coefficient_draws` returns): the mean and variance of `draws * xnew`, plus the noise variance."

  [[milestone.behaviour]]
  id = "predictive-exact"
  kc = "bayesian-inference"
  spec = "From the exact posterior: the interval is `mu ± z s` with `mu = xnew'm`, `s^2 = xnew'C xnew + sigma^2` and `z` the normal quantile at `(1 + level) / 2`, up to rounding."
  hints = [
    "The prediction is uncertain for two reasons; both add to its variance.",
    "A central interval leaves half of `1 - level` in each tail, so its upper end is not the `level` quantile.",
    "Check the variance (coefficient part plus noise part) and the probability you pass to the quantile function: it must put half the missing probability above the interval.",
  ]
  answer_tokens = ["(1 + level) / 2", "+ sigma^2"]
  test_hints = [
    "Compute the interval in the test from the formula and compare.",
    "Use an `xnew` where the coefficient variance and the noise variance are of similar size, so dropping either shows.",
    "Check the width too: at `level = 0.9` it is `2 * 1.6449 * s`.",
  ]

  [[milestone.behaviour]]
  id = "predictive-level"
  kc = "errors"
  spec = "The keyword `level` sets the coverage (a higher level gives a wider interval); a `level` outside (0, 1) throws an `ArgumentError`."
  hints = [
    "The keyword must change the result, and nonsense values must be refused.",
    "A coverage of 0 or 1 or more has no finite central interval.",
    "At the top of each method, check that the level lies strictly between 0 and 1 and throw the standard exception for a bad argument value; use the keyword, not a constant, where the quantile is taken.",
  ]
  answer_tokens = ["0 < level < 1"]
  test_hints = [
    "Call with a level other than the default and check the effect.",
    "Compare `level = 0.5` with the formula; check that 0.99 gives a wider interval than 0.9.",
    "`@test_throws ArgumentError` for `level = 1.0` and `level = 0.0`, on both methods.",
  ]

  [[milestone.behaviour]]
  id = "predictive-samples"
  kc = "monte-carlo-error"
  spec = "From `n` independent draws of the exact posterior, each end of the interval is within 5 standard errors of the exact interval's end (the standard error of the mean and of the variance of `draws * xnew`, derived in the test)."
  hints = [
    "From draws, the coefficient part of the predictive variance is the spread of `draws * xnew`.",
    "The predictive variance from draws has two parts, like the exact one: the variance over the draws of `xnew'w`, and the noise.",
    "Check the variance you build from the draws: it needs the sample variance of the predicted means as well as the noise variance.",
  ]
  answer_tokens = ["var(f)", "var(draws"]
  test_hints = [
    "Draw independent samples from `MvNormal(post.mean, post.cov)` with a seeded `Xoshiro` and compare with the exact interval.",
    "Work out the standard error of each end: it comes from the error of the mean (variance `v / n`) and of the variance (about `v sqrt(2 / n)`) of `draws * xnew`.",
    "Use a few thousand draws and 5 standard errors, and choose `xnew` so the coefficient variance is not tiny next to `sigma^2`.",
  ]

  [[milestone.question]]
  kind = "choice"
  prompt = "With 20 rows of data, how does the 90% predictive interval at a fixed `xnew` change as more rows are added?"
  choices = [
    "It shrinks to zero width",
    "It shrinks towards a width set by the noise, about 2 * 1.645 * sigma",
    "It stays the same width",
    "It grows, because each row adds noise",
  ]
  answer = 2
  explain = "More data shrinks the coefficient variance `xnew' C xnew` towards zero, but a new observation still carries its own noise, variance `sigma^2`; the width tends to `2 z sigma` with `z = 1.645`."
  misconceptions = [
    "That is the interval for the mean `xnew'w`, not for a new observation, which has noise of its own.",
    "",
    "The coefficient part of the variance falls as data are added; only the noise part stays.",
    "The noise of the data is already in the posterior; more rows make the coefficients more certain, not less.",
  ]
