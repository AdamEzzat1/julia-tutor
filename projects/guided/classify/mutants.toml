# Seeded faults in reference/src (one exact snippet replaced each); see tidy/mutants.toml.
# `tutor guided verify classify` requires each to load, to fail the acceptance
# test set of its behaviour and to be caught by the exemplary tests.

# ---- milestone 1 ----

[[mutant]]
id = "parsed-as-float64"
milestone = 1
behaviour = "load-columns"
file = "Classify.jl"
find = "parse(Float32, r[i])"
replace = "parse(Float64, r[i])"

[[mutant]]
id = "samples-as-rows"
milestone = 1
behaviour = "load-columns"
file = "Classify.jl"
find = "for i in 1:nf, r in rows]"
replace = "for r in rows, i in 1:nf]"

[[mutant]]
id = "not-stratified"
milestone = 1
behaviour = "stratified-split"
file = "Classify.jl"
find = '''
    for c in sort(unique(y))
        idx = shuffle(rng, findall(==(c), y))
        k = round(Int, test_fraction * length(idx))
        append!(test, idx[1:k])
        append!(train, idx[k+1:end])
    end
'''
replace = '''
    idx = shuffle(rng, collect(eachindex(y)))
    k = round(Int, test_fraction * length(idx))
    append!(test, idx[1:k])
    append!(train, idx[k+1:end])
'''

[[mutant]]
id = "boundary-in-both"
milestone = 1
behaviour = "stratified-split"
file = "Classify.jl"
find = "append!(train, idx[k+1:end])"
replace = "append!(train, idx[k:end])"

[[mutant]]
id = "fraction-ignored"
milestone = 1
behaviour = "stratified-split"
file = "Classify.jl"
find = "k = round(Int, test_fraction * length(idx))"
replace = "k = round(Int, 0.3 * length(idx))"

[[mutant]]
id = "global-rng"
milestone = 1
behaviour = "rng-reproducible"
file = "Classify.jl"
find = "idx = shuffle(rng, findall(==(c), y))"
replace = "idx = shuffle(findall(==(c), y))"

[[mutant]]
id = "fixed-seed"
milestone = 1
behaviour = "rng-reproducible"
file = "Classify.jl"
find = "idx = shuffle(rng, findall(==(c), y))"
replace = "idx = shuffle(Xoshiro(42), findall(==(c), y))"

