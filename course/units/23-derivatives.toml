  "ForwardDiff calls `final_position` with a vector of dual numbers. Which parts of the code demand `Float64`?",
  "Loosen the signature, and give the state the element type of `p` (`eltype(p)`) instead of `Float64`. `ForwardDiff.gradient` wants a function of `p` alone: wrap the call in a closure that fixes `nsteps`.",
]

