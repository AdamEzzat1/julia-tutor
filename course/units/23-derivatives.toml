[[problem]]
id = "generic-for-forwarddiff"
title = "Make a simulation differentiable"
difficulty = "stretch"
kcs = ["generic-code-for-ad", "forward-mode-ad"]
entry = "position_sensitivity"
packages = ["ForwardDiff"]
prompt = '''
This function simulates a damped spring (stiffness `k`, damping `c`) for
`nsteps` steps of size 0.01, starting at position 1 and velocity 0, and
returns the final position:

```julia
function final_position(p::Vector{Float64}, nsteps::Int)
    k, c = p
    dt = 0.01
    u = zeros(2)              # position, velocity
    u[1] = 1.0
    for _ in 1:nsteps
        a = -k * u[1] - c * u[2]
        u[1] += dt * u[2]
        u[2] += dt * a
    end
    return u[1]
end
```

ForwardDiff cannot differentiate it as written. Make it generic (keep the
update order exactly as it is), then write `position_sensitivity(p, nsteps)`
returning the gradient of the final position with respect to `p = [k, c]`,
computed with `ForwardDiff.gradient`.

```julia
position_sensitivity([1.0, 0.1], 100)   # a 2-element Vector{Float64}
position_sensitivity([1.0, 0.1], 0)     # [0.0, 0.0]: nothing has happened yet
```

The grader checks the gradient, then measures speed, allocations and type
stability at 32,000 steps: aim for a loop that allocates nothing.
'''
starter = '''
using ForwardDiff

# Make this function generic so that ForwardDiff can run it on dual numbers.
function final_position(p::Vector{Float64}, nsteps::Int)
    k, c = p
    dt = 0.01
    u = zeros(2)              # position, velocity
    u[1] = 1.0
    for _ in 1:nsteps
        a = -k * u[1] - c * u[2]
        u[1] += dt * u[2]
        u[2] += dt * a
    end
    return u[1]
end

function position_sensitivity(p, nsteps)
    # your code here
end
'''
reference = '''
using ForwardDiff

function final_position(p::AbstractVector{<:Real}, nsteps::Integer)
    k, c = p
    dt = 0.01
    T = eltype(p)
    x, v = one(T), zero(T)        # position, velocity, with the element type of p
    for _ in 1:nsteps
        a = -k * x - c * v
        x += dt * v
        v += dt * a
    end
    return x
end

position_sensitivity(p, nsteps) = ForwardDiff.gradient(q -> final_position(q, nsteps), p)
'''
cases = ["[1.0, 0.1], 100", "[1.0, 0.1], 0", "[2.5, 0.3], 1000", "[0.5, 0.0], 314"]
# Forward mode propagates the derivatives through the same recurrence as the
# values, so any rewrite that keeps the update order performs the same
# floating-point operations (bitwise equal in practice). One explicit Euler
# step multiplies phase-plane areas by det = 1 - c*dt + k*dt^2 (the eigenvalues
# have modulus sqrt(det)). With c >= 0.05 (gen) or c = 0.1, 0.3 (cases), c*dt
# exceeds k*dt^2 and the step contracts. The undamped case [0.5, 0.0], 314 has
# det = 1 + 5e-5: it grows, but only by a factor 1.00005^157 < 1.01 over its
# 314 steps. Either way rounding grows at most about linearly: <= nsteps * eps
# times a bounded factor, about 2e-13 for 1000 steps. rtol = 1e-9 leaves a wide margin, while a
# forward difference (relative error ~ h ~ 1e-6) fails clearly.
gen = "rng -> [([0.5 + 2rand(rng), 0.05 + 0.3rand(rng)], rand(rng, 0:600)) for _ in 1:15]"
compare = "isapprox"
rtol = 1e-9
