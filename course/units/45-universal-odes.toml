]

  [problem.perf]
  args = "3rand(rng, 2), Chain(Dense(2 => n, tanh), Dense(n => 2)), ComponentArray{Float64}(first(Lux.setup(StableRNG(1), Chain(Dense(2 => n, tanh), Dense(n => 2))))), last(Lux.setup(StableRNG(1), Chain(Dense(2 => n, tanh), Dense(n => 2)))), 1.3, 1.8"
  sizes = [16]

  [[problem.variant]]
  label = "+γ y instead of -γ y"
  code = '''
function ude_rhs(u, model, ps, st, α, γ)
    nn_out, _ = model(u, ps, st)
    return [α * u[1] + nn_out[1], γ * u[2] + nn_out[2]]
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
