reference = '''
using DataFrames, Statistics

function mean_by_category(data)
    df = DataFrame(data)
    g = combine(groupby(df, :category), :price => mean => :mean_price)
    sort!(g, :category)
    return collect(zip(g.category::Vector{String}, g.mean_price::Vector{Float64}))
end
'''
cases = [
  "(category = [\"b\", \"a\", \"b\"], price = [100, 250, 300])",
  "(category = [\"x\"], price = [7])",
