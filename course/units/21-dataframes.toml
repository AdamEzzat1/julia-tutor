[[problem]]
id = "df-raise-report"
title = "Fix the raise report"
difficulty = "core"
kcs = ["dataframes", "split-apply-combine"]
entry = "mean_after_raise"
packages = ["DataFrames"]
prompt = '''
`df` is a payroll `DataFrame` with columns `dept` (`Vector{String}`) and
`salary` (`Vector{Float64}`), at least one row. `mean_after_raise(df, pct)`
should return the mean salary of each department after every salary rises
by `pct` percent, as a `Vector{Tuple{String, Float64}}` of `(dept, mean)`
sorted by department name. The caller keeps using `df` as the current
payroll afterwards, so the function must leave it as it was.

The starter code is a colleague's version. It is wrong: find the bug and
fix it.

```julia
df = DataFrame(dept = ["ops", "eng", "eng"], salary = [100.0, 200.0, 300.0])
mean_after_raise(df, 10)   # [("eng", 275.0), ("ops", 110.0)], up to rounding
```

The grader compares your result and `df` after the call with the
reference's, and measures speed.
'''
starter = '''
using DataFrames, Statistics

function mean_after_raise(df, pct)
    salary = df.salary
    salary .*= 1 + pct / 100
    g = combine(groupby(df, :dept; sort = true), :salary => mean => :mean)
    return collect(zip(g.dept, g.mean))
end
'''
reference = '''
using DataFrames, Statistics

function mean_after_raise(df, pct)
    raised = transform(df, :salary => (s -> s .* (1 + pct / 100)) => :salary)
    g = combine(groupby(raised, :dept; sort = true), :salary => mean => :mean)
    return collect(zip(g.dept, g.mean))
end
'''
# The starter's means are right; its bug is that `df.salary` is the stored
# column, so `.*=` raises the caller's payroll too. `compare_args` makes the
# grader compare `df` after the call. Means of a few raised salaries: the
# variants scale before or after averaging, which moves the result by a few
# ulps, hence isapprox with rtol = 1e-12.
# The return type is not asserted: `g.dept` cannot be inferred from a
# DataFrame, and the grader judges stability relative to the reference.
compare = "isapprox"
rtol = 1e-12
compare_args = true
cases = [
  "DataFrame(dept = [\"ops\", \"eng\", \"eng\"], salary = [100.0, 200.0, 300.0]), 10",
  "DataFrame(dept = [\"hr\"], salary = [50.0]), 0",
  "DataFrame(dept = [\"lab\", \"eng\", \"lab\", \"hr\"], salary = [80.0, 120.0, 90.0, 70.0]), 3",
]
gen = "rng -> [(m = rand(rng, 1:30); (DataFrame(dept = rand(rng, [\"eng\", \"ops\", \"hr\", \"lab\"], m), salary = rand(rng, 40:200, m) .* 1.0), rand(rng, 0:15))) for _ in 1:15]"
hints = [
  "The means come out right on the first call. Call the function twice on the same table, or print `df` after one call, and compare with what the caller expects to still have.",
  "Look at what the first line of the function hands you: the column stored in `df`, or a vector of your own? Then check which table the grouping reads its salaries from.",
]

  [problem.perf]
  args = "DataFrame(dept = rand(rng, [\"eng\", \"ops\", \"hr\", \"lab\"], n), salary = rand(rng, 40:200, n) .* 1.0), 3"
  sizes = [20000]

  [[problem.variant]]
  label = "df[!, :salary] instead of df.salary: still the stored column"
  code = '''
using DataFrames, Statistics
function mean_after_raise(df, pct)
    salary = df[!, :salary]
    salary .*= 1 + pct / 100
    g = combine(groupby(df, :dept; sort = true), :salary => mean => :mean)
    return collect(zip(g.dept, g.mean))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "copies the column, but groups the original table: the raise is lost"
  code = '''
using DataFrames, Statistics
function mean_after_raise(df, pct)
    salary = df[:, :salary]
    salary .*= 1 + pct / 100
    g = combine(groupby(df, :dept; sort = true), :salary => mean => :mean)
    return collect(zip(g.dept, g.mean))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "copies the whole table first, then raises in place"
  code = '''
using DataFrames, Statistics
function mean_after_raise(df, pct)
    t = copy(df)
    t.salary .*= 1 + pct / 100
    g = combine(groupby(t, :dept; sort = true), :salary => mean => :mean)
    return collect(zip(g.dept, g.mean))
end
'''
  expect = ["correct"]

  [[problem.variant]]
  label = "raises the means instead of the salaries"
  code = '''
using DataFrames, Statistics
function mean_after_raise(df, pct)
    f = 1 + pct / 100
    g = combine(groupby(df, :dept; sort = true), :salary => (s -> mean(s) * f) => :mean)
    return collect(zip(g.dept, g.mean))
end
'''
  expect = ["correct"]

[[problem]]
id = "csv-rain-summary"
title = "Read a European CSV"
difficulty = "stretch"
kcs = ["csv", "missing-values"]
packages = ["CSV", "DataFrames"]
entry = "rain_summary"
prompt = '''
`s` is the text of a CSV file with the header `city;rain`. Fields are
separated by `;`, rainfall in millimetres is written with a decimal
**comma** (`12,5`), and a day without a measurement says `NA`. At least one
day has a measurement. Write `rain_summary(s)` returning the tuple
`(number of NA days, mean of the measured days)` as a `Tuple{Int, Float64}`.

```julia
rain_summary("city;rain\nOslo;12,5\nRome;NA\nLima;3,0\n")   # (1, 7.75)
```

Parse the text with `CSV.read(IOBuffer(s), DataFrame; ...)`. The grader
also checks type stability: the `DataFrame` does not tell the compiler
what `df.rain` holds.
'''
starter = '''
using CSV, DataFrames, Statistics

function rain_summary(s)
    df = CSV.read(IOBuffer(s), DataFrame)
    # your code here
end
'''
reference = '''
using CSV, DataFrames, Statistics

summarize_rain(r) = (count(ismissing, r), mean(skipmissing(r)))

function rain_summary(s)
    df = CSV.read(IOBuffer(s), DataFrame; delim = ';', decimal = ',', missingstring = "NA")
    return summarize_rain(df.rain)::Tuple{Int, Float64}
end
'''
# The assertion is what makes the entry's return type concrete: inference
# cannot see through `df.rain`, so a barrier alone returns `Any` (the
# "no return type" variant below), and hint 2 points the learner at it.
cases = [
  '"city;rain\nOslo;12,5\nRome;NA\nLima;3,0\n"',
  '"city;rain\nOslo;0,5\n"',
  '"city;rain\nRome;NA\nRome;NA\nLima;10,0\nOslo;2,5\n"',
]
gen = '''rng -> [(m = rand(rng, 1:25); rows = [string(rand(rng, ["Oslo", "Rome", "Lima"]), ';', (i > 1 && rand(rng) < 0.25) ? "NA" : replace(string(rand(rng, 0:300) / 10), '.' => ',')) for i in 1:m]; (string("city;rain\n", join(rows, '\n'), '\n'),)) for _ in 1:15]'''
# Means of at most a few thousand values with one decimal: summation order
# (pairwise in `mean`, left to right in a loop) changes the result by a few ulps.
compare = "isapprox"
rtol = 1e-12
hints = [
  "Type inference cannot know that `NA` means missing or that the comma is a decimal separator: tell `CSV.read` how this file is written.",
  "The `CSV.File` docstring lists the keywords for missing markers, decimals and the delimiter. For type stability, look at two places: the code that works on the column (is it compiled for the column's real type?) and the entry's return value (can the compiler know its type, which the prompt fixes?).",
]

  [problem.perf]
  args = '''string("city;rain\n", join([string("c", i % 7, ';', i % 10 == 0 ? "NA" : replace(string(rand(rng, 0:300) / 10), '.' => ',')) for i in 1:n], '\n'), '\n')'''
  sizes = [5000]

  [[problem.variant]]
  label = "forgets decimal = ',': the rain column stays text"
  code = '''
using CSV, DataFrames, Statistics
function rain_summary(s)
    df = CSV.read(IOBuffer(s), DataFrame; delim = ';', missingstring = "NA")
    r = df.rain
    return (count(ismissing, r), mean(skipmissing(r)))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "forgets missingstring: NA is read as text"
  code = '''
using CSV, DataFrames, Statistics
function rain_summary(s)
    df = CSV.read(IOBuffer(s), DataFrame; delim = ';', decimal = ',')
    r = df.rain
    return (count(ismissing, r), mean(skipmissing(r)))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "counts NA days as 0 mm in the mean"
  code = '''
using CSV, DataFrames, Statistics
function rain_summary(s)
    df = CSV.read(IOBuffer(s), DataFrame; delim = ';', decimal = ',', missingstring = "NA")
    r = df.rain
    return (count(ismissing, r), mean(coalesce.(r, 0.0)))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "no function barrier: works on df.rain inside the entry function"
  code = '''
using CSV, DataFrames, Statistics
function rain_summary(s)
    df = CSV.read(IOBuffer(s), DataFrame; delim = ';', decimal = ',', missingstring = "NA")
    r = df.rain
    n = count(ismissing, r)
    return (n, mean(skipmissing(r)))
end
'''
  expect = ["correct", "unstable"]

  [[problem.variant]]
  label = "function barrier, but no return type: the entry still infers Any"
  code = '''
using CSV, DataFrames, Statistics
summarize_rain(r) = (count(ismissing, r), mean(skipmissing(r)))
function rain_summary(s)
    df = CSV.read(IOBuffer(s), DataFrame; delim = ';', decimal = ',', missingstring = "NA")
    return summarize_rain(df.rain)
end
'''
  expect = ["correct", "unstable"]

  [[problem.variant]]
  label = "return type declared on the helper instead of asserted in the entry"
  code = '''
using CSV, DataFrames, Statistics
function rain_summary(s)
    df = CSV.read(IOBuffer(s), DataFrame; delim = ';', decimal = ',', missingstring = "NA")
    return rain_stats(df.rain)
end
function rain_stats(r)::Tuple{Int, Float64}
    return (count(ismissing, r), mean(skipmissing(r)))
end
'''
  expect = ["correct"]

  [[problem.variant]]
  label = "parses the lines by hand, no CSV.jl"
  code = '''
function rain_summary(s)
    nmiss = 0
    total = 0.0
    known = 0
    for line in Iterators.drop(eachsplit(chomp(s), '\n'), 1)
        field = split(line, ';')[2]
        if field == "NA"
            nmiss += 1
        else
            total += parse(Float64, replace(field, ',' => '.'))
            known += 1
        end
    end
    return (nmiss, total / known)
end
'''
  expect = ["correct"]

