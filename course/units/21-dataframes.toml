]
gen = "rng -> [(m = rand(rng, 1:60); ((category = rand(rng, [\"ale\", \"bun\", \"cod\", \"dip\", \"egg\"], m), price = rand(rng, 1:5000, m)),)) for _ in 1:15]"
hints = [
  "This is split-apply-combine: split the rows by category, reduce each group's prices to one number, and collect one row per group.",
  "Which of the three verbs returns one row per group? After it, check whether the rows come back in the order the prompt asks for.",
]

  [problem.perf]
  args = "(category = rand(rng, [string(\"c\", i) for i in 1:20], n), price = rand(rng, 1:5000, n))"
  sizes = [20000]

  [[problem.variant]]
  label = "forgets to sort by category"
  code = '''
using DataFrames, Statistics
function mean_by_category(data)
    g = combine(groupby(DataFrame(data), :category), :price => mean => :mean_price)
    return collect(zip(g.category::Vector{String}, g.mean_price::Vector{Float64}))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "median instead of mean"
  code = '''
using DataFrames, Statistics
function mean_by_category(data)
    g = sort!(combine(groupby(DataFrame(data), :category), :price => median => :m), :category)
    return collect(zip(g.category::Vector{String}, g.m::Vector{Float64}))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "builds a second DataFrame row by row with push!, then filters it once per category"
  code = '''
using DataFrames, Statistics
function mean_by_category(data)
    df = DataFrame(category = String[], price = Int[])
    for i in eachindex(data.category)
        push!(df, (category = data.category[i], price = data.price[i]))
    end
    out = Tuple{String, Float64}[]
    for c in sort(unique(df.category))
        rows = df[df.category .== c, :]
        push!(out, (c, mean(rows.price)))
    end
    return out
end
'''
  expect = ["correct", "slow", "allocates"]

  [[problem.variant]]
  label = "loops over eachrow: every row.field is looked up dynamically"
