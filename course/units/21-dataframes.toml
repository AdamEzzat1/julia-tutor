using DataFrames, Statistics
function mean_by_category(data)
    df = DataFrame(data)
    sums = Dict{String, Int}()
    counts = Dict{String, Int}()
    for row in eachrow(df)
        c = row.category
        p = row.price
        sums[c] = get(sums, c, 0) + p
        counts[c] = get(counts, c, 0) + 1
    end
    return [(c, sums[c] / counts[c]) for c in sort(collect(keys(sums)))]
end
'''
  expect = ["correct", "slow", "allocates"]

