Write `dj_zero_probability(f)` that simulates the Deutsch-Jozsa circuit for
the truth table `f` (a `Vector{Bool}` of length `2^n`): start from
`|0…0⟩` on `n` qubits, apply `H` to every qubit, apply the phase oracle of
`f`, apply `H` to every qubit again, and return the probability of the
outcome `0…0` as a `Float64`.

```julia
dj_zero_probability(fill(true, 8))                        # 1.0 (up to rounding): constant
dj_zero_probability(Bool[0, 1, 1, 0, 1, 0, 0, 1])          # 0.0: balanced
dj_zero_probability([x == 5 for x in 0:7])                # 0.5625: neither
```

`f` need not be constant or balanced. Results are compared with an absolute
tolerance of `1e-12`: the exact answer is the square of an average of
`±1` values, and the circuit computes it with an error of a few `eps`.
'''
starter = '''
function apply_1q!(ψ, U, q)
    s = 1 << q
    for k in 0:length(ψ)-1
        if k & s == 0
            a, b = ψ[k + 1], ψ[k + s + 1]
            ψ[k + 1], ψ[k + s + 1] = U[1, 1] * a + U[1, 2] * b, U[2, 1] * a + U[2, 2] * b
        end
    end
    return ψ
end

function dj_zero_probability(f)
    # your code here
end
'''
reference = '''
function apply_1q!(ψ, U, q)
    s = 1 << q
    for k in 0:length(ψ)-1
        if k & s == 0
            a, b = ψ[k + 1], ψ[k + s + 1]
            ψ[k + 1], ψ[k + s + 1] = U[1, 1] * a + U[1, 2] * b, U[2, 1] * a + U[2, 2] * b
        end
    end
    return ψ
end

function dj_zero_probability(f)
    n = trailing_zeros(length(f))
    H = ComplexF64[1 1; 1 -1] / sqrt(2)
    ψ = zeros(ComplexF64, length(f)); ψ[1] = 1
    for q in 0:n-1; apply_1q!(ψ, H, q); end
    for k in eachindex(ψ, f)
        ψ[k] = ifelse(f[k], -ψ[k], ψ[k])
    end
    for q in 0:n-1; apply_1q!(ψ, H, q); end
    return abs2(ψ[1])
end
