id = "08-types"
title = "Types: the hierarchy, structs and parametric types"
track = "core"
env = "base"
summary = "Abstract and concrete types, struct and mutable struct, constructors that validate, parametric types with concrete fields, Union, nothing and missing."
kcs = ["type-hierarchy", "concrete-types", "structs", "constructors", "parametric-types", "union-types", "nothing-missing", "kwdef"]
prerequisites = ["07-broadcasting"]
lessons = ["L02-concrete-types"]

[[section]]
title = "Every value has a type, in one tree"
body = '''
`typeof(x)` is the type of a value; `x isa T` asks whether it belongs to `T`
(or to a subtype of `T`). Types form a single tree with `Any` at the top:
`supertype` walks up, `subtypes` lists the children (it lives in the
`InteractiveUtils` standard library, which the REPL loads for you; here we
load it explicitly).

**Abstract** types such as `Real` and `Integer` only group other types; no
value has an abstract type as its `typeof`. **Concrete** types such as
`Int64` and `Float64` are the leaves that values actually have. The lists
below are those of Julia 1.10 with only Base loaded; packages can add more
subtypes.
'''

  [[section.example]]
  code = '''
using InteractiveUtils
println(typeof(1), " ", 1 isa Integer, " ", 1 isa AbstractFloat, " ", 1.0 isa Real)
println(supertype(Int64), " → ", supertype(Signed), " → ", supertype(Integer), " → ", supertype(Real))
println(subtypes(Real))
println(subtypes(Integer))
println(isconcretetype(Int64), " ", isabstracttype(Integer), " ", isconcretetype(Real))
'''

[[section]]
title = "struct and mutable struct"
body = '''
`struct` defines a new concrete type with named fields. Its values are
**immutable**: once created, a field cannot be reassigned. That lets the
compiler store them inline in arrays and registers, much like a tuple with
names. When you need to change a field, use `mutable struct`; those values
live on the heap and are shared by reference, like arrays.

Julia defines a default constructor that takes the fields in order and
converts each argument to the field's declared type (so `Point(1, 2)` stores
`1.0` and `2.0`). In the REPL you cannot redefine a struct with different
fields; restart Julia (or use a new name) when you change one.
'''

  [[section.example]]
  code = '''
struct Point
    x::Float64
    y::Float64
end
p = Point(1, 2)
println(p, " ", p.x + p.y, " ", fieldnames(Point))
p.x = 5
'''

  [[section.example]]
  code = '''
mutable struct Counter
    count::Int
end
c = Counter(0)
d = c                 # the same object, as with arrays
c.count += 1
d.count
'''

[[section]]
title = "Constructors that validate, and keyword structs"
body = '''
An **inner constructor** is a function inside the `struct` block that calls
`new(...)`. Once you write one, the default constructor is gone, so every
value of the type has passed your checks: here, an `Interval` with `lo > hi`
cannot exist. Throw an `ArgumentError` for a bad argument.

An **outer constructor** is an ordinary method defined outside the block,
usually a convenience that calls another constructor.

`Base.@kwdef` lets a struct have default values and keyword construction,
which suits configuration records.
'''

  [[section.example]]
  code = '''
struct Interval
    lo::Float64
    hi::Float64
    function Interval(lo, hi)
        lo <= hi || throw(ArgumentError("need lo <= hi, got $lo > $hi"))
        return new(lo, hi)
    end
end
Interval(x) = Interval(x, x)       # outer constructor: a single point
println(Interval(1, 3), " ", Interval(2))
Interval(3, 1)
'''

  [[section.example]]
  code = '''
Base.@kwdef struct Options
    maxiter::Int = 100
    tol::Float64 = 1e-8
    verbose::Bool = false
end
println(Options())
Options(tol = 1e-3, verbose = true)
'''

[[section]]
title = "Parametric types and concrete fields"
body = '''
A field declared with an abstract type, such as `x::Real`, can hold any
`Real`, so the compiler cannot know what reading it returns: every use is a
run-time type check and the value is stored boxed. A field with no type at all
is `Any`, the worst case.

A **parametric** type keeps the flexibility without the cost: `Point2{T}` has
fields of type `T`, and `Point2(1, 2)` is a `Point2{Int64}`, a concrete type.
`Base.return_types` shows what the compiler infers for a function on given
argument types: `Real`-field reads infer `Any`, parametric ones `Float64`.
Both fields share one `T`, so mixing `1` and `2.5` has no matching
constructor unless you add one (the dispatch unit shows how, with `promote`).
The performance unit returns to this; the `L02` lesson drills it.
'''

  [[section.example]]
  code = '''
struct Point2{T<:Real}
    x::T
    y::T
end
println(Point2(1, 2), " ", typeof(Point2(1.0, 2.5)), " ", isconcretetype(Point2{Int}))
Point2(1, 2.5)
'''

  [[section.example]]
  caption = "What the compiler can infer for `2 * p.x`, per field declaration."
  code = '''
struct Loose
    x::Real
end
struct Tight{T<:Real}
    x::T
end
double_x(p) = 2 * p.x
println(Base.return_types(double_x, (Loose,)))
println(Base.return_types(double_x, (Tight{Float64},)))
'''

  [[section.example]]
  caption = "An annotation restricts which arguments a method accepts; it does not make code faster. Both compile to the same code for an Int."
  code = '''
plus1(x) = x + 1
plus1_int(x::Int) = x + 1
println(code_typed(plus1, (Int,))[1].first.code == code_typed(plus1_int, (Int,))[1].first.code)
println(plus1(2.5))
plus1_int(2.5)
'''

[[section]]
title = "Union, nothing and missing"
body = '''
`Union{A, B}` is the type of values that are either an `A` or a `B`. Two
special values are common partners in a Union:

* `nothing` (type `Nothing`) means "no value": `findfirst` returns it when
  nothing is found. It is not a number; arithmetic on it is an error. Test
  with `x === nothing` or `isnothing(x)`.
* `missing` (type `Missing`) means "a value exists but is unknown", as in
  statistics and SQL's `NULL`. It **propagates**: `missing + 1` is `missing`,
  and so is `missing == 1`. Use `ismissing(x)` to test, `skipmissing(v)` to
  iterate over the known values, and `coalesce(x, default)` to replace it.

`isequal` treats `missing` as equal to itself, which is why dictionaries and
the grader use it.
'''

  [[section.example]]
  code = '''
i = findfirst(==(5), [1, 2, 3])
println(i === nothing, " ", typeof(i))
v = [1, missing, 3]
println(typeof(v), " ", sum(v), " ", sum(skipmissing(v)), " ", coalesce.(v, 0))
println(missing + 1, " ", missing == 1, " ", missing == missing, " ", isequal(missing, missing))
nothing + 1
'''

[[problem]]
id = "mean-skipping-missing"
title = "Mean of the known values"
difficulty = "warm-up"
kcs = ["nothing-missing", "union-types"]
entry = "mean_present"
prompt = '''
`v` is a vector of integers some of which are `missing`. Write
`mean_present(v)` returning the mean of the non-missing values as a
`Float64`, or `NaN` when there are none.

```julia
mean_present([1, missing, 3])        # 2.0
mean_present([missing, missing])     # NaN
```

Do not build a new array of the present values.
'''
starter = '''
function mean_present(v)
    # your code here
end
'''
reference = '''
function mean_present(v)
    s = 0
    n = 0
    for x in v
        ismissing(x) && continue
        s += x
        n += 1
    end
    return s / n
end
'''
cases = ["[1, missing, 3]", "Union{Missing,Int}[missing, missing]", "Union{Missing,Int}[]", "Union{Missing,Int}[4, 6]"]
gen = "rng -> [([rand(rng) < 0.3 ? missing : rand(rng, -50:50) for _ in 1:rand(rng, 0:15)],) for _ in 1:20]"
hints = [
  "Count and add only the values that are not `missing`; 0 / 0 is already `NaN`.",
  "`ismissing(x)` tests one value; `skipmissing(v)` iterates over the known ones without copying.",
]

  [problem.perf]
  args = "[rand(rng) < 0.2 ? missing : rand(rng, 1:100) for _ in 1:n]"
  sizes = [20000]

  [[problem.variant]]
  label = "sum over everything propagates missing"
  code = '''
mean_present(v) = sum(v) / length(v)
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "treats missing as 0"
  code = '''
mean_present(v) = sum(coalesce.(v, 0)) / length(v)
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "collects the present values first"
  code = '''
function mean_present(v)
    xs = collect(skipmissing(v))
    return sum(xs) / length(xs)
end
'''
  expect = ["correct", "allocates"]

  [[problem.variant]]
  label = "pushes into an untyped []"
  code = '''
function mean_present(v)
    xs = []
    for x in v
        ismissing(x) || push!(xs, x)
    end
    return sum(xs; init = 0) / length(xs)
end
'''
  expect = ["correct", "unstable", "allocates"]

  [[problem.variant]]
  label = "skipmissing and count, no copy"
  code = '''
mean_present(v) = sum(skipmissing(v); init = 0) / count(!ismissing, v)
'''
  expect = ["correct"]

[[problem]]
id = "interval-overlap"
title = "Validated intervals"
difficulty = "core"
kcs = ["structs", "constructors"]
entry = "overlap_length"
prompt = '''
Define a struct `Interval` with `Float64` fields `lo` and `hi` whose
constructor refuses `lo > hi` by throwing an `ArgumentError`. Then write
`overlap_length(a_lo, a_hi, b_lo, b_hi)` that builds the two intervals and
returns the length of their overlap as a `Float64` (0.0 when they do not
overlap). Bad bounds must throw the `ArgumentError` from your constructor.

```julia
overlap_length(0, 5, 3, 10)    # 2.0
overlap_length(0, 1, 2, 3)     # 0.0
overlap_length(5, 0, 1, 2)     # throws ArgumentError
```
'''
starter = '''
struct Interval
    lo::Float64
    hi::Float64
    # an inner constructor that checks lo <= hi
end

function overlap_length(a_lo, a_hi, b_lo, b_hi)
    # your code here
end
'''
reference = '''
struct Interval
    lo::Float64
    hi::Float64
    function Interval(lo, hi)
        lo <= hi || throw(ArgumentError("need lo <= hi, got $lo > $hi"))
        return new(lo, hi)
    end
end

function overlap_length(a_lo, a_hi, b_lo, b_hi)
    a = Interval(a_lo, a_hi)
    b = Interval(b_lo, b_hi)
    return max(0.0, min(a.hi, b.hi) - max(a.lo, b.lo))
end
'''
cases = ["0, 5, 3, 10", "0, 1, 2, 3", "5, 0, 1, 2", "1, 2, 3, 1", "0.5, 0.5, 0, 1"]
gen = "rng -> [Tuple(rand(rng, -5:5, 4)) for _ in 1:30]"
hints = [
  "An inner constructor is a `function Interval(lo, hi) ... end` inside the struct that ends with `new(lo, hi)`.",
  "`lo <= hi || throw(ArgumentError(\"...\"))` checks first; the overlap is `min` of the ends minus `max` of the starts, but never below 0.",
]

  [problem.perf]
  args = "0.0, 2.0, rand(rng), 1.0 + rand(rng)"
  sizes = [1]

  [[problem.variant]]
  label = "no validation"
  code = '''
struct Interval
    lo::Float64
    hi::Float64
end
function overlap_length(a_lo, a_hi, b_lo, b_hi)
    a = Interval(a_lo, a_hi)
    b = Interval(b_lo, b_hi)
    return max(0.0, min(a.hi, b.hi) - max(a.lo, b.lo))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "error() throws an ErrorException, not an ArgumentError"
  code = '''
struct Interval
    lo::Float64
    hi::Float64
    Interval(lo, hi) = lo <= hi ? new(lo, hi) : error("bad interval")
end
function overlap_length(a_lo, a_hi, b_lo, b_hi)
    a = Interval(a_lo, a_hi)
    b = Interval(b_lo, b_hi)
    return max(0.0, min(a.hi, b.hi) - max(a.lo, b.lo))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "negative overlap not clamped"
  code = '''
struct Interval
    lo::Float64
    hi::Float64
    Interval(lo, hi) = lo <= hi ? new(lo, hi) : throw(ArgumentError("bad interval"))
end
function overlap_length(a_lo, a_hi, b_lo, b_hi)
    a = Interval(a_lo, a_hi)
    b = Interval(b_lo, b_hi)
    return min(a.hi, b.hi) - max(a.lo, b.lo)
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "parametric fields and an outer validating function"
  code = '''
struct Interval{T<:Real}
    lo::T
    hi::T
end
function checked(lo, hi)
    lo <= hi || throw(ArgumentError("bad interval"))
    return Interval(float(lo), float(hi))
end
function overlap_length(a_lo, a_hi, b_lo, b_hi)
    a = checked(a_lo, a_hi)
    b = checked(b_lo, b_hi)
    return max(zero(a.lo), min(a.hi, b.hi) - max(a.lo, b.lo))
end
'''
  expect = ["correct"]

[[problem]]
id = "kinetic-energy-fields"
title = "Struct fields and speed"
difficulty = "stretch"
kcs = ["structs", "concrete-types", "parametric-types"]
entry = "total_kinetic"
prompt = '''
Define a struct `Body` holding a mass `m` and a speed `v`, and write
`total_kinetic(masses, speeds)` that builds a `Vector` of `Body` values (one
per pair) and returns the sum of ½·m·v² over them as a `Float64`.

```julia
total_kinetic([2.0, 1.0], [3.0, 4.0])   # 0.5*2*9 + 0.5*1*16 = 17.0
```

The grader times your function on 20 000 bodies and checks type stability:
how you declare the fields of `Body` matters.
'''
starter = '''
struct Body
    # fields for the mass and the speed
end

function total_kinetic(masses, speeds)
    # build a Vector of Body, then add up 0.5 * m * v^2
end
'''
reference = '''
struct Body{T<:Real}
    m::T
    v::T
end

kinetic(b::Body) = 0.5 * b.m * b.v^2

function total_kinetic(masses, speeds)
    bodies = [Body(m, v) for (m, v) in zip(masses, speeds)]
    s = 0.0
    for b in bodies
        s += kinetic(b)
    end
    return s
end
'''
cases = ["[2.0, 1.0], [3.0, 4.0]", "Float64[], Float64[]", "[1.5], [2.0]"]
gen = "rng -> [(n = rand(rng, 0:10); (rand(rng, n) .* 10, randn(rng, n))) for _ in 1:20]"
compare = "isapprox"
rtol = 1e-12
hints = [
  "Give the fields types the compiler can know when it compiles `total_kinetic`.",
  "`m::Real` (or no type) makes every read a run-time lookup; `struct Body{T<:Real}` with `m::T` keeps the fields concrete.",
]

  [problem.perf]
  args = "rand(rng, n) .* 10, randn(rng, n)"
  sizes = [20000]

  [[problem.variant]]
  label = "forgets the factor 1/2"
  code = '''
struct Body{T<:Real}
    m::T
    v::T
end
function total_kinetic(masses, speeds)
    bodies = [Body(m, v) for (m, v) in zip(masses, speeds)]
    s = 0.0
    for b in bodies
        s += b.m * b.v^2
    end
    return s
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "abstract field types (m::Real)"
  code = '''
struct Body
    m::Real
    v::Real
end
function total_kinetic(masses, speeds)
    bodies = [Body(m, v) for (m, v) in zip(masses, speeds)]
    s = 0.0
    for b in bodies
        s += 0.5 * b.m * b.v^2
    end
    return s
end
'''
  expect = ["correct", "unstable", "allocates", "slow"]

  [[problem.variant]]
  label = "untyped fields"
  code = '''
struct Body
    m
    v
end
function total_kinetic(masses, speeds)
    bodies = [Body(m, v) for (m, v) in zip(masses, speeds)]
    s = 0.0
    for b in bodies
        s += 0.5 * b.m * b.v^2
    end
    return s
end
'''
  expect = ["correct", "unstable", "allocates"]

  [[problem.variant]]
  label = "concrete Float64 fields and sum with a function"
  code = '''
struct Body
    m::Float64
    v::Float64
end
total_kinetic(masses, speeds) = sum(b -> 0.5 * b.m * b.v^2, [Body(m, v) for (m, v) in zip(masses, speeds)]; init = 0.0)
'''
  expect = ["correct", "fast"]
