[[problem]]
id = "va-shift-gradient"
title = "The parameter-shift gradient"
difficulty = "core"
kcs = ["parameter-shift"]
entry = "shift_gradient"
packages = []
prompt = '''
Write `shift_gradient(f, θ)` that returns the gradient of `f` at the angle
vector `θ` (a `Vector{Float64}`) by the parameter-shift rule, as a
`Vector{Float64}` of the same length:

```
∂f/∂θ_k = (f(θ + (π/2) e_k) - f(θ - (π/2) e_k)) / 2
```

where `e_k` is the `k`-th unit vector. `f` is promised to be of the form
`a + b cos θ_k + c sin θ_k` in each angle separately (as every energy of a
circuit of `RY` gates is), so the rule is exact. Do not modify `θ`.

```julia
shift_gradient(θ -> cos(θ[1]), [0.3])                        # [-sin(0.3)]
shift_gradient(θ -> sin(θ[1]) * cos(θ[2]), [0.3, 1.1])
```

Results are compared entry by entry with an absolute tolerance of `1e-12`:
the rule's only error is the rounding of two function values (a few `eps`
for the tested functions, whose values stay below 10). A finite difference
does not meet it: its rounding error is about `eps / ε`.
'''
starter = '''
function shift_gradient(f, θ)
    # your code here
end
'''
reference = '''
function shift_gradient(f, θ)
    g = similar(θ)
    for k in eachindex(θ)
        θp = copy(θ); θp[k] += π / 2
        θm = copy(θ); θm[k] -= π / 2
        g[k] = (f(θp) - f(θm)) / 2
    end
    return g
end
'''
cases = [
  "θ -> cos(θ[1]), [0.3]",
  "θ -> sin(θ[1]) * cos(θ[2]), [0.3, 1.1]",
  "θ -> 0.5 + 2cos(θ[1]) - sin(θ[2]) + cos(θ[1]) * sin(θ[3]), [1.0, 2.0, 3.0]",
]
gen = "rng -> [(m = rand(rng, 1:4); c = randn(rng, 3, m); (θ -> prod(c[1, i] + c[2, i] * cos(θ[i]) + c[3, i] * sin(θ[i]) for i in 1:m), 2pi .* rand(rng, m))) for _ in 1:25]"
compare = "custom"
checker = '''
(got, expected) -> got isa Vector{Float64} && length(got) == length(expected) && maximum(abs.(got .- expected)) <= 1e-12
'''
check_type = true
hints = [
  "One partial derivative at a time: shift only angle `k`, up and down, and leave the others alone. Work on copies so that `θ` itself is not changed.",
  "For each `k`: `θp = copy(θ); θp[k] += π/2`, `θm = copy(θ); θm[k] -= π/2`, then `(f(θp) - f(θm)) / 2`.",
]

  [problem.perf]
  args = "θ -> sum(cos, θ), 2pi .* rand(rng, n)"
  sizes = [64]

  [[problem.variant]]
  label = "shift of π/4"
  code = '''
function shift_gradient(f, θ)
    g = similar(θ)
    for k in eachindex(θ)
        θp = copy(θ); θp[k] += π / 4
        θm = copy(θ); θm[k] -= π / 4
        g[k] = (f(θp) - f(θm)) / 2
    end
    return g
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "forgets the division by 2"
  code = '''
function shift_gradient(f, θ)
    g = similar(θ)
    for k in eachindex(θ)
        θp = copy(θ); θp[k] += π / 2
        θm = copy(θ); θm[k] -= π / 2
        g[k] = f(θp) - f(θm)
    end
    return g
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "central finite difference with ε = 1e-6"
  code = '''
function shift_gradient(f, θ)
    g = similar(θ); ε = 1e-6
    for k in eachindex(θ)
        θp = copy(θ); θp[k] += ε
        θm = copy(θ); θm[k] -= ε
        g[k] = (f(θp) - f(θm)) / 2ε
    end
    return g
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "shifts in place and restores θ afterwards"
  code = '''
function shift_gradient(f, θ)
    g = similar(θ)
    for k in eachindex(θ)
        t = θ[k]
        θ[k] = t + π / 2; up = f(θ)
        θ[k] = t - π / 2; down = f(θ)
        θ[k] = t
        g[k] = (up - down) / 2
    end
    return g
end
'''
  expect = ["correct"]

[[problem]]
id = "va-ising-energy"
title = "The energy of the variational circuit"
difficulty = "core"
kcs = ["vqe"]
entry = "ising_energy"
packages = []
prompt = '''
Write `ising_energy(θ)` that prepares the two-qubit state of this unit's
circuit from `|00⟩`, with `θ` a vector of 4 angles,

```
RY(θ[1]) on qubit 0,  RY(θ[2]) on qubit 1,  CNOT 0 → 1,  RY(θ[3]) on qubit 0,  RY(θ[4]) on qubit 1
```

and returns its energy `ψ' H ψ` for `H = Z⊗Z + (X⊗I + I⊗X)/2` as a
`Float64`. The starter defines `apply_1q!`, `apply_cx!` and `RY`.

```julia
ising_energy(zeros(4))           # 1.0: |00⟩ has ZZ = 1 and no X component
ising_energy([π, 0, 0, 0])       # 1.0: RY(π) flips qubit 0, the CNOT then flips qubit 1, giving |11⟩
```

The second example checks the qubit order: with the CNOT reversed, qubit 1
would stay 0, giving `|01⟩` with `ZZ = -1` and energy `-1.0`.

Results are compared with an absolute tolerance of `1e-12`.
'''
starter = '''
function apply_1q!(ψ, U, q)
    s = 1 << q
    for k in 0:length(ψ)-1
        if k & s == 0
            a, b = ψ[k + 1], ψ[k + s + 1]
            ψ[k + 1], ψ[k + s + 1] = U[1, 1] * a + U[1, 2] * b, U[2, 1] * a + U[2, 2] * b
        end
    end
    return ψ
end
function apply_cx!(ψ, c, t)
    for k in 0:length(ψ)-1
        if k & (1 << c) != 0 && k & (1 << t) == 0
            j = k | (1 << t)
            ψ[k + 1], ψ[j + 1] = ψ[j + 1], ψ[k + 1]
        end
    end
    return ψ
end
RY(θ) = ComplexF64[cos(θ/2) -sin(θ/2); sin(θ/2) cos(θ/2)]

function ising_energy(θ)
    # your code here
end
'''
reference = '''
function apply_1q!(ψ, U, q)
    s = 1 << q
    for k in 0:length(ψ)-1
        if k & s == 0
            a, b = ψ[k + 1], ψ[k + s + 1]
            ψ[k + 1], ψ[k + s + 1] = U[1, 1] * a + U[1, 2] * b, U[2, 1] * a + U[2, 2] * b
        end
    end
    return ψ
end
function apply_cx!(ψ, c, t)
    for k in 0:length(ψ)-1
        if k & (1 << c) != 0 && k & (1 << t) == 0
            j = k | (1 << t)
            ψ[k + 1], ψ[j + 1] = ψ[j + 1], ψ[k + 1]
        end
    end
    return ψ
end
RY(θ) = ComplexF64[cos(θ/2) -sin(θ/2); sin(θ/2) cos(θ/2)]

function ising_energy(θ)
    ψ = ComplexF64[1, 0, 0, 0]
    apply_1q!(ψ, RY(θ[1]), 0); apply_1q!(ψ, RY(θ[2]), 1); apply_cx!(ψ, 0, 1)
    apply_1q!(ψ, RY(θ[3]), 0); apply_1q!(ψ, RY(θ[4]), 1)
