  [[problem.variant]]
  label = "ratio of the gradient norms"
  code = '''
using ForwardDiff, LinearAlgebra
function annealed_weight(Lr, Lb, θ, λ, α)
    λhat = norm(ForwardDiff.gradient(Lr, θ)) / norm(ForwardDiff.gradient(Lb, θ))
    return (1 - α) * λ + α * λhat
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "α on the old weight"
