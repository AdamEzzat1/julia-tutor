[[problem]]
id = "makie-stacked-panels-bug"
title = "Fix the stacked panels"
difficulty = "core"
kcs = ["makie", "figure-layout"]
entry = "stacked_panels"
packages = ["CairoMakie"]
prompt = '''
A colleague wrote `stacked_panels(t, ys, names)` to draw several signals
measured at the same times `t`, one panel per signal. It should return a
Makie `Figure` where

* there is one `Axis` per signal, stacked in column 1: signal `k` goes in
  `fig[k, 1]`;
* axis `k` has the y label `names[k]` and contains exactly one line plot,
  `ys[k]` against `t`, and nothing else;
* the x axes of all panels are linked (`linkxaxes!`), so zooming one zooms all.

```julia
t = range(0, 1, length = 50)
fig = stacked_panels(t, [sin.(2π .* t), cos.(2π .* t)], ["sin", "cos"])
```

The code runs without an error and the figure has the right number of
panels with the right labels, but the drawing is wrong. Find the bug and fix
it; keep the function's signature. The grader inspects the returned Figure
(each axis's cell, y label, and the data of the plots it contains), not the
pixels.
'''
starter = '''
using CairoMakie

function stacked_panels(t, ys, names)
    fig = Figure(size = (600, 150 * length(ys)))
    axs = [Axis(fig[k, 1]; ylabel = names[k]) for k in eachindex(ys)]
    for (k, y) in enumerate(ys)
        lines!(t, y)
    end
    linkxaxes!(axs...)
    return fig
end
'''
reference = '''
using CairoMakie

function stacked_panels(t, ys, names)
    fig = Figure(size = (600, 150 * length(ys)))
    axs = [Axis(fig[k, 1]; ylabel = names[k]) for k in eachindex(ys)]
    for (k, y) in enumerate(ys)
        lines!(axs[k], t, y)
    end
    linkxaxes!(axs...)
    return fig
end
'''
cases = [
  "range(0, 1, length = 50), [sin.(2π .* range(0, 1, length = 50)), cos.(2π .* range(0, 1, length = 50))], [\"sin\", \"cos\"]",
  "1:4, [[1.0, 2.0, 3.0, 4.0], [4.0, 3.0, 2.0, 1.0], [0.0, 1.0, 0.0, 1.0]], [\"up\", \"down\", \"zigzag\"]",
  "[0.0, 0.5, 2.0], [[1.0, -1.0, 1.0]], [\"only\"]",
]
gen = "rng -> [(m = rand(rng, 2:8); n = rand(rng, 1:4); (sort(rand(rng, m)), [round.(randn(rng, m); digits = 2) for _ in 1:n], [string(\"s\", k) for k in 1:n])) for _ in 1:6]"
compare = "custom"
checker = '''
(got, expected) -> begin
    got isa Figure || return false
    cell(a) = (s = a.layoutobservables.gridcontent[].span; (first(s.rows), last(s.rows), first(s.cols), last(s.cols)))
    axes_of(f) = sort!([a for a in f.content if a isa Axis]; by = cell)
    panel(a) = (cell(a), a.ylabel[], length(a.scene.plots), [p[1][] for p in a.scene.plots if p isa Lines])
    ga = axes_of(got); ea = axes_of(expected)
    length(ga) == length(ea) || return false
    all(isequal(panel(g), panel(e)) for (g, e) in zip(ga, ea)) || return false
    # every axis linked to all the others along x
    all(a -> length(unique(a.xaxislinks)) == length(ga) - 1, ga)
end
