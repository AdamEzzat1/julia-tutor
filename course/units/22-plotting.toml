[[problem]]
id = "makie-heatmap-colorbar"
title = "A heatmap of f(x, y) with its colorbar"
difficulty = "stretch"
kcs = ["makie", "figure-layout"]
entry = "heatmap_figure"
packages = ["CairoMakie"]
prompt = '''
Write `heatmap_figure(f, xs, ys)` returning a Makie `Figure` with

* an `Axis` in `fig[1, 1]` with x label `"x"` and y label `"y"`, containing
  one heatmap of `f` sampled on the grid: the value at `(xs[i], ys[j])` is
  `f(xs[i], ys[j])`;
* a `Colorbar` in `fig[1, 2]` for that heatmap, with label `"f(x, y)"`.

```julia
fig = heatmap_figure((x, y) -> x + 10y, 1:3, 1:2)
```

The grader reads the heatmap's data back from the figure and compares it
with the expected grid, so the orientation of the matrix matters: check it
on a grid that is not square.
'''
starter = '''
using CairoMakie

function heatmap_figure(f, xs, ys)
    fig = Figure()
    # your code here
    return fig
end
'''
reference = '''
using CairoMakie

function heatmap_figure(f, xs, ys)
    fig = Figure(size = (600, 350))
    ax = Axis(fig[1, 1]; xlabel = "x", ylabel = "y")
    z = [f(x, y) for x in xs, y in ys]
    hm = heatmap!(ax, xs, ys, z)
    Colorbar(fig[1, 2], hm; label = "f(x, y)")
    return fig
end
'''
cases = [
  "(x, y) -> x + 10y, 1:3, 1:2",
  "(x, y) -> sin(x) * cos(y), range(0, 3, length = 7), range(0, 1, length = 4)",
  "(x, y) -> x * y, 1:2, 1:5",
]
gen = "rng -> [(a = rand(rng, 1:5); ((x, y) -> a * x - y^2, range(-1, 1, length = rand(rng, 2:6)), range(0, 2, length = rand(rng, 2:6)))) for _ in 1:6]"
compare = "custom"
checker = '''
(got, expected) -> begin
    got isa Figure || return false
    cell(b) = (s = b.layoutobservables.gridcontent[].span; (s.rows, s.cols))
    function parts(fig)
        axs = [c for c in fig.content if c isa Axis]
        cbs = [c for c in fig.content if c isa Colorbar]
        hms = [p for a in axs for p in a.scene.plots if p isa Heatmap]
        return axs, cbs, hms
    end
    ga, gc, gh = parts(got)
    ea, ec, eh = parts(expected)
    length(ga) == 1 && length(gc) == 1 && length(gh) == 1 || return false
    cell(ga[1]) == cell(ea[1]) && cell(gc[1]) == cell(ec[1]) || return false
    ga[1].xlabel[] == "x" && ga[1].ylabel[] == "y" && gc[1].label[] == ec[1].label[] || return false
    # A Colorbar built from a plot takes its limits from it (the data's extrema);
    # an unlinked one has limits === nothing and shows (0, 1).
    lg = gc[1].limits[]; le = ec[1].limits[]
    lg === nothing && return false
    isapprox(collect(Float64, lg), collect(Float64, le); rtol = 1e-6) || return false
    zg = gh[1][3][]; ze = eh[1][3][]
    # Makie stores heatmap values as Float32: compare at single precision
    size(zg) == size(ze) && isapprox(zg, ze; rtol = 1e-6)
end
'''
hints = [
  "Makie draws `z[i, j]` at `(xs[i], ys[j])`: the matrix's first index runs along x. Check `size(z)` against `(length(xs), length(ys))` on a grid that is not square.",
  "A colorbar on its own shows default limits. Look at what the heatmap call returns, and at which `Colorbar` argument tells it whose colors to explain.",
]
# No perf section: building a figure is dominated by Makie's own block and
# plot construction; timing would measure Makie internals, not the learner's
# grid computation.

  [[problem.variant]]
  label = "image convention: rows of z are y values (transposed)"
  code = '''
