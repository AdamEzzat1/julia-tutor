function heatmap_figure(f, xs, ys)
    fig = Figure()
    ax = Axis(fig[1, 1]; xlabel = "x", ylabel = "y")
    z = [f(x, y) for y in ys, x in xs]
    hm = heatmap!(ax, z)
    Colorbar(fig[1, 2], hm; label = "f(x, y)")
    return fig
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
