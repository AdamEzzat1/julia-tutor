[[problem]]
id = "ml-best-depth"
title = "Choose a tree depth by cross-validation"
difficulty = "stretch"
kcs = ["mlj", "cross-validation", "scientific-types", "reproducibility", "overfitting"]
entry = "best_depth"
packages = ["MLJ"]
prompt = '''
`X` is a `Matrix{Float64}` (rows are observations, columns are features) and
`y` a `Vector{String}` of class labels. Write `best_depth(X, y, seed)` that
picks the depth of a decision tree by cross-validation:

* for each depth `d` in `1:6`, the model is
  `DecisionTreeClassifier(max_depth = d, rng = seed)` from `pkg=DecisionTree`
  (the starter loads it as `Tree`);
* its score is the accuracy that `evaluate` reports (the `measurement`
  field) for 5-fold cross-validation with
  `CV(nfolds = 5, shuffle = true, rng = Xoshiro(seed))`, and **every depth
  is scored on the same five folds**;
* return the tuple `(depth, accuracy)` of the best depth, an `Int` and a
  `Float64`. If several depths reach the best accuracy (to within `1e-9`),
  return the smallest of them.

MLJ wants a table and a categorical target (see the scientific types section).

```julia
best_depth(X, y, 1)   # e.g. (3, 0.85)
```

The grader compares with a relative tolerance of 1e-8: the folds and the
trees are fully seeded, so a correct solution reproduces the reference's
accuracies up to rounding in the last digits.
'''
starter = '''
using MLJ, Random
Tree = @load DecisionTreeClassifier pkg=DecisionTree verbosity=0

function best_depth(X, y, seed)
    # your code here
end
'''
reference = '''
using MLJ, Random
Tree = @load DecisionTreeClassifier pkg=DecisionTree verbosity=0

function best_depth(X, y, seed)
    Xt, yc = MLJ.table(X), coerce(y, Multiclass)
    accs = map(1:6) do depth
        # a fresh RNG per depth: a used one would give other folds
        folds = CV(nfolds = 5, shuffle = true, rng = Xoshiro(seed))
        e = evaluate(Tree(max_depth = depth, rng = seed), Xt, yc;
                     resampling = folds, measure = accuracy, verbosity = 0)
        Float64(e.measurement[1])
    end
    d = findfirst(>=(maximum(accs) - 1e-9), accs)
    return (d, accs[d])
end
'''
cases = [
  "[1.0 0.0; 2.0 0.1; 3.0 0.2; 4.0 0.3; 5.0 0.4; 6.0 0.5; 7.0 0.6; 8.0 0.7; 9.0 0.8; 10.0 0.9], [\"a\", \"a\", \"a\", \"a\", \"a\", \"b\", \"b\", \"b\", \"b\", \"b\"], 1",
  "randn(Xoshiro(5), 60, 2), [z[1] + 0.5 * z[2] > 0 ? \"pos\" : \"neg\" for z in eachrow(randn(Xoshiro(5), 60, 2))], 7",
]
gen = "rng -> [(m = rand(rng, 30:80); Z = randn(rng, m, 3); (Z, [z[1] - z[2] + 0.7 * randn(rng) > 0 ? \"yes\" : \"no\" for z in eachrow(Z)], rand(rng, 1:1000))) for _ in 1:6]"
compare = "isapprox"
# Accuracy is a size-weighted mean of ratios of integers; only the order of the
# arithmetic can round differently. The depth is an integer, compared exactly.
rtol = 1e-8
# No perf section: almost all the time is spent inside MLJ's evaluate (30 tree
# fits), the same for any correct solution, so a timing verdict would not measure
# the learner's code.
hints = [
  "Score all six depths on exactly the same folds. A seeded RNG object changes its state each time it is used: think about where you create it.",
  "Collect the six accuracies before choosing. When several are equal, check which of them your choice returns: it must be the smallest depth.",
]

  [[problem.variant]]
  label = "one CV object for all depths: its RNG moves on, so each depth gets other folds"
  code = '''
using MLJ, Random
Tree = @load DecisionTreeClassifier pkg=DecisionTree verbosity=0
function best_depth(X, y, seed)
    Xt, yc = MLJ.table(X), coerce(y, Multiclass)
    folds = CV(nfolds = 5, shuffle = true, rng = Xoshiro(seed))
    accs = [evaluate(Tree(max_depth = d, rng = seed), Xt, yc; resampling = folds,
                     measure = accuracy, verbosity = 0).measurement[1] for d in 1:6]
    acc, d = findmax(accs)
    return (d, Float64(acc))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "the largest depth among equal accuracies"
  code = '''
