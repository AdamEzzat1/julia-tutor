    Xt, yc = MLJ.table(X), coerce(y, Multiclass)
    best, bestacc = 0, -Inf
    for d in 1:6
        mach = machine(Tree(max_depth = d, rng = seed), Xt, yc)
        e = evaluate!(mach; resampling = CV(nfolds = 5, shuffle = true, rng = Xoshiro(seed)),
