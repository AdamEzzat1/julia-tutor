using JuMP, HiGHS
bigm(a, b, lo, hi) = max(0.0, sum(max(a[i] * lo[i], a[i] * hi[i]) for i in eachindex(a)) - b)
function either_or_max(c, a1, b1, a2, b2, lo, hi)
