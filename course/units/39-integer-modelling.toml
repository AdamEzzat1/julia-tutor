  [[problem.variant]]
  label = "the larger of two LPs"
  code = '''
using JuMP, HiGHS

function either_or_max(c, a1, b1, a2, b2, lo, hi)
    # exact: the feasible set is the union of two polytopes, so the optimum is the better of two LPs
    best = -Inf
    for (a, b) in ((a1, b1), (a2, b2))
        model = Model(HiGHS.Optimizer)
        set_silent(model)
        n = length(c)
        @variable(model, lo[i] <= x[i = 1:n] <= hi[i])
        @constraint(model, sum(a[i] * x[i] for i in 1:n) <= b)
        @objective(model, Max, sum(c[i] * x[i] for i in 1:n))
        optimize!(model)
        is_solved_and_feasible(model) && (best = max(best, objective_value(model)))
    end
    return best
end
'''
  expect = ["correct"]

