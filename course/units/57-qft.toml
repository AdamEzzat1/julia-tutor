[[problem]]
id = "qf-apply-qft"
title = "The QFT circuit in place"
difficulty = "core"
kcs = ["qft"]
entry = "apply_qft!"
packages = []
prompt = '''
Write `apply_qft!(ψ)` that applies the QFT circuit of section 3 to the
state `ψ` (length `2^n`) in place and returns `ψ`: for `j = n-1` down to 0,
`H` on qubit `j` followed by `CP(π / 2^(j-k))` between `k` and `j` for
`k = j-1` down to 0; then swap qubit `i` with `n-1-i` for `i < n/2`. The
starter defines `apply_1q!`, `apply_cp!` and `apply_swap!`.

```julia
apply_qft!(ComplexF64[0, 1, 0, 0])     # [1, im, -1, -im] / 2: column 1 of F
```

The result must equal `F ψ`. Results are compared with `isapprox` at
`rtol = 1e-12`: the circuit has fewer than 50 gates for the tested `n ≤ 8`,
each adding a rounding error of a few `eps` (unit 52), and the worst error
measured in section 3 was `1.2e-14`.
'''
starter = '''
function apply_1q!(ψ, U, q)
    s = 1 << q
    for k in 0:length(ψ)-1
        if k & s == 0
            a, b = ψ[k + 1], ψ[k + s + 1]
            ψ[k + 1], ψ[k + s + 1] = U[1, 1] * a + U[1, 2] * b, U[2, 1] * a + U[2, 2] * b
        end
    end
    return ψ
end
function apply_cp!(ψ, c, t, λ)
    m = (1 << c) | (1 << t); z = cis(λ)
    for k in 0:length(ψ)-1
        k & m == m && (ψ[k + 1] *= z)
    end
    return ψ
end
function apply_swap!(ψ, a, b)
    for k in 0:length(ψ)-1
        if (k >> a) & 1 == 1 && (k >> b) & 1 == 0
            j = k ⊻ (1 << a) ⊻ (1 << b)
            ψ[k + 1], ψ[j + 1] = ψ[j + 1], ψ[k + 1]
        end
    end
    return ψ
end

function apply_qft!(ψ)
    # your code here
end
'''
