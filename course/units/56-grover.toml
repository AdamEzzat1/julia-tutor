    θ = asin(length(marked) / 2^n)
    return sin((2k + 1) * θ)^2
end
'''
  expect = ["incorrect"]

[[problem]]
id = "gr-iterations"
title = "How many Grover iterations"
difficulty = "core"
kcs = ["amplitude-amplification"]
entry = "grover_iterations"
packages = []
prompt = '''
Write `grover_iterations(N, M)` that returns, as an `Int`, the smallest
`k ≥ 0` that maximises the success probability `sin²((2k + 1)θ)` with
`sin²θ = M/N`, for `1 ≤ M ≤ N/4`.

```julia
grover_iterations(4, 1)       # 1: P = 1
grover_iterations(64, 1)      # 6
grover_iterations(1024, 1)    # 25
```

Results are compared with `isequal`. (With `M ≤ N/4` the best `k` is
never a tie; at `M/N = 1/2` the counts 0 and 1 both give `1/2`.)
'''
starter = '''
function grover_iterations(N, M)
    # your code here
end
'''
reference = '''
function grover_iterations(N, M)
    θ = asin(sqrt(M / N))
    return floor(Int, π / (4θ))
end
'''
cases = [
  "4, 1",
  "64, 1",
  "1024, 1",
  "256, 3",
  "16, 4",
  "2^20, 5",
  "128, 19",
]
gen = "rng -> [(N = 2^rand(rng, 2:20); (N, rand(rng, 1:N ÷ 4))) for _ in 1:40]"
compare = "isequal"
check_type = true
hints = [
  "The probability is largest when the angle `(2k + 1)θ` is closest to `π/2`. Solve `(2k + 1)θ = π/2` for `k` and think about which integer is closest.",
  "`θ = asin(sqrt(M / N))`; the best count is `floor(Int, π / (4θ))`, since `(2k + 1)θ` is then within `θ` of `π/2`.",
]

  [problem.perf]
  args = "n, 3"
  sizes = [1048576]

  [[problem.variant]]
  label = "round instead of floor"
  code = '''
function grover_iterations(N, M)
    θ = asin(sqrt(M / N))
    return round(Int, π / (4θ))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "θ ≈ √(M/N), the small-angle approximation"
  code = '''
function grover_iterations(N, M)
    return floor(Int, π / 4 * sqrt(N / M))
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "searches k over the first rise of the probability"
  code = '''
function grover_iterations(N, M)
    θ = asin(sqrt(M / N))
    return argmax(k -> sin((2k + 1) * θ)^2, 0:ceil(Int, π / (4θ)))
end
'''
  expect = ["correct", "slow"]

