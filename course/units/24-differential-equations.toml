[[problem]]
id = "ode-fall-with-drag"
title = "When does it hit the ground?"
difficulty = "stretch"
kcs = ["ode-callbacks", "ode-solving"]
entry = "impact_time"
packages = ["DifferentialEquations"]
prompt = '''
An object is dropped from height `h0` (metres, at rest) and falls with
quadratic air drag:

    dh/dt = v
    dv/dt = -g + c*v^2        (v < 0 while falling)

Write `impact_time(h0, g, c)` that returns the time (a `Float64`) when `h`
reaches 0. Use a `ContinuousCallback` that stops the solve when the object
hits the ground. Solve with `Tsit5()` and `abstol = 1e-10, reltol = 1e-10`.
Results are compared with `rtol = 1e-7`.

The inputs range over `1 <= h0 <= 1e5`, `0.1 <= g <= 30` and `0 <= c <= 10`,
so a fall can last from a fraction of a second to many days: the end of your
time span has to come from the inputs (drag makes the fall slower, and the
grader includes the slowest falls).

```julia
impact_time(100.0, 9.81, 0.0)     # no drag: sqrt(2 * 100 / 9.81) ≈ 4.515
impact_time(100.0, 9.81, 0.01)    # with drag: later
impact_time(1.0e5, 0.1, 10.0)     # a very slow fall
```
'''
starter = '''
using DifferentialEquations

function impact_time(h0, g, c)
    # your code here
end
'''
reference = '''
using DifferentialEquations

function fall!(du, u, p, t)
    g, c = p
    du[1] = u[2]
    du[2] = -g + c * u[2]^2
    return nothing
end

ground(u, t, integrator) = u[1]

function impact_time(h0, g, c)
    # An end time the fall cannot reach: without drag it lasts sqrt(2h0/g); with drag the speed
    # passes half the terminal speed vt = sqrt(g/c) by t = vt/g, so the rest takes under 2h0/vt.
    tmax = c > 0 ? sqrt(g / c) / g + 2h0 / sqrt(g / c) : 2sqrt(2h0 / g)
    prob = ODEProblem(fall!, [h0, 0.0], (0.0, tmax), (g, c))
    sol = solve(prob, Tsit5(); callback = ContinuousCallback(ground, terminate!),
                abstol = 1e-10, reltol = 1e-10, save_everystep = false)
    return sol.t[end]
end
'''
cases = ["100.0, 9.81, 0.0", "100.0, 9.81, 0.01", "2.0, 1.62, 0.5", "1.0e5, 0.1, 10.0", "1.0e5, 0.1, 0.0"]
gen = "rng -> [(10.0^(5rand(rng)), 0.1 + 29.9rand(rng), rand(rng) < 0.25 ? 0.0 : 10.0^(4rand(rng) - 3)) for _ in 1:10]"
compare = "isapprox"
# rtol: with Tsit5 at abstol = reltol = 1e-10 and a terminating ContinuousCallback, the event time agrees
# with the closed form (vt/g) acosh(exp(h0 g / vt^2)), vt = sqrt(g/c) (evaluated as (vt/g)(x + log1p(sqrt(-expm1(-2x)))),
# x = h0 c, to avoid overflow), to within 1.3e-11 relative over the cases, the corners of the stated ranges and
# 200 random inputs from them (measured in the container). 1e-7 allows any accurate event location; a time read
# off a saveat grid of 1000 points is off by 1e-3 to 2e-3 relative, and wrong physics is off by percent.
rtol = 1e-7
hints = [
  "The ground is where the height crosses zero: a `ContinuousCallback` whose condition returns the height, with `terminate!` as the action.",
  "For the end of the span: once the object nears its terminal speed `sqrt(g/c)`, it falls at almost constant speed. How long can the slowest fall in the stated ranges take, and what covers `c = 0`?",
]

  [problem.perf]
  args = "100.0, 9.81, 0.01"
  sizes = [1]

  [[problem.variant]]
  label = "saveat grid of 1000 points, then the first saved time below zero"
  code = '''
using DifferentialEquations
function impact_time(h0, g, c)
    f(u, p, t) = [u[2], -g + c * u[2]^2]
    tmax = c > 0 ? sqrt(g / c) / g + 2h0 / sqrt(g / c) : 2sqrt(2h0 / g)
    sol = solve(ODEProblem(f, [h0, 0.0], (0.0, tmax)), Tsit5(); saveat = tmax / 1000, abstol = 1e-10, reltol = 1e-10)
    return sol.t[findfirst(u -> u[1] <= 0, sol.u)]
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "drag with the wrong sign (it speeds the fall up)"
  code = '''
using DifferentialEquations
function impact_time(h0, g, c)
    f(u, p, t) = [u[2], -g - c * u[2]^2]
    cb = ContinuousCallback((u, t, i) -> u[1], terminate!)
    return solve(ODEProblem(f, [h0, 0.0], (0.0, 1000.0)), Tsit5(); callback = cb, abstol = 1e-10, reltol = 1e-10).t[end]
end
'''
  expect = ["incorrect"]

  [[problem.variant]]
  label = "time span too short: returns the end of the span when the object has not landed"
