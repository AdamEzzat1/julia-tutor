[[problem]]
id = "ode-heat-rod-fix"
title = "Fix the cooling rod"
difficulty = "core"
kcs = ["in-place-rhs", "ode-solving", "stiffness"]
entry = "rod_peak"
packages = ["DifferentialEquations"]
prompt = '''
This program models heat flow along a rod of length 1 whose two ends are held
at temperature 0. The rod is cut into `n` interior points a distance
`dx = 1/(n+1)` apart, and the temperature `u[i]` at each point follows

    du[i]/dt = κ * (u[i-1] - 2u[i] + u[i+1]) / dx^2      (with u[0] = u[n+1] = 0)

`rod_peak(n, κ, T)` starts from `u[i] = sin(π i dx)` and should return the
highest temperature on the rod at time `T` (a `Float64`). It runs without an
error, but its answer is wrong. Find the bug and fix it; keep the solver and
the tolerances.

```julia
using DifferentialEquations

function heat!(du, u, p, t)
    κ, dx = p
    padded = [0.0; u; 0.0]                  # the two ends, held at 0
    du = κ .* (padded[1:end-2] .- 2 .* u .+ padded[3:end]) ./ dx^2
    return nothing
end

function rod_peak(n, κ, T)
    dx = 1 / (n + 1)
    u0 = [sinpi(i * dx) for i in 1:n]
    prob = ODEProblem(heat!, u0, (0.0, T), (κ, dx))
    sol = solve(prob, Rodas5P(); abstol = 1e-10, reltol = 1e-8, save_everystep = false)
    return maximum(sol.u[end])
end
```

The rod cools, so the peak falls: `rod_peak(9, 1.0, 0.1)` should be about
`0.376` (a little above `exp(-π^2 * 0.1) ≈ 0.373`, the value for a rod with
infinitely many points). Results are compared with `rtol = 1e-6`, and the
grader also measures memory.
'''
starter = '''
using DifferentialEquations

function heat!(du, u, p, t)
    κ, dx = p
    padded = [0.0; u; 0.0]                  # the two ends, held at 0
    du = κ .* (padded[1:end-2] .- 2 .* u .+ padded[3:end]) ./ dx^2
    return nothing
end

function rod_peak(n, κ, T)
    dx = 1 / (n + 1)
    u0 = [sinpi(i * dx) for i in 1:n]
    prob = ODEProblem(heat!, u0, (0.0, T), (κ, dx))
    sol = solve(prob, Rodas5P(); abstol = 1e-10, reltol = 1e-8, save_everystep = false)
    return maximum(sol.u[end])
end
'''
reference = '''
using DifferentialEquations

function heat!(du, u, p, t)
    κ, dx = p
    n = length(u)
    for i in 1:n
        left = i > 1 ? u[i-1] : zero(eltype(u))     # the two ends, held at 0
        right = i < n ? u[i+1] : zero(eltype(u))
        du[i] = κ * (left - 2u[i] + right) / dx^2
    end
    return nothing
end

function rod_peak(n, κ, T)
    dx = 1 / (n + 1)
    u0 = [sinpi(i * dx) for i in 1:n]
    prob = ODEProblem(heat!, u0, (0.0, T), (κ, dx))
    sol = solve(prob, Rodas5P(); abstol = 1e-10, reltol = 1e-8, save_everystep = false)
    return maximum(sol.u[end])
end
'''
cases = ["9, 1.0, 0.1", "49, 1.0, 0.05", "20, 0.5, 0.2", "5, 2.0, 0.01"]
gen = "rng -> [(rand(rng, 5:60), 0.1 + 1.9rand(rng), 0.01 + 0.29rand(rng)) for _ in 1:8]"
compare = "isapprox"
# rtol: the semi-discrete system has the exact solution u[i](t) = sin(π i dx) exp(-κ λ t) with
# λ = (4/dx^2) sin(π dx/2)^2, so the peak is known in closed form. At abstol = 1e-10, reltol = 1e-8, Rodas5P is within 1.3e-10
# (relative) of it on the cases and 100 random inputs from the gen ranges (measured in the container).
# 1e-6 leaves a wide margin for other correct right-hand sides; the unfixed starter returns the initial
# peak (off by 10% to 99%).
rtol = 1e-6
hints = [
  "Run the starter and compare its answer with the starting peak. If the temperatures never changed, which derivative did the solver see?",
  "Look at the line that computes the derivative: does it change the vector the solver passed in, or make a new one?",
]

  [problem.perf]
  args = "49, 1.0, 0.1"
  sizes = [1]

  [[problem.variant]]
  label = "returns the derivative instead of writing it (still four arguments, so still in place)"
