result = """5×3 DataFrame\n Row │ x      series  y\n     │ Int64  String  Float64\n─────┼────────────────────────\n   1 │     1  a           1.0\n   2 │     3  a           3.0\n   3 │     1  b           4.0\n   4 │     2  b           5.0\n   5 │     3  b           6.0"""
[[samples.aog-long-format]]
call = "long_format(DataFrame(x = 1:4, temp = [20.5, 21.0, missing, 22.0], rain = [missing, 1.5, 0.0, missing], wind = [3.0, 3.5, 4.0, 2.5]))"
result = """9×3 DataFrame\n Row │ x      series  y\n     │ Int64  String  Float64\n─────┼────────────────────────\n   1 │     1  temp       20.5\n   2 │     2  temp       21.0\n   3 │     4  temp       22.0\n   4 │     2  rain        1.5\n   5 │     3  rain        0.0\n   6 │     1  wind        3.0\n   7 │     2  wind        3.5\n   8 │     3  wind        4.0\n   9 │     4  wind        2.5"""
