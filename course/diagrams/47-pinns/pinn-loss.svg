<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>The PINN loss: network, nested AD, residual at collocation points plus boundary term</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
<text x="20" y="28" font-size="15" text-anchor="start" fill="#2b2733" font-weight="600">How the loss of this unit is built for u″ = f on (0, 1), u(0) = u(1) = 0</text>
<line x1="40" y1="75" x2="300" y2="75" stroke="#776f82" stroke-width="1.5"/>
<circle cx="48.4" cy="75" r="2.6" fill="#3657c8"/>
