<circle cx="283.2" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="291.6" cy="75" r="2.6" fill="#3657c8"/>
<rect x="35" y="70" width="10" height="10" fill="none" stroke="#2b2733" stroke-width="1.6"/>
<rect x="295" y="70" width="10" height="10" fill="none" stroke="#2b2733" stroke-width="1.6"/>
<text x="40" y="99" font-size="13" text-anchor="middle" fill="#2b2733">0</text>
<text x="300" y="99" font-size="13" text-anchor="middle" fill="#2b2733">1</text>
<text x="320" y="80" font-size="13" text-anchor="start" fill="#776f82">30 collocation points (dots), 2 boundary points (squares)</text>
<rect x="40" y="130" width="130" height="56" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="105" y="154" font-size="14" text-anchor="middle" fill="#2b2733">network</text>
<text x="105" y="174" font-size="13" text-anchor="middle" fill="#776f82">u(x; θ), 49 weights</text>
<rect x="210" y="130" width="150" height="56" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="285" y="154" font-size="14" text-anchor="middle" fill="#2b2733">nested ForwardDiff</text>
<text x="285" y="174" font-size="13" text-anchor="middle" fill="#776f82">u″(x; θ), exact</text>
<rect x="400" y="110" width="290" height="44" rx="6" fill="#eef1fb" stroke="#3657c8" stroke-width="1.5"/>
<text x="545" y="137" font-size="14" text-anchor="middle" fill="#3657c8">residual: mean of (u″(xᵢ; θ) − f(xᵢ))²</text>
<rect x="400" y="170" width="290" height="44" rx="6" fill="#eef1fb" stroke="#3657c8" stroke-width="1.5"/>
<text x="545" y="197" font-size="14" text-anchor="middle" fill="#3657c8">boundary: λ (u(0; θ)² + u(1; θ)²)</text>
<line x1="170" y1="158" x2="208" y2="158" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="360" y1="150" x2="398" y2="134" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M170,176 C 260,230 330,215 398,195" fill="none" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="250" y="228" font-size="13" text-anchor="middle" fill="#776f82">values at x = 0, 1</text>
<rect x="470" y="250" width="150" height="40" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="545" y="275" font-size="14" text-anchor="middle" fill="#2b2733">L(θ) = sum of both</text>
<line x1="545" y1="214" x2="545" y2="248" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M470,270 L105,270 L105,188" fill="none" stroke="#3657c8" stroke-width="1.6" marker-end="url(#arrowb)"/>
<text x="290" y="290" font-size="13" text-anchor="middle" fill="#3657c8">BFGS changes θ to lower L (gradient by ForwardDiff)</text>
<text x="20" y="330" font-size="13" text-anchor="start" fill="#776f82">No solution data enter: the loss only tests the equation at the chosen points and the boundary values.</text>
<text x="20" y="350" font-size="13" text-anchor="start" fill="#776f82">Without the boundary term, sin(πx) + a + b x would satisfy the residual for any a, b.</text>
</svg>
