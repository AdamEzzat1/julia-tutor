<circle cx="165.8" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="174.2" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="182.6" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="191.0" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="199.4" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="207.7" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="216.1" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="224.5" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="232.9" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="241.3" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="249.7" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="258.1" cy="75" r="2.6" fill="#3657c8"/>
<circle cx="266.5" cy="75" r="2.6" fill="#3657c8"/>
