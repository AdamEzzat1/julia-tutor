<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>Where the amplitude of each outcome is stored</title>
<rect width="560" height="400" fill="#ffffff"/>
<text x="20" y="28" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">basis_state(3, 5): outcome k is stored at Julia index k + 1</text>
<text x="70" y="64" font-size="13" fill="#776f82" text-anchor="middle" >outcome k</text>
<text x="190" y="64" font-size="13" fill="#776f82" text-anchor="middle" >k in binary</text>
<text x="320" y="64" font-size="13" fill="#776f82" text-anchor="middle" >Julia index</text>
<text x="450" y="64" font-size="13" fill="#776f82" text-anchor="middle" >amplitude</text>
<text x="70" y="92" font-size="15" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0</text>
<text x="190" y="92" font-size="15" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">000</text>
<text x="320" y="92" font-size="15" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ψ[1]</text>
