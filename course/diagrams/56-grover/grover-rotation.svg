<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>Grover iteration as a rotation</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker></defs>
<rect width="700" height="470" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">Two reflections make a rotation by 2θ</text>
<line x1="120" y1="360" x2="430" y2="360" stroke="#2b2733" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="438.0" y="365.0" font-size="14" fill="#2b2733" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|bad⟩</text>
<line x1="140" y1="410" x2="140" y2="90" stroke="#2b2733" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="140.0" y="82.0" font-size="14" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|good⟩</text>
<line x1="140" y1="360" x2="372.9" y2="301.9" stroke="#2b2733" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="394.5" y="302.6" font-size="13" fill="#2b2733" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|s⟩  (start)</text>
<line x1="140" y1="360" x2="372.9" y2="418.1" stroke="#3657c8" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="394.5" y="427.4" font-size="13" fill="#3657c8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">O|s⟩: oracle reflects about |bad⟩</text>
<line x1="140" y1="360" x2="318.4" y2="199.4" stroke="#2e7d4f" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="336.8" y="190.0" font-size="13" fill="#2e7d4f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">D O|s⟩: then D reflects about |s⟩</text>
<line x1="140" y1="360" x2="222.1" y2="134.5" stroke="#776f82" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="234.9" y="121.3" font-size="13" fill="#776f82" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">after 2 iterations</text>
<path d="M210.0,360.0 A70,70 0 0 0 207.9,343.1" fill="none" stroke="#2b2733" stroke-width="1.3"/>
<text x="227.4" y="353.8" font-size="12" fill="#2b2733" text-anchor="start" >θ</text>
<path d="M256.4,331.0 A120,120 0 0 0 229.2,279.7" fill="none" stroke="#2e7d4f" stroke-width="1.3"/>
<text x="262.3" y="301.1" font-size="12" fill="#2e7d4f" text-anchor="start" >2θ</text>
<line x1="140" y1="360" x2="411.7" y2="292.3" stroke="#7b4bb8" stroke-width="1" stroke-dasharray="2 4"/>
<text x="20.0" y="456.0" font-size="12" fill="#776f82" text-anchor="start" >sin²θ = M/N. After k iterations the angle is (2k + 1)θ, and P(marked) = sin²((2k + 1)θ), the squared height on |good⟩.</text>
</svg>
