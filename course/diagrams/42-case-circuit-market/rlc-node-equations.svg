<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
<title>Series RLC circuit with its two nodes and node equations</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect width="720" height="310" fill="white"/>
<text x="30.0" y="30.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">Series RLC circuit driven by a step source (R = 2 Ω, L = 1 H, C = 0.2 F, V_s = 1 V)</text>
<circle cx="80" cy="180" r="26" fill="white" stroke="#2b2733" stroke-width="2"/>
<text x="80.0" y="175.0" font-size="14" fill="#2b2733" text-anchor="middle">+</text>
<text x="80.0" y="196.0" font-size="14" fill="#2b2733" text-anchor="middle">−</text>
<text x="114.0" y="186.0" font-size="13" fill="#2b2733" text-anchor="start">V_s</text>
<line x1="80.0" y1="154.0" x2="80.0" y2="100.0" stroke="#2b2733" stroke-width="2"/>
<line x1="80.0" y1="206.0" x2="80.0" y2="260.0" stroke="#2b2733" stroke-width="2"/>
<line x1="80.0" y1="100.0" x2="180.0" y2="100.0" stroke="#2b2733" stroke-width="2"/>
<polyline points="180.0,100.0 190.0,90.0 200.0,110.0 210.0,90.0 220.0,110.0 230.0,90.0 240.0,110.0 250.0,90.0 260.0,110.0 270.0,90.0 280.0,100.0" fill="none" stroke="#2b2733" stroke-width="2"/>
<text x="230.0" y="80.0" font-size="14" fill="#2b2733" text-anchor="middle">R</text>
<line x1="280.0" y1="100.0" x2="360.0" y2="100.0" stroke="#2b2733" stroke-width="2"/>
<circle cx="360.0" cy="100.0" r="6" fill="#3657c8" stroke="none"/>
<text x="352.0" y="126.0" font-size="14" fill="#3657c8" text-anchor="end" font-weight="600">node a: v_a</text>
<line x1="360.0" y1="100.0" x2="380.0" y2="100.0" stroke="#2b2733" stroke-width="2"/>
<path d="M380,100 A12.5,12.5 0 0 1 405,100 A12.5,12.5 0 0 1 430,100 A12.5,12.5 0 0 1 455,100 A12.5,12.5 0 0 1 480,100" fill="none" stroke="#2b2733" stroke-width="2"/>
<text x="430.0" y="80.0" font-size="14" fill="#2b2733" text-anchor="middle">L, current i_L</text>
<line x1="480.0" y1="100.0" x2="560.0" y2="100.0" stroke="#2b2733" stroke-width="2"/>
<circle cx="560.0" cy="100.0" r="6" fill="#3657c8" stroke="none"/>
<text x="560.0" y="84.0" font-size="14" fill="#3657c8" text-anchor="middle" font-weight="600">node b: v_b</text>
<line x1="560.0" y1="100.0" x2="560.0" y2="170.0" stroke="#2b2733" stroke-width="2"/>
<line x1="535.0" y1="170.0" x2="585.0" y2="170.0" stroke="#2b2733" stroke-width="3"/>
<line x1="535.0" y1="184.0" x2="585.0" y2="184.0" stroke="#2b2733" stroke-width="3"/>
<text x="595.0" y="182.0" font-size="14" fill="#2b2733" text-anchor="start">C</text>
<line x1="560.0" y1="184.0" x2="560.0" y2="260.0" stroke="#2b2733" stroke-width="2"/>
<line x1="80.0" y1="260.0" x2="560.0" y2="260.0" stroke="#2b2733" stroke-width="2"/>
<line x1="300.0" y1="260.0" x2="300.0" y2="272.0" stroke="#2b2733" stroke-width="2"/>
<line x1="285.0" y1="272.0" x2="315.0" y2="272.0" stroke="#2b2733" stroke-width="2"/>
<line x1="290.0" y1="278.0" x2="310.0" y2="278.0" stroke="#2b2733" stroke-width="2"/>
<line x1="295.0" y1="284.0" x2="305.0" y2="284.0" stroke="#2b2733" stroke-width="2"/>
<text x="330.0" y="286.0" font-size="13" fill="#776f82" text-anchor="start">ground, 0 V</text>
<text x="190.0" y="155.0" font-size="13" fill="#3657c8" text-anchor="start">KCL at a: 0 = (V_s - v_a)/R - i_L</text>
<text x="190.0" y="175.0" font-size="13" fill="#776f82" text-anchor="start">no capacitor at a: no derivative</text>
<text x="612.0" y="125.0" font-size="13" fill="#3657c8" text-anchor="start">KCL at b:</text>
<text x="612.0" y="143.0" font-size="13" fill="#3657c8" text-anchor="start">C v_b' = i_L</text>
<text x="612.0" y="220.0" font-size="13" fill="#3657c8" text-anchor="start">inductor:</text>
<text x="612.0" y="238.0" font-size="13" fill="#3657c8" text-anchor="start">L i_L' = v_a - v_b</text>
</svg>
