<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>A universal differential equation: known terms plus a small network</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect x="0" y="0" width="720" height="320" fill="#ffffff"/>
<text x="20" y="28" font-size="15" text-anchor="start" fill="#2b2733" font-weight="600">The UDE of this unit: the network learns only the interaction terms</text>
<rect x="20" y="110" width="90" height="50" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="65" y="140" font-size="14" text-anchor="middle" fill="#2b2733">u = (x, y)</text>
<rect x="170" y="60" width="210" height="56" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="275" y="84" font-size="14" text-anchor="middle" fill="#2b2733">known: (α x, −γ y)</text>
<text x="275" y="104" font-size="13" text-anchor="middle" fill="#776f82">α = 1.3, γ = 1.8, fixed</text>
<rect x="170" y="150" width="210" height="56" rx="6" fill="#eef1fb" stroke="#3657c8" stroke-width="2"/>
<text x="275" y="174" font-size="14" text-anchor="middle" fill="#3657c8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">NN(x, y; θ)</text>
<text x="275" y="194" font-size="13" text-anchor="middle" fill="#3657c8">57 weights θ, trained</text>
<line x1="110" y1="128" x2="168" y2="92" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="110" y1="142" x2="168" y2="176" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="430" cy="134" r="16" fill="none" stroke="#776f82" stroke-width="1.6"/>
<text x="430" y="140" font-size="18" text-anchor="middle" fill="#2b2733">+</text>
<line x1="380" y1="90" x2="416" y2="124" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="380" y1="178" x2="416" y2="146" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="470" y="110" width="90" height="50" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="515" y="140" font-size="14" text-anchor="middle" fill="#2b2733">du/dt</text>
<line x1="446" y1="134" x2="468" y2="134" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="600" y="104" width="100" height="62" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="650" y="130" font-size="13" text-anchor="middle" fill="#2b2733">ODE solve,</text>
<text x="650" y="150" font-size="13" text-anchor="middle" fill="#2b2733">loss vs data</text>
<line x1="560" y1="134" x2="598" y2="134" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M650,166 L650,250 L275,250 L275,210" fill="none" stroke="#3657c8" stroke-width="1.6" marker-end="url(#arrowb)"/>
<text x="462" y="270" font-size="13" text-anchor="middle" fill="#3657c8">the gradient updates θ only; the known terms never change</text>
<text x="20" y="305" font-size="13" text-anchor="start" fill="#776f82">Target: NN ≈ (−β x y, δ x y) = (−0.9 x y, 0.8 x y), a function of two inputs instead of the whole dynamics.</text>
</svg>
