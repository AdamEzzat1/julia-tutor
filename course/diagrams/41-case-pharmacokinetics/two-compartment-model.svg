<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
<title>Two-compartment model with an absorption depot</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect width="720" height="330" fill="white"/>
<text x="30.0" y="30.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">Two compartments with an absorption depot (amounts in mg)</text>
<rect x="40" y="110" width="150" height="80" rx="10" fill="#eef1fb" stroke="#3657c8" stroke-width="2"/>
<text x="115.0" y="144.0" font-size="14" fill="#2b2733" text-anchor="middle" font-weight="600">gut</text>
<text x="115.0" y="166.0" font-size="13" fill="#776f82" text-anchor="middle">A_g</text>
<rect x="280" y="110" width="190" height="80" rx="10" fill="#eef1fb" stroke="#3657c8" stroke-width="2"/>
<text x="375.0" y="144.0" font-size="14" fill="#2b2733" text-anchor="middle" font-weight="600">central</text>
<text x="375.0" y="166.0" font-size="13" fill="#776f82" text-anchor="middle">A_c, volume V₁ = 20 L</text>
<rect x="540" y="110" width="160" height="80" rx="10" fill="#eef1fb" stroke="#3657c8" stroke-width="2"/>
<text x="620.0" y="144.0" font-size="14" fill="#2b2733" text-anchor="middle" font-weight="600">peripheral</text>
<text x="620.0" y="166.0" font-size="13" fill="#776f82" text-anchor="middle">A_p, volume V₂ = 60 L</text>
<line x1="115.0" y1="50.0" x2="115.0" y2="106.0" stroke="#3657c8" stroke-width="2" marker-end="url(#arrowb)"/>
<text x="125.0" y="70.0" font-size="13" fill="#3657c8" text-anchor="start">dose D = 100 mg</text>
<text x="125.0" y="88.0" font-size="13" fill="#3657c8" text-anchor="start">at t = 0, 12, 24, ...</text>
<line x1="192.0" y1="150.0" x2="276.0" y2="150.0" stroke="#2b2733" stroke-width="2" marker-end="url(#arrow)"/>
<text x="234.0" y="140.0" font-size="13" fill="#2b2733" text-anchor="middle">k_a A_g</text>
<text x="234.0" y="172.0" font-size="13" fill="#776f82" text-anchor="middle">k_a = 2 /h</text>
<line x1="472.0" y1="135.0" x2="536.0" y2="135.0" stroke="#2b2733" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="536.0" y1="165.0" x2="472.0" y2="165.0" stroke="#2b2733" stroke-width="2" marker-end="url(#arrow)"/>
<text x="504.0" y="127.0" font-size="13" fill="#2b2733" text-anchor="middle">Q·C</text>
<text x="504.0" y="184.0" font-size="13" fill="#2b2733" text-anchor="middle">Q·A_p/V₂</text>
<text x="504.0" y="210.0" font-size="13" fill="#776f82" text-anchor="middle">Q = 4 L/h</text>
<line x1="375.0" y1="192.0" x2="375.0" y2="260.0" stroke="#2b2733" stroke-width="2" marker-end="url(#arrow)"/>
<text x="387.0" y="230.0" font-size="13" fill="#2b2733" text-anchor="start">elimination CL·C, CL = 5 L/h</text>
<text x="285.0" y="98.0" font-size="13" fill="#3657c8" text-anchor="start">measured: C = A_c / V₁</text>
<text x="30.0" y="295.0" font-size="13" fill="#776f82" text-anchor="start">Each arrow is a clearance times the concentration it leaves from, so u' = K u is linear.</text>
<text x="30.0" y="315.0" font-size="13" fill="#776f82" text-anchor="start">Eigenvalues of K: -2, -0.482, -0.0346 per hour (half-lives 0.35 h, 1.44 h, 20 h).</text>
</svg>
