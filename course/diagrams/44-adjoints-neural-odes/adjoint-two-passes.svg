<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>Discrete adjoint: a forward pass that stores states, a backward pass that carries one vector</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
<text x="20" y="28" font-size="15" text-anchor="start" fill="#2b2733" font-weight="600">Reverse mode through N Euler steps (the unit's example stores N + 1 = 101 states for N = 100)</text>
<rect x="28" y="83" width="64" height="40" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<rect x="28" y="203" width="64" height="40" rx="6" fill="#eef1fb" stroke="#3657c8" stroke-width="1.5"/>
<text x="60" y="109" font-size="16" text-anchor="middle" fill="#2b2733">u₀</text>
<text x="60" y="229" font-size="16" text-anchor="middle" fill="#2b2733">λ₀</text>
<rect x="158" y="83" width="64" height="40" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<rect x="158" y="203" width="64" height="40" rx="6" fill="#eef1fb" stroke="#3657c8" stroke-width="1.5"/>
<text x="190" y="109" font-size="16" text-anchor="middle" fill="#2b2733">u₁</text>
<text x="190" y="229" font-size="16" text-anchor="middle" fill="#2b2733">λ₁</text>
<rect x="288" y="83" width="64" height="40" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<rect x="288" y="203" width="64" height="40" rx="6" fill="#eef1fb" stroke="#3657c8" stroke-width="1.5"/>
<text x="320" y="109" font-size="16" text-anchor="middle" fill="#2b2733">u₂</text>
<text x="320" y="229" font-size="16" text-anchor="middle" fill="#2b2733">λ₂</text>
<text x="450" y="109" font-size="16" text-anchor="middle" fill="#2b2733">…</text>
<text x="450" y="229" font-size="16" text-anchor="middle" fill="#2b2733">…</text>
<rect x="548" y="83" width="64" height="40" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<rect x="548" y="203" width="64" height="40" rx="6" fill="#eef1fb" stroke="#3657c8" stroke-width="1.5"/>
<text x="580" y="109" font-size="16" text-anchor="middle" fill="#2b2733">u_N</text>
<text x="580" y="229" font-size="16" text-anchor="middle" fill="#2b2733">λ_N</text>
<line x1="94" y1="103" x2="154" y2="103" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="156" y1="223" x2="96" y2="223" stroke="#3657c8" stroke-width="1.6" marker-end="url(#arrowb)"/>
<line x1="224" y1="103" x2="284" y2="103" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="286" y1="223" x2="226" y2="223" stroke="#3657c8" stroke-width="1.6" marker-end="url(#arrowb)"/>
<line x1="354" y1="103" x2="414" y2="103" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="416" y1="223" x2="356" y2="223" stroke="#3657c8" stroke-width="1.6" marker-end="url(#arrowb)"/>
<line x1="484" y1="103" x2="544" y2="103" stroke="#776f82" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="546" y1="223" x2="486" y2="223" stroke="#3657c8" stroke-width="1.6" marker-end="url(#arrowb)"/>
<line x1="60" y1="125" x2="60" y2="201" stroke="#776f82" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="190" y1="125" x2="190" y2="201" stroke="#776f82" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="320" y1="125" x2="320" y2="201" stroke="#776f82" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="330" y="71" font-size="14" text-anchor="middle" fill="#2b2733">forward pass: uₖ₊₁ = uₖ + h f(uₖ, p), every state kept</text>
<text x="330" y="269" font-size="14" text-anchor="middle" fill="#3657c8">backward pass: λₖ = λₖ₊₁ + h Jₖᵀ λₖ₊₁,   ∂L/∂p += h Fₖᵀ λₖ₊₁</text>
<text x="202" y="169.0" font-size="13" text-anchor="start" fill="#776f82">reads uₖ (dashed)</text>
<line x1="580" y1="125" x2="580" y2="201" stroke="#3657c8" stroke-width="1.6" marker-end="url(#arrowb)"/>
<text x="594" y="169.0" font-size="13" text-anchor="start" fill="#3657c8">start: λ_N = ∇g(u_N)</text>
<text x="20" y="300" font-size="13" text-anchor="start" fill="#776f82">Each backward step works on one vector of length n and two vector-Jacobian products, whatever the</text>
<text x="20" y="320" font-size="13" text-anchor="start" fill="#776f82">number of parameters m; forward mode would carry an n × m matrix through every step instead.</text>
</svg>
