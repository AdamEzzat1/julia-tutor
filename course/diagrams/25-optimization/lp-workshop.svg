<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>The workshop linear program</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="360.0" y="24.0" font-size="15" text-anchor="middle" fill="#2b2733" >The workshop LP: maximise 30·chairs + 50·tables</text>
<line x1="80.0" y1="360.0" x2="531.0" y2="360.0" stroke="#776f82" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="80.0" y1="360.0" x2="80.0" y2="40.0" stroke="#776f82" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190.0" y1="360.0" x2="190.0" y2="365.0" stroke="#776f82" stroke-width="1.5"/>
<text x="190.0" y="380.0" font-size="13" text-anchor="middle" fill="#776f82" >5</text>
<line x1="300.0" y1="360.0" x2="300.0" y2="365.0" stroke="#776f82" stroke-width="1.5"/>
<text x="300.0" y="380.0" font-size="13" text-anchor="middle" fill="#776f82" >10</text>
<line x1="410.0" y1="360.0" x2="410.0" y2="365.0" stroke="#776f82" stroke-width="1.5"/>
<text x="410.0" y="380.0" font-size="13" text-anchor="middle" fill="#776f82" >15</text>
<line x1="520.0" y1="360.0" x2="520.0" y2="365.0" stroke="#776f82" stroke-width="1.5"/>
<text x="520.0" y="380.0" font-size="13" text-anchor="middle" fill="#776f82" >20</text>
<line x1="75.0" y1="260.0" x2="80.0" y2="260.0" stroke="#776f82" stroke-width="1.5"/>
<text x="71.0" y="265.0" font-size="13" text-anchor="end" fill="#776f82" >5</text>
<line x1="75.0" y1="160.0" x2="80.0" y2="160.0" stroke="#776f82" stroke-width="1.5"/>
<text x="71.0" y="165.0" font-size="13" text-anchor="end" fill="#776f82" >10</text>
<line x1="75.0" y1="60.0" x2="80.0" y2="60.0" stroke="#776f82" stroke-width="1.5"/>
<text x="71.0" y="65.0" font-size="13" text-anchor="end" fill="#776f82" >15</text>
<text x="520.0" y="396.0" font-size="14" text-anchor="end" fill="#776f82" >chairs</text>
<text x="88.0" y="44.0" font-size="14" text-anchor="start" fill="#776f82" >tables</text>
<polygon points="80,360 300,360 190,210.0 80,160" fill="#e8ecf9" stroke="none"/>
<line x1="80.0" y1="160.0" x2="520.0" y2="360.0" stroke="#2b2733" stroke-width="2"/>
<text x="366.0" y="284.0" font-size="13" text-anchor="start" fill="#2b2733" >wood: 2c + 4t ≤ 40</text>
<line x1="80.0" y1="60.0" x2="300.0" y2="360.0" stroke="#2b2733" stroke-width="2"/>
<text x="137.2" y="128.0" font-size="13" text-anchor="start" fill="#2b2733" >labour: 3c + 2t ≤ 30</text>
<line x1="80.0" y1="240.0" x2="300.0" y2="360.0" stroke="#776f82" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="108.6" y="292.0" font-size="13" text-anchor="start" fill="#776f82" >profit 300</text>
<line x1="80.0" y1="150.0" x2="465.0" y2="360.0" stroke="#3657c8" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="190.0" cy="210.0" r="6" fill="#3657c8"/>
<text x="202.0" y="200.0" font-size="14" text-anchor="start" fill="#3657c8" >optimum (5, 7.5): profit 525</text>
<text x="130.6" y="320.0" font-size="14" text-anchor="middle" fill="#3657c8" >feasible</text>
<text x="421.0" y="164.0" font-size="13" text-anchor="start" fill="#776f82" >dashed: lines of equal profit;</text>
<text x="421.0" y="182.0" font-size="13" text-anchor="start" fill="#776f82" >push the line up-right until</text>
<text x="421.0" y="200.0" font-size="13" text-anchor="start" fill="#776f82" >it last touches the region</text>
</svg>
