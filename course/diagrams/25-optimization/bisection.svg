<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>Bisection halves a bracket</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="360.0" y="24.0" font-size="15" text-anchor="middle" fill="#2b2733" >Bisection on f(x) = cos(x) - x, starting from the bracket [0, 1]</text>
<line x1="90.0" y1="74.0" x2="610.0" y2="74.0" stroke="#e4e1e8" stroke-width="1"/>
<rect x="90.0" y="66" width="520.0" height="16" fill="#e8ecf9" stroke="#3657c8" stroke-width="1.5"/>
