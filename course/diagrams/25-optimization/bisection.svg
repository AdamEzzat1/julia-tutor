<text x="616.0" y="79.0" font-size="15" text-anchor="start" fill="#2b2733" >-</text>
<text x="30.0" y="79.0" font-size="13" text-anchor="start" fill="#776f82" >step 0</text>
<line x1="350.0" y1="62.0" x2="350.0" y2="86.0" stroke="#2b2733" stroke-width="2"/>
<text x="350.0" y="102.0" font-size="13" text-anchor="middle" fill="#776f82" >f(0.5) = +0.378</text>
<line x1="90.0" y1="130.0" x2="610.0" y2="130.0" stroke="#e4e1e8" stroke-width="1"/>
<rect x="350.0" y="122" width="260.0" height="16" fill="#e8ecf9" stroke="#3657c8" stroke-width="1.5"/>
<text x="344.0" y="135.0" font-size="15" text-anchor="end" fill="#2b2733" >+</text>
<text x="616.0" y="135.0" font-size="15" text-anchor="start" fill="#2b2733" >-</text>
<text x="30.0" y="135.0" font-size="13" text-anchor="start" fill="#776f82" >step 1</text>
<line x1="480.0" y1="118.0" x2="480.0" y2="142.0" stroke="#2b2733" stroke-width="2"/>
<line x1="90.0" y1="186.0" x2="610.0" y2="186.0" stroke="#e4e1e8" stroke-width="1"/>
<rect x="350.0" y="178" width="130.0" height="16" fill="#e8ecf9" stroke="#3657c8" stroke-width="1.5"/>
<text x="344.0" y="191.0" font-size="15" text-anchor="end" fill="#2b2733" >+</text>
<text x="486.0" y="191.0" font-size="15" text-anchor="start" fill="#2b2733" >-</text>
<text x="30.0" y="191.0" font-size="13" text-anchor="start" fill="#776f82" >step 2</text>
<line x1="415.0" y1="174.0" x2="415.0" y2="198.0" stroke="#2b2733" stroke-width="2"/>
<text x="415.0" y="214.0" font-size="13" text-anchor="middle" fill="#776f82" >f(0.625) = +0.186</text>
<line x1="90.0" y1="242.0" x2="610.0" y2="242.0" stroke="#e4e1e8" stroke-width="1"/>
<rect x="415.0" y="234" width="65.0" height="16" fill="#e8ecf9" stroke="#3657c8" stroke-width="1.5"/>
<text x="409.0" y="247.0" font-size="15" text-anchor="end" fill="#2b2733" >+</text>
<text x="486.0" y="247.0" font-size="15" text-anchor="start" fill="#2b2733" >-</text>
<text x="30.0" y="247.0" font-size="13" text-anchor="start" fill="#776f82" >step 3</text>
<line x1="447.5" y1="230.0" x2="447.5" y2="254.0" stroke="#2b2733" stroke-width="2"/>
<line x1="90.0" y1="298.0" x2="610.0" y2="298.0" stroke="#e4e1e8" stroke-width="1"/>
<rect x="447.5" y="290" width="32.5" height="16" fill="#e8ecf9" stroke="#3657c8" stroke-width="1.5"/>
<text x="441.5" y="303.0" font-size="15" text-anchor="end" fill="#2b2733" >+</text>
<text x="486.0" y="303.0" font-size="15" text-anchor="start" fill="#2b2733" >-</text>
<text x="30.0" y="303.0" font-size="13" text-anchor="start" fill="#776f82" >step 4</text>
<text x="502.0" y="303.0" font-size="13" text-anchor="start" fill="#776f82" >[0.6875, 0.75]</text>
<line x1="474.3" y1="50.0" x2="474.3" y2="350.0" stroke="#3657c8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="474.3" y="368.0" font-size="13" text-anchor="middle" fill="#3657c8" >root 0.7390851…</text>
<text x="90.0" y="368.0" font-size="13" text-anchor="middle" fill="#776f82" >0</text>
<text x="610.0" y="368.0" font-size="13" text-anchor="middle" fill="#776f82" >1</text>
<text x="360.0" y="390.0" font-size="13" text-anchor="middle" fill="#776f82" >+ and - are the signs of f at the ends; each step keeps the half that still changes sign.</text>
<text x="484.0" y="158.0" font-size="13" text-anchor="start" fill="#776f82" paint-order="stroke" stroke="#fff" stroke-width="4" >f(0.75) = -0.018</text>
<text x="466.0" y="270.0" font-size="13" text-anchor="end" fill="#776f82" paint-order="stroke" stroke="#fff" stroke-width="4" >f(0.6875) = +0.085</text>
