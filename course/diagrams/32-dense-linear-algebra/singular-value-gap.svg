<text x="290.0" y="68.0" font-size="13" fill="#3657c8" text-anchor="middle">2.503</text>
<rect x="332.0" y="225.5" width="44" height="94.5" fill="#776f82" fill-opacity="0.45"/>
<text x="354.0" y="338.0" font-size="13" fill="#776f82" text-anchor="middle">σ4</text>
<text x="354.0" y="219.5" font-size="13" fill="#776f82" text-anchor="middle">2e-10</text>
<rect x="396.0" y="230.0" width="44" height="90.0" fill="#776f82" fill-opacity="0.45"/>
