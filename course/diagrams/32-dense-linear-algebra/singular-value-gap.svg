<text x="162.0" y="60.6" font-size="13" fill="#3657c8" text-anchor="middle">7.794</text>
<rect x="204.0" y="68.7" width="44" height="251.3" fill="#3657c8" fill-opacity="0.8"/>
<text x="226.0" y="338.0" font-size="13" fill="#776f82" text-anchor="middle">σ2</text>
<text x="226.0" y="62.7" font-size="13" fill="#3657c8" text-anchor="middle">5.648</text>
