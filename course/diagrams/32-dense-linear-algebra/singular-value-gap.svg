<text x="536.0" y="200.6" font-size="13" fill="#2f8a4c" text-anchor="start">7.8e-8: rank 3</text>
<text x="310.0" y="364.0" font-size="13" fill="#776f82" text-anchor="middle">the gap from 2.5 to 2e-10 is where the noise starts</text>
