<text x="102" y="325.0" font-size="14" fill="#776f82" text-anchor="end">10<tspan baseline-shift="super" font-size="13">-16</tspan></text>
<line x1="105.0" y1="260.0" x2="110.0" y2="260.0" stroke="#776f82" stroke-width="1"/>
<text x="102" y="265.0" font-size="14" fill="#776f82" text-anchor="end">10<tspan baseline-shift="super" font-size="13">-12</tspan></text>
<line x1="105.0" y1="200.0" x2="110.0" y2="200.0" stroke="#776f82" stroke-width="1"/>
<text x="102" y="205.0" font-size="14" fill="#776f82" text-anchor="end">10<tspan baseline-shift="super" font-size="13">-8</tspan></text>
<line x1="105.0" y1="140.0" x2="110.0" y2="140.0" stroke="#776f82" stroke-width="1"/>
<text x="102" y="145.0" font-size="14" fill="#776f82" text-anchor="end">10<tspan baseline-shift="super" font-size="13">-4</tspan></text>
<line x1="105.0" y1="80.0" x2="110.0" y2="80.0" stroke="#776f82" stroke-width="1"/>
<text x="102" y="85.0" font-size="14" fill="#776f82" text-anchor="end">10<tspan baseline-shift="super" font-size="13">0</tspan></text>
<rect x="140.0" y="66.6" width="44" height="253.4" fill="#3657c8" fill-opacity="0.8"/>
