<text x="482.0" y="231.8" font-size="13" fill="#776f82" text-anchor="middle">3e-11</text>
<line x1="110.0" y1="289.8" x2="530.0" y2="289.8" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="536.0" y="285.8" font-size="13" fill="#c0392b" text-anchor="start">default rank threshold</text>
<text x="536.0" y="303.8" font-size="13" fill="#c0392b" text-anchor="start">6 eps σ1 ≈ 1.0e-14: rank 6</text>
<line x1="110.0" y1="186.6" x2="530.0" y2="186.6" stroke="#2f8a4c" stroke-width="1.8" stroke-dasharray="6 4"/>
