<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>Forward sensitivities: one extra column of n equations per parameter</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker></defs>
<rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
<text x="20" y="28" font-size="15" text-anchor="start" fill="#2b2733" font-weight="600">The augmented state solved by Tsit5 for Lotka-Volterra (n = 2 states, m = 4 parameters)</text>
<rect x="30" y="60" width="78" height="70" rx="6" fill="#eef1fb" stroke="#3657c8" stroke-width="2"/>
<text x="69.0" y="90" font-size="16" text-anchor="middle" fill="#2b2733" font-weight="600">u</text>
<text x="69.0" y="112" font-size="14" text-anchor="middle" fill="#2b2733">x, y</text>
<rect x="126" y="60" width="78" height="70" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="165.0" y="90" font-size="14" text-anchor="middle" fill="#2b2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">S[:, 1]</text>
<text x="165.0" y="112" font-size="14" text-anchor="middle" fill="#2b2733">∂u/∂p₁</text>
<rect x="212" y="60" width="78" height="70" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="251.0" y="90" font-size="14" text-anchor="middle" fill="#2b2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">S[:, 2]</text>
<text x="251.0" y="112" font-size="14" text-anchor="middle" fill="#2b2733">∂u/∂p₂</text>
<rect x="298" y="60" width="78" height="70" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="337.0" y="90" font-size="14" text-anchor="middle" fill="#2b2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">S[:, 3]</text>
<text x="337.0" y="112" font-size="14" text-anchor="middle" fill="#2b2733">∂u/∂p₃</text>
<rect x="384" y="60" width="78" height="70" rx="6" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="423.0" y="90" font-size="14" text-anchor="middle" fill="#2b2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">S[:, 4]</text>
<text x="423.0" y="112" font-size="14" text-anchor="middle" fill="#2b2733">∂u/∂p₄</text>
<text x="69.0" y="152" font-size="13" text-anchor="middle" fill="#776f82">2 states</text>
<text x="294.0" y="152" font-size="13" text-anchor="middle" fill="#776f82">4 columns × 2 = 8 sensitivity states  (2 + 8 = 10 in all)</text>
<text x="30" y="250" font-size="14" text-anchor="start" fill="#2b2733">dS/dt = J S + F  rides along with  du/dt = f(u, p, t), from S(0) = 0, in the same solve.</text>
<text x="30" y="272" font-size="14" text-anchor="start" fill="#2b2733">Every extra parameter adds one more column of n equations, and every solver step updates all of them.</text>
<text x="490" y="66" font-size="14" text-anchor="start" fill="#2b2733" font-weight="600">du/dt = A u, m = n² (recorded)</text>
<text x="490" y="92" font-size="14" text-anchor="start" fill="#776f82">n</text>
<text x="530" y="92" font-size="14" text-anchor="start" fill="#776f82">m</text>
<text x="575" y="92" font-size="14" text-anchor="start" fill="#776f82">states</text>
<text x="640" y="92" font-size="14" text-anchor="start" fill="#776f82">grad/solve</text>
<text x="490" y="116" font-size="14" text-anchor="start" fill="#2b2733">2</text>
<text x="530" y="116" font-size="14" text-anchor="start" fill="#2b2733">4</text>
<text x="575" y="116" font-size="14" text-anchor="start" fill="#2b2733">10</text>
<text x="640" y="116" font-size="14" text-anchor="start" fill="#2b2733">≈ 1</text>
<text x="490" y="140" font-size="14" text-anchor="start" fill="#2b2733">4</text>
<text x="530" y="140" font-size="14" text-anchor="start" fill="#2b2733">16</text>
<text x="575" y="140" font-size="14" text-anchor="start" fill="#2b2733">68</text>
<text x="640" y="140" font-size="14" text-anchor="start" fill="#2b2733">≈ 9</text>
<text x="490" y="164" font-size="14" text-anchor="start" fill="#2b2733">8</text>
<text x="530" y="164" font-size="14" text-anchor="start" fill="#2b2733">64</text>
<text x="575" y="164" font-size="14" text-anchor="start" fill="#2b2733">520</text>
<text x="640" y="164" font-size="14" text-anchor="start" fill="#2b2733">≈ 116</text>
<line x1="490" y1="98" x2="710" y2="98" stroke="#776f82" stroke-width="1"/>
<text x="490" y="210" font-size="13" text-anchor="start" fill="#776f82">states = n + n·m;</text>
<text x="490" y="228" font-size="13" text-anchor="start" fill="#776f82">timings from one machine</text>
<text x="30" y="318" font-size="13" text-anchor="start" fill="#776f82">Forward mode carries one derivative direction per parameter, so its cost grows with m (unit 44 measures the adjoint).</text>
</svg>
