<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>Fill-in of a sparse Cholesky factor</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker>
</defs>
<rect width="720" height="362" fill="#ffffff"/>
<text x="20.0" y="26.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">Stored entries of the Cholesky factor L, natural order against reordered</text>
<text x="20.0" y="46.0" font-size="13" fill="#776f82" text-anchor="start">(measured in this section; nnz(A) for comparison; linear scale within each row)</text>
<text x="136.0" y="110.0" font-size="14" fill="#2b2733" text-anchor="end" font-weight="600">N = 16</text>
<rect x="150" y="80" width="97.6" height="16" fill="#776f82" fill-opacity="0.4"/>
<text x="253.6" y="93.0" font-size="13" fill="#2b2733" text-anchor="start">nnz(A) 1,216</text>
<rect x="150" y="100" width="330.0" height="16" fill="#2b2733" fill-opacity="0.55"/>
<text x="486.0" y="113.0" font-size="13" fill="#2b2733" text-anchor="start">L, natural 4,111</text>
<rect x="150" y="120" width="170.0" height="16" fill="#3657c8" fill-opacity="0.75"/>
<text x="326.0" y="133.0" font-size="13" fill="#3657c8" text-anchor="start">L, reordered 2,118</text>
<text x="700.0" y="110.0" font-size="15" fill="#2b2733" text-anchor="end" font-weight="600">1.9×</text>
<text x="136.0" y="196.0" font-size="14" fill="#2b2733" text-anchor="end" font-weight="600">N = 32</text>
<rect x="150" y="166" width="50.2" height="16" fill="#776f82" fill-opacity="0.4"/>
<text x="206.2" y="179.0" font-size="13" fill="#2b2733" text-anchor="start">nnz(A) 4,992</text>
<rect x="150" y="186" width="330.0" height="16" fill="#2b2733" fill-opacity="0.55"/>
<text x="486.0" y="199.0" font-size="13" fill="#2b2733" text-anchor="start">L, natural 32,799</text>
<rect x="150" y="206" width="119.7" height="16" fill="#3657c8" fill-opacity="0.75"/>
<text x="275.7" y="219.0" font-size="13" fill="#3657c8" text-anchor="start">L, reordered 11,900</text>
<text x="700.0" y="196.0" font-size="15" fill="#2b2733" text-anchor="end" font-weight="600">2.8×</text>
<text x="136.0" y="282.0" font-size="14" fill="#2b2733" text-anchor="end" font-weight="600">N = 64</text>
<rect x="150" y="252" width="22.8" height="16" fill="#776f82" fill-opacity="0.4"/>
<text x="178.8" y="265.0" font-size="13" fill="#2b2733" text-anchor="start">nnz(A) 20,224</text>
<rect x="150" y="272" width="330.0" height="16" fill="#2b2733" fill-opacity="0.55"/>
<text x="486.0" y="285.0" font-size="13" fill="#2b2733" text-anchor="start">L, natural 292,895</text>
<rect x="150" y="292" width="75.7" height="16" fill="#3657c8" fill-opacity="0.75"/>
<text x="231.7" y="305.0" font-size="13" fill="#3657c8" text-anchor="start">L, reordered 67,200</text>
<text x="700.0" y="282.0" font-size="15" fill="#2b2733" text-anchor="end" font-weight="600">4.4×</text>
<text x="700.0" y="68.0" font-size="13" fill="#776f82" text-anchor="end">natural / reordered</text>
<text x="20.0" y="344.0" font-size="13" fill="#776f82" text-anchor="start">The natural order fills the band (about N³ entries); reordering cuts the fill, and the gain grows with N.</text>
</svg>
