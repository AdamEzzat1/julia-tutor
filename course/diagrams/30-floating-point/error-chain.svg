<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>Forward error is at most the condition number times the backward error</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3657c8"/></marker>
</defs>
<rect width="720" height="380" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">Backward error, condition number, forward error</text>
<rect x="30.0" y="60.0" width="250.0" height="200.0" rx="12" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="155.0" y="82.0" font-size="14" fill="#776f82" text-anchor="middle">inputs</text>
<rect x="440.0" y="60.0" width="250.0" height="200.0" rx="12" fill="none" stroke="#776f82" stroke-width="1.5"/>
<text x="565.0" y="82.0" font-size="14" fill="#776f82" text-anchor="middle">answers</text>
<circle cx="110.0" cy="150.0" r="6" fill="#2b2733" stroke="none" stroke-width="1.5"/>
<text x="96.0" y="155.0" font-size="15" fill="#2b2733" text-anchor="end" font-style="italic">x</text>
<circle cx="150.0" cy="210.0" r="6" fill="#ffffff" stroke="#2b2733" stroke-width="1.5"/>
<text x="136.0" y="228.0" font-size="14" fill="#2b2733" text-anchor="end">x̂ (nearby input)</text>
<circle cx="520.0" cy="150.0" r="6" fill="#2b2733" stroke="none" stroke-width="1.5"/>
<text x="508.0" y="138.0" font-size="14" fill="#2b2733" text-anchor="start">f(x) (true answer)</text>
<circle cx="600.0" cy="210.0" r="6" fill="#3657c8" stroke="none" stroke-width="1.5"/>
<text x="570.0" y="240.0" font-size="14" fill="#3657c8" text-anchor="start">ŷ = f(x̂)</text>
<text x="570.0" y="257.0" font-size="13" fill="#3657c8" text-anchor="start">(computed)</text>
<path d="M118,146 C 250,95 400,95 511,146" fill="none" stroke="#2b2733" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="315.0" y="104.0" font-size="14" fill="#2b2733" text-anchor="middle">exact f</text>
<path d="M118,154 C 260,170 420,200 591,210" fill="none" stroke="#3657c8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowb)"/>
<text x="300.0" y="160.0" font-size="14" fill="#3657c8" text-anchor="middle">the algorithm, in floats</text>
<path d="M158,212 C 280,250 470,250 592,214" fill="none" stroke="#2b2733" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="300.0" y="262.0" font-size="13" fill="#776f82" text-anchor="middle">exact f</text>
<line x1="110.0" y1="158.0" x2="146.0" y2="204.0" stroke="#c0392b" stroke-width="2"/>
<text x="60.0" y="300.0" font-size="14" fill="#c0392b" text-anchor="start">backward error: how far x̂ is from x</text>
<line x1="524.0" y1="158.0" x2="596.0" y2="204.0" stroke="#c0392b" stroke-width="2"/>
<text x="440.0" y="300.0" font-size="14" fill="#c0392b" text-anchor="start">forward error: how far ŷ is from f(x)</text>
<text x="360.0" y="340.0" font-size="16" fill="#2b2733" text-anchor="middle" font-weight="600">forward error  ≤  condition number κ  ×  backward error</text>
<text x="360.0" y="364.0" font-size="13" fill="#776f82" text-anchor="middle">(κ belongs to the problem f; the backward error belongs to the algorithm)</text>
</svg>
