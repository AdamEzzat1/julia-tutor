<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2733">
<title>One state, two conventions</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#776f82"/></marker></defs>
<rect width="680" height="300" fill="#ffffff"/>
<text x="20" y="28" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">The state with only the first qubit set, in two conventions</text>
<rect x="20" y="50" width="280" height="200" rx="8" fill="#7b4bb8" fill-opacity="0.07" stroke="#7b4bb8" stroke-width="1.5"/>
<text x="160" y="76" font-size="14" fill="#7b4bb8" text-anchor="middle" font-weight="600">little-endian (this course, Qiskit)</text>
<text x="90" y="136" font-size="30" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">0</text>
<text x="90" y="160" font-size="12" fill="#776f82" text-anchor="middle" >qubit 2</text>
<text x="160" y="136" font-size="30" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">0</text>
<text x="160" y="160" font-size="12" fill="#776f82" text-anchor="middle" >qubit 1</text>
<text x="230" y="136" font-size="30" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">1</text>
<text x="230" y="160" font-size="12" fill="#776f82" text-anchor="middle" >qubit 0</text>
<text x="160" y="200" font-size="14" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">printed 001</text>
<text x="160" y="224" font-size="14" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">outcome k = 1</text>
<rect x="380" y="50" width="280" height="200" rx="8" fill="#3657c8" fill-opacity="0.07" stroke="#3657c8" stroke-width="1.5"/>
<text x="520" y="76" font-size="14" fill="#3657c8" text-anchor="middle" font-weight="600">big-endian (most textbooks)</text>
<text x="450" y="136" font-size="30" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">1</text>
<text x="450" y="160" font-size="12" fill="#776f82" text-anchor="middle" >qubit 1</text>
<text x="520" y="136" font-size="30" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">0</text>
<text x="520" y="160" font-size="12" fill="#776f82" text-anchor="middle" >qubit 2</text>
<text x="590" y="136" font-size="30" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">0</text>
<text x="590" y="160" font-size="12" fill="#776f82" text-anchor="middle" >qubit 3</text>
<text x="520" y="200" font-size="14" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">printed 100</text>
<text x="520" y="224" font-size="14" fill="#2b2733" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">outcome k = 4</text>
<line x1="304" y1="150" x2="374" y2="150" stroke="#776f82" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="340" y="140" font-size="12" fill="#776f82" text-anchor="middle" >reverse</text>
<text x="340" y="176" font-size="12" fill="#776f82" text-anchor="middle" >the bits</text>
<text x="20" y="284" font-size="12" fill="#776f82" text-anchor="start" >Textbooks number qubits from 1 and print the first one leftmost; the course's qubit 0 is the textbook's qubit 1.</text>
</svg>
