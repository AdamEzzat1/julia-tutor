<text x="348.0" y="217.0" font-size="14" fill="#2f8a4c" text-anchor="end" font-weight="600">optimum (2/3, 1/3)</text>
<text x="434.0" y="128.0" font-size="14" fill="#2b2733" text-anchor="start" font-weight="600">∇f</text>
<text x="416.0" y="162.0" font-size="14" fill="#3657c8" text-anchor="start" font-weight="600">∇h</text>
<text x="480.0" y="70.0" font-size="15" fill="#2b2733" text-anchor="start" font-weight="600">min x² + 2y² on x + y = 1</text>
<text x="480.0" y="98.0" font-size="13" fill="#776f82" text-anchor="start">Ellipses: level sets of f.</text>
<text x="480.0" y="118.0" font-size="13" fill="#776f82" text-anchor="start">Solid one: f = 2/3, the optimum.</text>
<text x="480.0" y="146.0" font-size="13" fill="#2b2733" text-anchor="start">At the optimum the ellipse</text>
<text x="480.0" y="164.0" font-size="13" fill="#2b2733" text-anchor="start">touches the line, so ∇f is</text>
<text x="480.0" y="182.0" font-size="13" fill="#2b2733" text-anchor="start">parallel to the line's normal:</text>
<text x="480.0" y="206.0" font-size="14" fill="#3657c8" text-anchor="start" font-weight="600">∇f = λ ∇h with λ = 4/3</text>
<text x="480.0" y="240.0" font-size="13" fill="#2b2733" text-anchor="start">Black arrow: ∇f = (4/3, 4/3)</text>
<text x="480.0" y="258.0" font-size="13" fill="#3657c8" text-anchor="start">Blue arrow: ∇h = (1, 1)</text>
<text x="480.0" y="290.0" font-size="13" fill="#776f82" text-anchor="start">Anywhere else on the line,</text>
<text x="480.0" y="308.0" font-size="13" fill="#776f82" text-anchor="start">sliding along it lowers f.</text>
